<script>
// 出错时把错误直接显示在屏幕上（黑屏时截图给开发者就能定位）。
// 同一条错误只占一行（后面记次数）；截完图点一下红框就关掉，免得一直挡住血量和弹药。
// 关掉之后同一条错误不再弹出，出现新的错误才会重新显示。
(function () {
  var box = null, seen = {}, lines = [];
  function where(e) {
    if (!e.filename) return '';
    var f = String(e.filename).split(/[?#]/)[0].split('/').pop();
    try { f = decodeURIComponent(f); } catch (x) { /* 解不开就保留原样 */ }
    return '  @' + f + ':' + e.lineno;
  }
  function render() {
    var out = '出错了（请截图）—— 截完图点这里关闭\n';
    for (var i = 0; i < lines.length; i++) out += lines[i] + (seen[lines[i]] > 1 ? '  ×' + seen[lines[i]] : '') + '\n';
    box.textContent = out;
  }
  function hide() { if (box && box.parentNode) box.parentNode.removeChild(box); box = null; lines = []; }
  function show(m) {
    m = String(m);
    if (seen[m]) { seen[m]++; if (box && lines.indexOf(m) >= 0) render(); return; }
    seen[m] = 1; lines.push(m);
    if (!box) {
      box = document.createElement('pre'); box.id = 'errbox'; box.title = '点击关闭';
      box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;margin:0;padding:10px;background:rgba(80,0,0,.92);color:#fff;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;cursor:pointer';
      box.addEventListener('mousedown', function (e) { e.stopPropagation(); });   // 点红框不算开枪、不算点菜单
      box.addEventListener('click', hide);
      (document.body || document.documentElement).appendChild(box);
    }
    render();
  }
  window.addEventListener('error', function (e) { show((e.message || e) + where(e)); });
  window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
})();
</script>

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);

<script>/* world/grid.js */
'use strict';
// 地图网格、格子常量、门的开关状态

// ---------------------------------------------------------------- 地图
// 网格尺寸是**每张地图各自**的（计划 §4：地图 1 精修后扩到 80×64）。
//   · MAX_MW / MAX_MH 是所有地图的上限，全部定长数组按它一次性分配，切换地图不再重新分配
//   · MW / MH 是**当前地图**的尺寸，由 useLevel() → setMapSize() 设置
// 索引一律是 y * MW + x（用当前 MW），所以数组里超出当前地图的那部分就是闲置内存。
// 遍历整张图时必须用 MW / MH，绝对不要用数组的 .length（那是上限，不是当前尺寸）。
const T = 48, MAX_MW = 96, MAX_MH = 80;
const GRID_CAP = MAX_MW * MAX_MH;
let MW = 64, MH = 48;
const grid = new Uint8Array(GRID_CAP);     // 0墙 1地板 2门 3锁门 4家具
const roomAt = new Int16Array(GRID_CAP);
const doorSafe = new Uint8Array(GRID_CAP); // 1 = 通往安全屋的门（任何怪物都打不开、撞不开）
// 切换地图时设置当前网格尺寸。超过上限直接报错，不要静默截断
function setMapSize(w = 64, h = 48) {
  if (!Number.isInteger(w) || !Number.isInteger(h) || w < 8 || h < 8 || w > MAX_MW || h > MAX_MH) {
    throw new Error(`地图尺寸 ${w}×${h} 非法（上限 ${MAX_MW}×${MAX_MH}，见 world/grid.js）`);
  }
  MW = w; MH = h;
}
const SAVE_VERSION = 5;  // v3：背包改为格子 + 道具箱；v4：事件改为触发器 + 多地图状态；v5：背包不限格数、取消道具箱（旧存档箱子里的东西放进背包）
const doorKey = (x, y) => `${x},${y}`;
function isDoor(tx, ty) { return grid[ty * MW + tx] === 2 || grid[ty * MW + tx] === 3; }
function isDoorOpen(tx, ty) { return !!(S && S.doors && S.doors[doorKey(tx, ty)]); }
function setDoorOpen(tx, ty, open) { if (!S.doors) S.doors = {}; S.doors[doorKey(tx, ty)] = !!open; }
</script>

<script>/* world/tiles.js */
'use strict';
// 格子属性查询（墙、遮挡、可通行）与地图构建

function solidT(tx, ty) { if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true; const v = grid[ty * MW + tx]; return v === 0 || v === 3 || v === 4 || (v === 2 && !isDoorOpen(tx, ty)); }
function opaqueT(tx, ty) { if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true; const v = grid[ty * MW + tx]; return v === 0 || v === 3 || (v === 2 && !isDoorOpen(tx, ty)); }
function passT(tx, ty) { if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return false; const v = grid[ty * MW + tx]; return v === 1 || (v === 2 && isDoorOpen(tx, ty)); }

function buildMap() {
  grid.fill(0); roomAt.fill(-1);
  ROOMS.forEach((r, i) => { for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) { grid[y * MW + x] = 1; roomAt[y * MW + x] = i; } });
  if (!S.doors) S.doors = {};
  for (const [x, y] of DOORS) {
    const k = LOCKS[x + ',' + y];
    grid[y * MW + x] = (k && !S.unlocked.includes(doorKey(x, y))) ? 3 : 2;
    if (!(doorKey(x, y) in S.doors)) S.doors[doorKey(x, y)] = false;
    roomAt[y * MW + x] = -2;
  }
  for (const [x, y, w, h] of FURN) for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) grid[j * MW + i] = 4;
  // 与安全屋相邻的门
  doorSafe.fill(0);
  for (const [x, y] of DOORS) {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      const ri = roomAt[ny * MW + nx]; if (ri >= 0 && ROOMS[ri].safe) doorSafe[y * MW + x] = 1;
    }
  }
}
</script>

const mc = mapC.getContext('2d');
function roomOf(tx, ty) {

<script>/* world/physics.js */
'use strict';
// 射线、视线/直线可达判断、碰撞与移动

// ---------------------------------------------------------------- 射线
function ray(x, y, a, max, block) {
  const dx = Math.cos(a), dy = Math.sin(a);
  const px = x / T, py = y / T;
  let mx = Math.floor(px), my = Math.floor(py);
  const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
  const sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
  let sdx = dx < 0 ? (px - mx) * ddx : (mx + 1 - px) * ddx;
  let sdy = dy < 0 ? (py - my) * ddy : (my + 1 - py) * ddy;
  const maxT = max / T;
  for (let n = 0; n < 200; n++) {
    let d;
    if (sdx < sdy) { d = sdx; sdx += ddx; mx += sx; } else { d = sdy; sdy += ddy; my += sy; }
    if (d > maxT) return max;
    if (block(mx, my)) return d * T;
  }
  return max;
}
const losClear = (x1, y1, x2, y2) => { const d = dist(x1, y1, x2, y2); return ray(x1, y1, Math.atan2(y2 - y1, x2 - x1), d, opaqueT) >= d - 1; };
const walkClear = (x1, y1, x2, y2) => { const d = dist(x1, y1, x2, y2); return ray(x1, y1, Math.atan2(y2 - y1, x2 - x1), d, solidT) >= d - 1; };

// ---------------------------------------------------------------- 碰撞
function collide(e) {
  const r = e.r;
  for (let pass = 0; pass < 3; pass++) {
    const x0 = Math.floor((e.x - r) / T), x1 = Math.floor((e.x + r) / T), y0 = Math.floor((e.y - r) / T), y1 = Math.floor((e.y + r) / T);
    let fixed = false;
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (!solidT(tx, ty)) continue;
      const nx = clamp(e.x, tx * T, tx * T + T), ny = clamp(e.y, ty * T, ty * T + T);
      let dx = e.x - nx, dy = e.y - ny, d = Math.hypot(dx, dy);
      if (d < r) {
        if (d > 0.0001) { e.x += dx / d * (r - d + 0.05); e.y += dy / d * (r - d + 0.05); }
        else {
          const left = e.x - tx * T, right = tx * T + T - e.x, top = e.y - ty * T, bottom = ty * T + T - e.y;
          const m = Math.min(left, right, top, bottom);
          if (m === left) e.x = tx * T - r - 0.05; else if (m === right) e.x = tx * T + T + r + 0.05; else if (m === top) e.y = ty * T - r - 0.05; else e.y = ty * T + T + r + 0.05;
        }
        fixed = true;
      }
    }
    if (!fixed) break;
  }
}

  for (let i = 0; i < n; i++) { e.x += dx / n; collide(e); e.y += dy / n; collide(e); }
}

    case 'gl': return { id: 'gl', n: 1 };
    case 'glammo': return { id: 'ammo_fire', n: it.v };
    case 'glbomb': return { id: 'ammo_bomb', n: it.v };
    case 'glacid': return { id: 'ammo_acid', n: it.v };
    default: return null;
  }
}

<script>/* config/rank.js */
'use strict';
// 通关评级（计划 7.7）。结算画面在 ui/screens.js（calcRank / winReport / drawWin）。
//
//   结算时间 = 通关时间 + 罚时
//   罚时只看两项，都是「前几次不算，之后每次加时」：
//     · 存档：前 5 次不算（全流程正好 5 台打字机，每台存一次），之后每次 +60 秒
//     · 治疗：前 5 次不算（用掉任何一件恢复品算一次，混合草药也算一次），之后每次 +30 秒
//   结算时间 ≤ 50 分钟 = S，≤ 75 分钟 = A，≤ 105 分钟 = B，再慢就是 C。
//
// 为什么这样定（详见计划 7.7）：
//   · 完整版首通目标 60–90 分钟（计划 9.1）。正常首通（存档、治疗各十来次）应该落在 A / B，
//     S 留给熟悉路线的二周目。demo 的「10 分钟内 = S」会让所有人都是 C。
//   · 用罚时，不用硬门槛（比如「存档超过 5 次就拿不到 S」）：真实通关时间还没实测，
//     门槛定错了，S 要么拿不到、要么白送；罚时定错了只差几分钟。结算画面也能直接告诉玩家
//     「结算时间再缩短多少就升一档」。
//   · 击倒数、命中率只展示，不计分：游戏要玩家躲开处刑者而不是跟它硬拼（计划 6.5），
//     按击杀算分等于奖励相反的玩法；命中率又太受武器影响（冲锋枪是压制武器，连射越打越散）。
//
// ⚠️ 这些数字是暂定值，等第一次完整通关拿到真实时间后再校准。
//    改了要同步改计划 7.7 —— tools/check-plan.js 会双向核对。
const RANK = {
  // 结算时间上限（秒），按 S → A → B 排列；三档都超过就是 lowest
  tiers: [['S', 50 * 60], ['A', 75 * 60], ['B', 105 * 60]],
  lowest: 'C',
  savePenalty: { free: 5, per: 60 },   // 存档：前 5 次不罚，之后每次 +60 秒
  healPenalty: { free: 5, per: 30 },   // 治疗：前 5 次不罚，之后每次 +30 秒
  // 结算画面「各地图用时」那一行用的简称（地图全名太长）
  mapShort: { map1: '宅邸', map2: '研究所', map3: '制药厂' },
  color: { S: '#ffd040', A: '#e8d8a0', B: '#c8c8c8', C: '#a8988a' },
};

<script>/* world/level.js */
'use strict';
// 关卡管理器：当前地图的数据、切换地图、每张地图单独保存状态

// 当前地图的数据（useLevel 设置）。其余代码直接读这些变量。
let LEVEL = null, ROOMS = [], DOORS = [], LOCKS = {}, FURN = [], LAMPS = [], PAD = null, EXITS = [];
// 每张地图单独保存的状态；当前地图的这些字段就在 S 上，离开时存进 S.maps[地图id]
const PER_MAP_KEYS = ['items', 'enemies', 'doors', 'unlocked', 'doorBash', 'visited'];
const LOAD_FADE_OUT = 0.35, LOAD_HOLD = 0.35, LOAD_FADE_IN = 0.45;  // 切换地图：淡出 → 读取画面 → 淡入（秒）

function useLevel(id) {
  const L = LEVELS[id];
  if (!L) throw new Error(`没有这张地图：${id}`);
  setMapSize(L.w || 64, L.h || 48);   // 每张地图各自的网格尺寸（不写就是 64×48）
  LEVEL = L; ROOMS = L.rooms; DOORS = L.doors; LOCKS = L.locks || {}; FURN = L.furn || []; LAMPS = L.lamps || []; EXITS = L.exits || [];
  PAD = L.pad ? { x: L.pad.x * T, y: L.pad.y * T } : null;
}
// 一张地图第一次进入时的状态
function freshLevelState(id) {
  const L = LEVELS[id];
  return {
    items: makeItems(L.items || []), enemies: makeEnemies(L.enemies || []),
    doors: Object.fromEntries(L.doors.map(([x, y]) => [doorKey(x, y), false])), unlocked: [], doorBash: {}, visited: {},
  };
}
function stashLevel() {
  const st = {};
  for (const k of PER_MAP_KEYS) st[k] = S[k];
  for (const e of st.enemies) { e.heard = null; e.heardField = null; e.lastSeen = null; }
  S.maps[S.map] = st;
}
function restoreLevel(id) {
  const st = S.maps[id] || freshLevelState(id);
  delete S.maps[id];
  for (const k of PER_MAP_KEYS) S[k] = st[k];
  EID = Math.max(EID, S.enemies.reduce((m, e) => Math.max(m, e.id + 1), 0));
}
// 切换地图。instant：立即完成（测试和读档用）；否则进入 loading 模式，淡出 → 读取画面 → 淡入
function gotoLevel(id, at, a, instant) {
  if (!LEVELS[id]) { msg(`[错误] 没有这张地图：${id}`, 4); return false; }
  if (instant) { swapLevel(id, at, a); return true; }
  mode = 'loading'; P.load = { id, at, a, t: 0, swapped: false };
  return true;
}
function swapLevel(id, at, a) {
  S.cineLift = null;
  if (!S.maps) S.maps = {};
  if (id !== S.map) {
    // 记下离开这张地图时的游戏时间，结算画面据此算出每张地图各玩了多久（ui/screens.js 的 mapSplits）
    if (S.stats) S.stats.split = { ...(S.stats.split || {}), [S.map]: S.time };
    execBeforeLeave(id); stashLevel(); useLevel(id); restoreLevel(id); S.map = id;   // 处刑者：目标地图有入口就跟过去（计划 3.6）
  }
  const L = LEVELS[id], pos = at || [L.start.x, L.start.y];
  S.p.x = pos[0] * T; S.p.y = pos[1] * T; S.p.a = a ?? L.start.a ?? S.p.a;

<script>/* player/inventory.js */
'use strict';
// 背包：格子、堆叠、拾取、使用、草药混合、快速治疗（计划 6.4、7.5）
// 数据：S.p.inv = { size, slots: [ { id, n } | null, … ] }，size 总是等于 slots.length，而且是整行（INV_ROW 的倍数）。
// v1.0.1 起背包不限格数：格子不够就往后加一行，末尾空出来的整行会收回（至少 INV_START 格）。取消了腰包和道具箱。

  for (const [id, n] of list) invAdd(inv, id, n);
  return inv;
}
function inv() { return S.p.inv; }
function invUsed(v = inv()) { return v.slots.filter(Boolean).length; }
function invFree(v = inv()) { return v.size - invUsed(v); }
function invCount(id, v = inv()) { return v.slots.reduce((s, x) => s + (x && x.id === id ? x.n : 0), 0); }

function invFit(v) {
  while (v.slots.length < INV_START || v.slots.length % INV_ROW) v.slots.push(null);
  while (v.slots.length > INV_START && v.slots.slice(-INV_ROW).every(s => !s)) v.slots.length -= INV_ROW;
  v.size = v.slots.length;
  return v;
}
// 放入 n 个 id：先补满已有的同类堆叠，再占空格，格子不够就往后加一行。不限格数，总是全部放下（返回 0 = 没有放不下的）
function invAdd(v, id, n = 1) {
  const max = ITEMS[id].max;

}

function glCur() {

}

// ---------------------------------------------------------------- 拾取

// 使用一件恢复品（按 id）。返回是否用掉
function useHealItem(id) {

}

function combineSlots(i, j) {
  const v = inv(), a = v.slots[i], b = v.slots[j];

  const r = mixResult(a.id, b.id);
  if (!r) { sfx('locked'); msg(`${ITEMS[a.id].name} 和 ${ITEMS[b.id].name} 不能组合。`, 2.5); return false; }
  v.slots[i] = { id: r, n: 1 }; v.slots[j] = null; invFit(v);
  sfx('pickup'); msg(`组合成了 ${ITEMS[r].name}。`, 2.5);
  return true;
}
// Q：快速治疗
function pickQuickHeal(hp = S.p.hp) {
  const miss = 100 - hp, have = HEAL_ORDER.filter(id => invHas(id));
  if (!have.length) return null;
  const enough = have.find(id => ITEMS[id].heal >= miss);
  if (enough) return enough;
  return have.reduce((b, id) => ITEMS[id].heal > ITEMS[b].heal ? id : b, have[0]);
}
function quickHeal() {
  if (S.p.hp >= 100) { msg('现在不需要治疗。'); return false; }
  const id = pickQuickHeal();
  if (!id) { msg('没有可用的恢复品。'); return false; }
  return useHealItem(id);
}
function useSpray() {
  if (!invHas('spray')) { msg('没有急救喷雾。'); return false; }
  return useHealItem('spray');
}

// ---------------------------------------------------------------- 旧存档迁移（v2 及以前：零散计数 → 格子）
function migrateInventory(oldP) {
  const v = newInventory();
  const put = (id, n) => { if (n > 0) invAdd(v, id, n); };   // 不限格数，全部放得下
  const res = oldP.res || {}, mixes = oldP.mixes || {};

  if (oldP.hasShotgun) put('shotgun', 1);
  put('ammo_pistol', res.pistol || 0); put('ammo_shotgun', res.shotgun || 0);
  put('herb_g', oldP.herb === undefined ? 0 : oldP.herb); put('herb_r', oldP.red || 0); put('herb_b', oldP.blue || 0);
  put('mix_gg', mixes.gg || 0); put('mix_gr', mixes.gr || 0); put('mix_gb', mixes.gb || 0); put('mix_grb', mixes.grb || 0);

<script>/* audio/audio.js */
'use strict';
// 程序合成音效与环境音

// ---------------------------------------------------------------- 音频
const AU = { c: null, m: null, nb: null, amb: false, out: null, panScale: 1 }; // panScale：立体声强度（设置里可改为 0 = 单声道）

function auOut() { return AU.out || AU.sfxBus || AU.m; }

  const s = c.createBufferSource(); s.buffer = bufs[Math.floor(Math.random() * bufs.length)]; s.playbackRate.value = rand(0.9, 1.08);

function sfxAt(n, x, y, v = 1, maxDist = 900, min = 0) { return withSpatial(x, y, maxDist, min, () => sfx(n, v)); }
function groanAt(x, y, v = 1, low = false, maxDist = 650, min = 0, kind = 'idle') {
  if (low) return withSpatial(x, y, maxDist, min, () => groan(v, low, kind));
  return voicedAt('zombie.' + kind, ZOMBIE_PRI[kind] ?? 0, x, y, maxDist, min, () => groan(v, low, kind));   // 丧尸叫声也走怪物叫声管理（audio/creatures.js）
}

function startAmbient() {

// ---------------------------------------------------------------- 播放
// 变体按需生成：第一次叫只生成 1 条（最慢的拉撒路群声也就 0.1 秒左右），之后每叫一次补 1 条，直到 n 条。
// 切换地图的黑屏期间（world/level.js 的 updateLoading）会把这张图用得到的叫声先补齐，所以正常游玩时基本不会现生成。
function cryBank(species, act) {
  const c = CRIES[species] && CRIES[species][act]; if (!c || !AU.c) return null;
  AU.cries = AU.cries || {};
  return AU.cries[species + '.' + act] || (AU.cries[species + '.' + act] = []);
}
function cryGrow(species, act) {
  const c = CRIES[species][act], bank = cryBank(species, act);
  if (!bank || bank.length >= c.n) return false;
  const sr = AU.c.sampleRate, d = c.make(sr, Math.random), b = AU.c.createBuffer(1, d.length, sr);
  b.getChannelData(0).set(d); bank.push(b);
  return true;
}
function cry(species, act, v = 1) {
  if (!AU.c || v < 0.02) return;
  const c = CRIES[species] && CRIES[species][act]; if (!c) return;
  const bank = cryBank(species, act);
  if (bank.length < c.n) cryGrow(species, act);
  const s = AU.c.createBufferSource(); s.buffer = bank[Math.floor(Math.random() * bank.length)]; s.playbackRate.value = rand(c.rate[0], c.rate[1]);
  const g = AU.c.createGain(); g.gain.value = v * c.gain;
  s.connect(g); g.connect(auOut()); s.start(AU.c.currentTime);
  voiceStarted(s, g, s.buffer.duration / s.playbackRate.value);
}
function cryAt(species, act, x, y, v = 1, maxDist = 700, min = 0) { return voicedAt(species + '.' + act, cryPri(species, act), x, y, maxDist, min, () => cry(species, act, v)); }

// ---------------------------------------------------------------- 怪物叫声管理（试玩反馈：「很多怪物堆在一起的时候有点吵」）
// 参考了几家的做法：
//   · DICE《战地》的 HDR 音频：每个声音有一个「设计响度」，按距离衰减后得到「听到的响度」；最响的声音决定一个
//     响度窗口的上沿，窗口以下的声音直接不放（剔除），窗口上沿升高时其余声音整体压低 —— 开枪时僵尸的嘟囔自然消失，
//     枪声过后 1–2 秒再慢慢回来。它不是压缩器：不改波形，只决定谁出声、多大声。
//   · Wwise 的「同类声音实例上限」：同一种敌人的同一种叫法同时只放 1 个，多余的丢掉（《Scars Above》对敌人声音就是这么做的）。
//   · 《僵尸世界大战》：普通僵尸发现你时只吼一声，追击时只有持续的低声喘吼，不会一路大喊。
//   · Fatshark《暗潮》：提示音太多就不再是提示；危险提示（能伤到玩家的前摇）优先，其余能省则省；远处的声音要有远处的频响。
// 落到这里：
//   优先级 3 提示音（前摇、Boss）：永远播放，不被剔除、不被压低；并把正在播的闲聊声压低一半
//   优先级 2 发现你 / 扑咬：同一种叫法 0.8 秒内只放 1 声（五只僵尸同时发现你 → 一声嘶吼）
//   优先级 1 中弹 / 倒下：同时最多 2 个，两声之间至少隔 0.4 秒
//   优先级 0 平时的叫声：同时最多 2 个，全局每 1.2 秒最多开口一次，有别的声音在响时远处的不叫
//   再加 HDR 响度窗口 + 距离越远高频越少（空气吸收），远处的怪退到背景里。
const VOICE = { max: 5, idleMax: 2, idleGap: 1.2, hurtMax: 2, hurtGap: 0.4, dupWin: 0.8, dupMax: 1, duck: 0.5, farIdle: 0.35, bigGap: 3.5 };
// HDR：window 窗口宽度（dB）· floor 窗口上沿的最低位置 · release 上沿回落速度（dB/秒）
const HDR = { window: 16, floor: -6, release: 8 };
// 各优先级的设计响度（dB，贴身时）
const PRI_DB = [-14, -9, -5, -2];
const ZOMBIE_PRI = { idle: 0, hurt: 1, attack: 2 };
const CRY_IDLE = { 'dog.growl': 1, 'hunter.chitter': 1, 'licker.clicks': 1, 'slime.bubble': 1, 'parasite.chitter': 1, 'bloater.idle': 1 };
const CRY_HURT = { pain: 1, yelp: 1, whine: 1, hurt: 1 };
const CRY_CUE = { 'hunter.hiss': 1, 'hunter.shriek': 1, 'slime.gloop': 1, 'tentacle.rumble': 1, 'tentacle.burst': 1, 'vine.creak': 1, 'licker.screech': 1 };
const CRY_BOSS = { executioner: 1, berserk: 1, lazarus: 1 };
// Boss 的「满口咆哮」（1.6–2.6 秒的大叫，不是短促的闷哼）。优先级 3 不受 HDR 和各种上限约束，
// 但这几声彼此之间必须留白：Boss 每次出招都吼一嗓子的话，冲撞间隔才 2.5–4 秒，
// 一段 30 秒的阶段二里有 25 秒都是它在吼，从头吵到尾（试玩反馈）。短促的 grunt 不在此列，照常发声。
const CRY_BIG = { 'lazarus.roar': 1, 'lazarus.moan': 1, 'executioner.roar': 1, 'berserk.roar': 1 };
function cryPri(species, act) {
  const k = species + '.' + act;
  if (CRY_BOSS[species] || CRY_CUE[k]) return 3;
  if (CRY_IDLE[k]) return 0;
  if (CRY_HURT[act]) return 1;
  return 2;
}
// 怪物叫声总线：整体比其他音效低一点（原来一群怪一起叫时会盖过枪声和脚步）
function crBus() {
  if (!AU.c) return null;
  if (!AU.crBus) { AU.crBus = AU.c.createGain(); AU.crBus.gain.value = 0.8; AU.crBus.connect(AU.sfxBus || AU.m); }
  return AU.crBus;
}
// HDR 窗口上沿：随时间回落，被更响的声音推高
function hdrTop() {
  const H = AU.hdr || (AU.hdr = { top: HDR.floor, t: AU.c.currentTime }), now = AU.c.currentTime;

  return H;
}
// 很响的非怪物声音（开枪、爆炸）也推高窗口：audio.js 的 sfx() 调用
const HDR_SFX = { pistol: -3, smg: -3, shotgun: 0, magnum: 0, explode: 0, railgun: 0 };
function hdrPush(db) { if (!AU.c) return; const H = hdrTop(); H.top = Math.max(H.top, db); }
// 决定这一声放不放、放多大。返回 null = 不放；否则 rec.scale 是 HDR 给的音量倍数
function voiceBegin(key, pri, gain) {
  const now = AU.c.currentTime;

'use strict';
// 追击音乐（计划 3.4）：处刑者进入追击后，低频鼓点逐渐加入；失去目标后 8 秒内淡出。

const MUSIC = { level: 0, beatT: 0, beat: 0, bus: null };

function musicBus() {
  if (!AU.c) return null;
  if (!MUSIC.bus) { MUSIC.bus = AU.c.createGain(); MUSIC.bus.gain.value = CHASE_MUSIC.vol; MUSIC.bus.connect(AU.ambBus || AU.m); }
  return MUSIC.bus;
}
function resetChaseMusic() { MUSIC.level = 0; MUSIC.beatT = 0; MUSIC.beat = 0; }

function updateChaseMusic(dt) {
  const C = CHASE_MUSIC, ex = activeExecutioner();

  const chasing = (!!ex && isChasing(ex) && !inSafe()) || bz;

'use strict';
// 游戏内计时器（随游戏时间推进，可存档）

// 游戏内计时器：暂停、阅读文件和存档都不会丢失事件；不使用浏览器延迟回调。
// 计时器记着自己属于哪张地图，玩家不在那张地图时不走（回来后继续）。
function scheduleTimer(type, seconds) {
  if (!S.timers) S.timers = [];

}
// 触发器的延时 / 重复动作；every 给了就每隔 every 秒重复，until 标记为真时停止
function scheduleActions(seconds, actions, every, until) {

  const t = { id: `${S.time.toFixed(3)}-${Math.random().toString(36).slice(2)}`, type: 'actions', left: seconds, map: S.map, do: actions };

}

  S.timers = S.timers.filter(t => !(t.until && S.flags[t.until]));
  for (const timer of S.timers) if (timerHere(timer)) timer.left -= dt;
  const due = S.timers.filter(timer => timer.left <= 0);
  S.timers = S.timers.filter(timer => timer.left > 0);

    } else if (timer.type === 'shieldAmbush' && !S.flags.ambushFired) {

      runActions(LEVELS.map1.scripts.ambush, 'ambush');

// 触发器引擎：读取 config/triggers.js 里当前地图的事件脚本并执行
// 触发记录在 S.fired['地图id:触发器id']，延时动作放进游戏内计时器，都随存档保存。

const TRIGGER_ON = ['enter', 'enterSafe', 'pickup', 'kill', 'flag', 'near'];
let trigDepth = 0;  // 防止“设置标记 → 触发 → 再设置标记”无限循环

function trigKey(t) { return `${S.map}:${t.id}`; }
function trigCond(c) {
  if (!c) return true;
  if (c.flags && !c.flags.every(f => S.flags[f])) return false;
  if (c.notFlags && c.notFlags.some(f => S.flags[f])) return false;
  if (c.keys && !c.keys.every(k => S.p.keys[k])) return false;
  if (c.notKeys && c.notKeys.some(k => S.p.keys[k])) return false;
  return true;
}
function trigMatches(on, type, d) {
  switch (type) {
    case 'enter': return (on.enter !== undefined && on.enter === d.room) || (!!on.enterSafe && !!d.safe);
    case 'pickup': return on.pickup === d.t && (on.v === undefined || on.v === d.v);
    case 'kill': return on.kill === 'any' || on.kill === d.t;
    case 'flag': return on.flag === d.flag;
    default: return false;
  }
}
function fireTrigger(t) {
  if (t.once !== false) { if (S.fired[trigKey(t)]) return false; S.fired[trigKey(t)] = true; }
  runActions(t.do, t.id);
  return true;
}
// 游戏里发生了某件事：enter / pickup / kill / flag
function fireEvent(type, data) {
  if (!LEVEL || !LEVEL.triggers || trigDepth > 8) return;
  if (!S.fired) S.fired = {};
  trigDepth++;
  try {
    for (const t of LEVEL.triggers) {
      if (!t.on || t.on.near) continue;
      if (trigMatches(t.on, type, data || {}) && trigCond(t.if)) fireTrigger(t);
    }
  } finally { trigDepth--; }
}
// 每帧：检查“走到某处附近”的触发器
function updateTriggers() {
  if (!LEVEL || !LEVEL.triggers) return;
  if (!S.fired) S.fired = {};
  for (const t of LEVEL.triggers) {
    if (!t.on || !t.on.near || !trigCond(t.if)) continue;
    if (t.once !== false && S.fired[trigKey(t)]) continue;
    const [x, y] = t.on.near;
    if (dist(S.p.x, S.p.y, x * T, y * T) < (t.on.r || 60)) fireTrigger(t);
    if (mode !== 'play') return;  // 通关、切换地图后不再继续
  }
}

// ---------------------------------------------------------------- 动作
const tp = v => (v + .5) * T;  // 格坐标（整数格的中心）→ 像素
const ACTIONS = {
  msg: a => msg(a.msg, a.sec),
  banner: a => { P.bannerT = 3; P.bannerTxt = a.banner; },
  sfx: a => a.at ? sfxAt(a.sfx, a.at[0] * T, a.at[1] * T, a.v ?? 1, a.max ?? 900, a.min ?? 0) : sfx(a.sfx, a.v ?? 1),
  groan: a => groanAt(a.groan[0] * T, a.groan[1] * T, a.v ?? 1, !!a.low, a.max ?? 650, a.min ?? 0),
  spawn: a => { for (const [t, x, y] of a.spawn) { const e = mkEnemy(t, x, y); if (a.alert) { e.alert = true; e.state = 'chase'; } S.enemies.push(e); } },
  spawnWave: a => {
    const w = a.spawnWave, [x0, y0, x1, y1] = w.area || [0, 0, MW, MH];
    const alive = S.enemies.filter(e => !e.dead && e.t === w.t && e.x > x0 * T && e.x < x1 * T && e.y > y0 * T && e.y < y1 * T).length;
    if (alive >= (w.maxAlive ?? 4)) return;
    const sp = w.points[Math.floor(rand(w.points.length))];
    if (dist(tp(sp[0]), tp(sp[1]), S.p.x, S.p.y) <= (w.minDist ?? 250)) return;
    const e = mkEnemy(w.t, sp[0], sp[1]); e.alert = true; S.enemies.push(e);
    groanAt(e.x, e.y, 0.7, false, 1200, 0.2);
  },
  // 砸碎一扇窗（LEVEL.windows 里的 id）：玻璃声 + 碎片 + 重画那一格墙
  breakWindow: a => {
    const w = (LEVEL.windows || []).find(w => w.id === a.breakWindow); if (!w) return;
    S.flags['win_' + w.id] = true; drawTileAt(w.x, w.y);
    sfxAt('glass', (w.x + .5) * T, (w.y + .5) * T, 1, 1100, 0.3);
    emitNoise((w.x + .5) * T, (w.y + .5) * T, NOISE.glass);
  },
  flag: a => { if (S.flags[a.flag]) return; S.flags[a.flag] = true; fireEvent('flag', { flag: a.flag }); },
  unflag: a => { delete S.flags[a.unflag]; },
  after: a => scheduleActions(a.after, a.do),
  every: a => scheduleActions(a.first ?? a.every, a.do, a.every, a.until),
  countdown: a => { S.countdown = { label: a.countdown.label, left: a.countdown.sec, do: a.countdown.do, map: S.map }; },
  objective: a => { S.objective = a.objective || null; },
  executioner: a => spawnExecutioner(a.executioner[0], a.executioner[1]),
  // 处刑者直奔 [x, y]：不在这张图就在那里登场；在的话，如果它离得远又不在玩家视野里，就挪过去，然后开始追
  execHunt: a => {
    const [x, y] = a.execHunt, e = activeExecutioner();
    if (!e) { if (S.executioner) S.executioner.follow = null; spawnExecutioner(x, y, true); const b = activeExecutioner(); if (b) exChase(b); sfxAt('bash', tp(x), tp(y), 1.3, 3000, 0.4); shake = Math.max(shake, 10); return; }
    if (e.frozenT > 0 || e.knockdownT > 0) return;   // 被冻着 / 倒地：那就是玩家赚到的时间
    if (dist(e.x, e.y, S.p.x, S.p.y) > 12 * T && !losClear(e.x, e.y, S.p.x, S.p.y)) { e.x = tp(x); e.y = tp(y); }
    exChase(e); sfxAt('bash', e.x, e.y, 1.3, 3000, 0.4); shake = Math.max(shake, 10);
  },
  unlock: a => { const [x, y] = a.unlock, k = doorKey(x, y); if (!S.unlocked.includes(k)) S.unlocked.push(k); if (grid[y * MW + x] === 3) grid[y * MW + x] = 2; drawTileAt(x, y); },
  // 锁上一扇门（Boss 战封门）：关上并从已解锁列表里去掉；门必须在 locks 里配了钥匙名（撞门时的提示）
  lockDoor: a => { const [x, y] = a.lockDoor, k = doorKey(x, y); S.unlocked = S.unlocked.filter(u => u !== k); setDoorOpen(x, y, false); if (LOCKS[k]) grid[y * MW + x] = 3; drawTileAt(x, y); },
  // 终点站台（ai/lazarus.js）：拉撒路登场、J 出现 / 离开
  lazarus: a => startLazarus(a.lazarus),
  jAppear: a => jAppear(a.jAppear, true),
  jLeave: () => jLeave(),
  openDoor: a => { const [x, y] = a.openDoor; if (grid[y * MW + x] === 2) { setDoorOpen(x, y, true); drawTileAt(x, y); } },
  goto: a => gotoLevel(a.goto, a.at, a.a),
  run: a => runActions((LEVEL.scripts || {})[a.run] || [], a.run),
  shake: a => { shake = Math.max(shake, a.shake); },
  win: () => { mode = 'win'; modeT = 0; },
  // 演出段：交出控制权 N 秒。then:'win' 表示演完直接进结算画面
  // 直升机坠毁演出（game/events.js）
  crash: () => startHeliCrash(),
  // 货运列车开走（game/events.js）：[x, y, w, h] 是列车这件家具的格子范围
  trainDepart: a => startTrainDepart(a.trainDepart, a),
  // 地图 3 结局（ai/lazarus.js）：列车 30 秒后发车、残骸的触手一路追；没赶上就死
  escapeStart: () => startEscape(),
  escapeFail: () => failEscape(),
  // 处刑者从二楼栏杆跳到 [x, y]（game/events.js）
  leap: a => startExecLeap(a.leap[0], a.leap[1]),
  // 收容舱从天上落下来（1.3 秒落地）
  pod: a => { S.pod = { x: (a.pod[0] + .5) * T, y: (a.pod[1] + .5) * T, t: 0, hatch: true }; },
  cine: a => { S.cine = Math.max(S.cine || 0, a.cine); S.cineLen = a.cine; S.cineT = 0; if (a.then) S.cineThen = a.then; const lf = a.lift && S.items.find(i => i.t === 'lift'); S.cineLift = lf ? { x: lf.x, y: lf.y } : null; },
};
const actionVerb = a => a && typeof a === 'object' ? Object.keys(a).find(k => k in ACTIONS) : undefined;
function runActions(list, src) {
  for (const a of list || []) {
    const v = actionVerb(a);
    if (!v) { console.warn(`[触发器 ${src}] 不认识的动作`, a); continue; }
    ACTIONS[v](a);
  }
}

// ---------------------------------------------------------------- 检查配置（npm test 会对每张地图调用）
function validateLevel(id) {
  const L = LEVELS[id], errs = [], roomIds = new Set(L.rooms.map(r => r.id));
  const seen = new Set();
  const checkActions = (list, where) => {
    if (!Array.isArray(list)) { errs.push(`${where}：do 必须是数组`); return; }
    list.forEach((a, i) => {
      const w = `${where} 第 ${i + 1} 个动作`, v = actionVerb(a);
      if (!v) { errs.push(`${w}：不认识的动作 ${JSON.stringify(a)}`); return; }
      if (v === 'spawn') for (const [t] of a.spawn) if (!EDEF[t]) errs.push(`${w}：没有这种敌人 ${t}`);
      if (v === 'breakWindow' && !(L.windows || []).some(x => x.id === a.breakWindow)) errs.push(`${w}：没有这扇窗 ${a.breakWindow}`);
      if (v === 'spawnWave' && !EDEF[a.spawnWave.t]) errs.push(`${w}：没有这种敌人 ${a.spawnWave.t}`);
      if (v === 'run' && !(L.scripts || {})[a.run]) errs.push(`${w}：没有这段脚本 ${a.run}`);
      if (v === 'goto' && !LEVELS[a.goto]) errs.push(`${w}：没有这张地图 ${a.goto}`);
      if ((v === 'unlock' || v === 'openDoor' || v === 'lockDoor') && !L.doors.some(([x, y]) => x === a[v][0] && y === a[v][1])) errs.push(`${w}：(${a[v]}) 不是门`);
      if (v === 'after' || v === 'every') checkActions(a.do, `${w}（延时）`);
      if (v === 'countdown') checkActions(a.countdown.do, `${w}（倒计时结束）`);
    });
  };
  for (const t of L.triggers || []) {
    const w = `地图 ${id} 触发器 ${t.id}`;
    if (!t.id) errs.push(`地图 ${id}：有触发器没有 id`);
    if (seen.has(t.id)) errs.push(`${w}：id 重复`); seen.add(t.id);
    const ons = Object.keys(t.on || {}).filter(k => TRIGGER_ON.includes(k));
    if (ons.length !== 1) errs.push(`${w}：on 里需要恰好一个条件（${TRIGGER_ON.join(' / ')}）`);
    if (t.on && t.on.enter !== undefined && !roomIds.has(t.on.enter)) errs.push(`${w}：没有这个房间 ${t.on.enter}`);
    if (t.on && t.on.kill && t.on.kill !== 'any' && !EDEF[t.on.kill]) errs.push(`${w}：没有这种敌人 ${t.on.kill}`);
    checkActions(t.do, w);
  }
  for (const [name, list] of Object.entries(L.scripts || {})) checkActions(list, `地图 ${id} 脚本 ${name}`);
  for (const ex of L.exits || []) if (!LEVELS[ex.to]) errs.push(`地图 ${id} 出口 (${ex.x},${ex.y})：没有这张地图 ${ex.to}`);
  // 处刑者的剧情入口（换地图后从这里跟来）必须在某个非安全屋的房间里
  if (L.execEntry) {
    const { x, y } = L.execEntry, r = L.rooms.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
    if (!r) errs.push(`地图 ${id} 处刑者入口 (${x},${y})：不在任何房间里`);
    else if (r.safe) errs.push(`地图 ${id} 处刑者入口 (${x},${y})：不能放在安全屋里`);
  }
  return errs;
}
</script>
<script>/* game/puzzles.js */
'use strict';
// 机关道具（prop）：能交互但拿不走的东西 —— 目前是画廊的四座半身像和天窗下的地板机关。
//
// 为什么做成 items 而不是家具：
//   · 家具画在缓存好的地砖图层上，转一下就要重画整块，而且家具没有每局变化的状态；
//   · items 本来就整体进存档（save.js 直接序列化 S.items），朝向 it.face 自动跟着存；
//   · findInteract() 已经会挑最近的 item，交互距离、遮挡规则全都免费复用。
// 代价是 PROPS 里的东西必须在「能捡的道具」相关的地方被排除掉（拾取、闪光、地图上的
// 「还有道具」标记），下面和 render/world.js、ui/screens.js 里都有对应处理。

const PROPS = { typewriter: 1, box: 1, bust: 1, plate: 1, safe: 1, altar: 1, lift: 1, switch: 1, fusebox: 1, console: 1, traindoor: 1, valve: 1, gunlocker: 1, ln2lever: 1, growlight: 1, glcase: 1, ladle: 1, trainConsole: 1, escapedoor: 1 };  // 不是战利品，只是能交互的场景物
const isProp = t => !!PROPS[t];

// 方位 → 屏幕方向。画布 y 轴向下，所以「北 = 上 = -y」。
// 这是全游戏「上北下南左西右东」的唯一定义处，渲染和文字都必须从这里取，
// 不许在别处另写一遍 —— 之前渲染里手搓了一个 face*90°-90°，整套朝向逆时针偏了一格：
// 名牌写着「面朝北」，像却指向屏幕左边。
const FACE_VEC = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // 0=北(上) 1=东(右) 2=南(下) 3=西(左)
// 半身像贴图的「鼻梁」是朝上画的，所以朝北时旋转量是 0
function bustSpriteAngle(face) { return face * Math.PI / 2; }

// ---------------------------------------------------------------- 半身像
function bustsOf() { return S.items.filter(it => it.t === 'bust'); }
function bustRight(it) { const b = BUSTS[it.v]; return !!b && it.face === b.want; }
function bustsCorrect() { return bustsOf().filter(bustRight).length; }

// 转一座像：顺时针 90°。转到位不给「叮」的反馈 —— 那等于把 256 种组合的谜题
// 降级成 16 次试错，家谱就白写了。想要提示的人去看天窗下的地板机关。
function turnBust(it) {
  const b = BUSTS[it.v];
  it.face = (it.face + 1) % 4;
  sfx('door', 0.5);
  emitNoise(it.x, it.y, NOISE.doorClose * 0.6);  // 石头磨地是有声音的，会引来东西
  msg(`「${b.name}」${b.note ? ' · ' + b.note : ''}　现在面朝：${FACE_NAME[it.face]}`, 3);
  checkBusts();
}

// 天窗下的地板机关：只报「对了几道」，不报是哪几道。
// 这是给丢了家谱的人留的保底，但**必须有代价**，否则它会变成比读文件更快的捷径：
// 踩下去要绞动整套铜杆，动静比开门还大（NOISE.glass 级），附近的东西会被引过来。
// 读家谱是安静的，硬试是吵的 —— 这就是「保底不是捷径」的落实方式。
function readPlate() {
  const n = bustsCorrect();
  if (S.flags.bustsSolved) { sfx('pickup', 0.4); msg('凹槽里的四道铜线都亮着。机关已经松开了。', 4); return; }
  sfx('locked', 0.8);
  emitNoise(S.p.x, S.p.y, NOISE.glass);   // 很吵：硬试是要付学费的
  msg(`你踩下地砖。边缘刻着方位罗盘，指北的那道朝向长厅深处。铜杆在脚下绞动，声音荡开——四道凹槽，此刻有 ${n} 道亮着。`, 5);
}

function checkBusts() {
  if (S.flags.bustsSolved) return;
  const list = bustsOf();
  if (!list.length || bustsCorrect() !== list.length) return;
  setFlag('bustsSolved');   // 开门、播音效、给提示都写在 config/triggers.js 里
}

// 给触发器用的统一入口：设标记并让 on:{flag} 的触发器跑起来
function setFlag(name) {
  if (S.flags[name]) return;
  S.flags[name] = true;
  fireEvent('flag', { flag: name });
}

// ---------------------------------------------------------------- 密码保险柜
// 打开后进入 mode 'safe'（游戏暂停，和读文件一样）。拨盘：←→ 选位、↑↓ 拨动、数字键直接输入、Enter 试开、Esc 离开。
// 试错的代价和地板机关一样：拉一下把手会响（NOISE.doorClose），附近的东西会被引过来。
// 不设次数上限 —— 锁死玩家的谜题只会逼人去查攻略。
const SAFE_UI = { it: null, digits: [], cur: 0, shake: 0, tries: 0 };

function openSafe(it) {
  const cfg = SAFES[it.v];
  if (!cfg) return;
  if (it.open) { msg(`${cfg.name}开着，里面已经空了。`, 3); return; }
  SAFE_UI.it = it; SAFE_UI.digits = new Array(cfg.code.length).fill(0); SAFE_UI.cur = 0; SAFE_UI.shake = 0;
  sfx('pickup', 0.3);
  mode = 'safe'; modeT = 0;
}
function closeSafe() { SAFE_UI.it = null; mode = 'play'; }

function trySafe() {
  const it = SAFE_UI.it, cfg = SAFES[it.v];
  if (SAFE_UI.digits.join('') === cfg.code) {
    it.open = true;                  // 保险柜本身留在原地（进存档），只是变成「开着」
    closeSafe();
    sfx('locked', 0.7); sfx('key', 0.9);
    giveReward(cfg.reward);
    if (cfg.flag) setFlag(cfg.flag);
    fireEvent('pickup', { t: 'safe', v: it.v });
    return true;
  }
  SAFE_UI.tries++; SAFE_UI.shake = 0.35;
  sfx('locked', 0.9);
  emitNoise(it.x, it.y, NOISE.doorClose);   // 拉把手是有动静的
  msg('把手纹丝不动。', 2);
  return false;
}

function giveReward(r) {
  if (!r) return;
  if (r.mod) {
    const m = MODS[r.mod];
    S.p.mods = S.p.mods || {}; S.p.mods[r.mod] = true;
    msg(`获得「${m.name}」—— ${m.desc}`, 5);
  }
  if (r.key) { S.p.keys[r.key] = true; msg(`获得「${KEYS[r.key].name}」`, 4); }
  if (r.items) for (const [id, n] of r.items) {
    invAdd(S.p.inv, id, n);   // 背包不限格数，总能放下
    if (ITEMS[id].kind === 'weapon') { S.p.mag[id] = r.loaded ?? WEAPONS[id].mag; msg(`获得 ${ITEMS[id].name}！按 ${WEAPON_SLOTS.findIndex(s => s.id === id) + 1} 或滚轮切换。`, 5); }
  }
}

// 配件对某把枪的某个属性的覆盖（比如消音器把 noise 改成 5、sfx 换成 suppressed）
function modVal(w, key, dflt) {
  const mods = S && S.p && S.p.mods;
  if (mods) for (const k in mods) if (mods[k] && MODS[k] && MODS[k].weapon === w && MODS[k][key] !== undefined) return MODS[k][key];
  return dflt;
}
// 弹匣容量（含配件）。射击、装填、HUD 一律从这里取，不要直接读 WEAPONS[w].mag
function magCap(w) {
  let cap = WEAPONS[w] ? WEAPONS[w].mag : 0;
  const mods = S && S.p && S.p.mods;
  if (mods) for (const k in mods) if (mods[k] && MODS[k] && MODS[k].weapon === w) cap += MODS[k].mag || 0;
  return cap;
}

function safeKey(e) {
  const d = SAFE_UI.digits, n = d.length;
  if (modeT < 0.15) return;
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': SAFE_UI.cur = (SAFE_UI.cur + n - 1) % n; sfx('step', 0.2); return;
    case 'ArrowRight': case 'KeyD': SAFE_UI.cur = (SAFE_UI.cur + 1) % n; sfx('step', 0.2); return;
    case 'ArrowUp': case 'KeyW': d[SAFE_UI.cur] = (d[SAFE_UI.cur] + 1) % 10; sfx('empty', 0.35); return;
    case 'ArrowDown': case 'KeyS': d[SAFE_UI.cur] = (d[SAFE_UI.cur] + 9) % 10; sfx('empty', 0.35); return;
    case 'Enter': case 'KeyE': case 'Space': trySafe(); return;
    case 'Escape': case 'Tab': closeSafe(); return;
  }
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
  if (m) { d[SAFE_UI.cur] = +m[1]; SAFE_UI.cur = Math.min(n - 1, SAFE_UI.cur + 1); sfx('empty', 0.35); }
}

function drawSafe(dt) {
  const it = SAFE_UI.it; if (!it) return;
  const cfg = SAFES[it.v], d = SAFE_UI.digits, n = d.length;
  SAFE_UI.shake = Math.max(0, SAFE_UI.shake - (dt || 0.016));
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);

<script>/* world/noise.js */
'use strict';
// 噪音传播（BFS）与敌人听觉

// 噪音从声源向外传播：半径单位是“格”，每走一格 -1，穿过关着的门时剩余半径减半。
// 听到噪音的敌人不会“知道玩家在哪”，只会前往声源调查（e.heard），看见玩家才转入追击。
// 队列容量要留余量：「穿过关着的门剩余半径减半」破坏了单调性，同一个格子可以被**重新入队**
// （先从门那边传来一个小值，之后从绕路方向传来更大的值）。按格子数分配会在复杂门结构 + 大半径时溢出，
// 而 TypedArray 越界写入是**静默丢弃**的：随后会读到 undefined → 索引变成 NaN → 噪音场悄悄算错且不报错。
// 所以给 4 倍余量，并在末尾加哨兵：真的溢出时宁可少传一点，也要在控制台说出来。
const noiseQ = new Int32Array(GRID_CAP * 4);
function noiseField(x, y, radius) {
  const field = new Int16Array(MW * MH); field.fill(-1);
  if (radius <= 0) return field;
  const sx = clamp(Math.floor(x / T), 0, MW - 1), sy = clamp(Math.floor(y / T), 0, MH - 1);
  let h = 0, t = 0; field[sy * MW + sx] = radius; noiseQ[t++] = sy * MW + sx;
  while (h < t) {
    const c = noiseQ[h++], cx = c % MW, cy = (c / MW) | 0, b = field[c];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      const v = grid[ny * MW + nx];
      if (v === 0 || v === 3 || v === 4) continue;
      let nb = b - 1;
      if (v === 2 && !isDoorOpen(nx, ny)) nb = Math.floor(nb / 2);
      const ni = ny * MW + nx;
      if (nb > 0 && nb > field[ni]) {
        field[ni] = nb;
        if (t >= noiseQ.length) { console.warn(`噪音传播队列溢出（半径 ${radius}，容量 ${noiseQ.length}）：本次结果可能不完整`); return field; }
        noiseQ[t++] = ni;
      }
    }
  }
  return field;
}
function emitNoise(x, y, radius, label = '', source = null) {
  if (radius <= 0) return 0;
  const field = noiseField(x, y, radius);
  let heardBy = 0;
  for (const e of S.enemies) {
    if (e.dead || e === source) continue;
    const idx = Math.floor(e.y / T) * MW + Math.floor(e.x / T);
    if (field[idx] < 0) continue;
    heardBy++;
    if (e.t === 'licker') { lickerHear(e, x, y, label, radius); continue; }   // 舔舐者：追着声音走，即使已经在追
    if (e.t === 'boss' && !(S.executioner && S.executioner.active)) continue;
    // 已经在追击的敌人不需要调查；其余敌人记录声源并前往。
    if (!e.alert) { e.heard = { x, y, t: 10, label }; e.heardField = field; }
  }
  return heardBy;
}
// 沿噪音场的梯度走向声源（数值越大越靠近）
function noiseNext(e) {
  const f = e.heardField; if (!f) return null;
  const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T), cur = f[ty * MW + tx];
  if (cur < 0) return null;
  let best = cur, bx = -1, by = -1;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = tx + dx, ny = ty + dy; if (!passT(nx, ny)) continue;
    const v = f[ny * MW + nx]; if (v > best) { best = v; bx = nx; by = ny; }
  }
  return bx < 0 ? null : [(bx + .5) * T, (by + .5) * T];
}
</script>
<script>/* input/input.js */
'use strict';
// 键盘、鼠标输入

addEventListener('keydown', e => {
  if (!booted) return;   // 还在加载（见 game/globals.js）
  keys[e.code] = true;
  if (['Tab', 'Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();

  // 系统自动重复只保留为“按住”状态，不重复执行切换、交互、攻击等动作。
  if (e.repeat) return;
  auInit();
  if (mode === 'title' || mode === 'pause' || isMenuMode(mode)) { menuKey(e); return; }  // 菜单（ui/menus.js）
  if (mode === 'intro') { if (modeT > 0.4) endIntro(); return; }   // 序章：任意键跳过（第二次玩的人不该被强迫再看）
  if (mode === 'file') { if (modeT > 0.3 && ['KeyE', 'Enter', 'Escape', 'Tab'].includes(e.code)) { mode = afterFile; } return; }
  if (mode === 'dead') { if (modeT > 1.2) { if (e.code === 'Enter') { deadCanLoad() ? loadSlot(CUR_SLOT) : startGame(true); } else if (e.code === 'KeyR') { CUR_SLOT = null; startGame(true); } else if (e.code === 'Escape') goTitle(); } return; }
  if (mode === 'win') { if (modeT > 2 && e.code === 'Enter') goTitle(); return; }
  if (mode === 'inv') { invKey(e); return; }
  if (mode === 'safe') { safeKey(e); return; }
  if (mode === 'map') { if (['KeyM', 'Escape', 'Tab'].includes(e.code)) mode = 'play'; return; }
  if (mode !== 'play') return;
  const p = S.p;
  if (isGrabbed()) {   // 被僵尸抓着：只能连按 E 挣脱，或者按 G 塞投掷物（ai/grab.js）
    if (e.code === 'KeyE') grabMash(); else if (e.code === 'KeyG') grabThrow(); else if (e.code === 'Escape') openPause();
    return;
  }
  switch (e.code) {
    case 'KeyE': interact(); break;
    case 'KeyT': aimLock = !aimLock; msg(aimLock ? '持续瞄准：开（左键直接射击，再按 T 关闭）' : '持续瞄准：关', 2.5); break;
    case 'KeyR': reload(); break;
    case 'Digit6': if (!e.shiftKey) equipRail(); break;   // 电磁炮（最终战）
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5':
      if (PLAYTEST_WARP && e.shiftKey) { warpHotkey(+e.code.slice(5) - 1); break; }   // Shift+数字 = 试玩跳转（当前这一批，见 game/warp.js 的 WARP_STAGE）
      selectWeaponSlot(+e.code.slice(5) - 1); break;
    case 'KeyG': throwItem(); break;     // 投掷物（combat/throwables.js）
    case 'KeyX': cycleThrow(); break;    // 切换手雷 / 闪光弹
    case 'KeyQ': quickHeal(); break;
    case 'KeyH': useSpray(); break;
    case 'KeyF': case 'KeyV': knife(); break;
    case 'Tab': case 'KeyI': openInventory(); break;
    case 'KeyM': mode = 'map'; break;
    case 'KeyP': PERF.on = !PERF.on; msg(PERF.on ? '帧率叠层：开（再按 P 关闭）' : '帧率叠层：关', 2); break;
    case 'Escape': openPause(); break;
    case 'F9': if (DEBUG) { spawnExecutioner(); msg('[调试] 处刑者已登场', 2); } break;
    // 试玩跳转见下方 Shift+数字的分支（game/warp.js）
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (!booted) return; if (mode === 'title' || mode === 'pause' || isMenuMode(mode)) menuHover(e.clientX, e.clientY); });
addEventListener('mousedown', e => {
  if (e.button === 2) e.preventDefault();
  if (!booted) return;
  auInit();
  if (e.button === 0) { mouse.l = true; mouse.lp = true; }
  if (e.button === 2) mouse.r = true;
  if ((mode === 'title' || mode === 'pause' || isMenuMode(mode)) && e.button === 0) menuClick(e.clientX, e.clientY);
  else if (mode === 'intro' && modeT > 0.4) endIntro();
  else if (mode === 'file' && modeT > 0.3) mode = afterFile;

<script>/* game/save.js */
'use strict';

function loadGame(str) {

    const oldP = raw.p || {};

    S.stats = { ...fresh.stats, ...(raw.stats || {}) }; S.yard = { ...fresh.yard, ...(raw.yard || {}) };
    S.executioner = { ...fresh.executioner, ...(raw.executioner || {}) };

    S.maps = {};

    // 背包：v3 起是格子；更早的存档把零散计数转换成格子。v5 起不限格数（整行，至少 INV_START 格）
    if (oldP.inv && Array.isArray(oldP.inv.slots)) {

    S.timers.push({ id: 'migrated-wave', type: 'actions', left: +Y.spawnT || wave.every, every: wave.every, until: wave.until, do: wave.do, map: 'map1' });
  }

    const ex = trig.do.find(a => a.after && a.do.some(b => b.executioner));

// 存到存档槽 slot（默认当前这局的槽；新游戏第一次存档由打字机界面选槽）
function saveGame(slot = CUR_SLOT || 1) {
  S.version = SAVE_VERSION; S.stats.saves++;
  const r = curRoom() >= 0 ? ROOMS[curRoom()] : ROOMS[P.room];
  S.meta = { map: LEVEL.name, room: r ? r.name : '', savedAt: Date.now() };  // 存档界面显示用
  const data = JSON.stringify(S, (k, v) => (k === 'heardField' || k === 'heard' || k === 'lastSeen') ? undefined : v);
  delete S.meta;
  const ok = () => { SAVE = data; CUR_SLOT = slot; refreshSlots(); sfx('save'); msg(`打字机咔哒作响……已保存到存档 ${slot}。`); };
  const fail = () => {
    S.stats.saves--; sfx('locked');
    msg(storageBlocked()
      ? '这个浏览器不允许本页保存数据，进度无法留存。请改用浏览器打开在线版，或关闭隐私模式后重试。'
      : '存档失败！请检查磁盘空间或文件权限。', 6);
  };
  try {
    const res = writeSlotRaw(slot, data);
    if (res && typeof res.then === 'function') res.then(v => v ? ok() : fail(), fail);

}

<script>/* player/interact.js */
'use strict';
// 房间判断、安全屋、调查与开关门

// ---------------------------------------------------------------- 玩家动作
function curRoom() { const tx = Math.floor(S.p.x / T), ty = Math.floor(S.p.y / T); const r = roomAt[ty * MW + tx]; return r; }
function inSafe() { const r = curRoom(); return r >= 0 && ROOMS[r].safe; }
function inSafeTile(x, y) { const ri = roomAt[Math.floor(y / T) * MW + Math.floor(x / T)]; return ri >= 0 && !!ROOMS[ri].safe; }
// 击退、分离等被动位移也不能把敌人推进安全屋
function pushEnemy(e, dx, dy) { const ox = e.x, oy = e.y; moveEnt(e, dx, dy); if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; } }
function findInteract() {
  const p = S.p; let best = null, bd = 60;
  for (const it of S.items) { if (it.taken) continue; const d = dist(p.x, p.y, it.x, it.y); if (d < bd) { bd = d; best = { kind: 'item', it }; } }
  if (best) return best;
  for (const ex of EXITS) { const d = dist(p.x, p.y, (ex.x + .5) * T, (ex.y + .5) * T); if (d < bd) { bd = d; best = { kind: 'exit', ex }; } }
  if (best) return best;
  let door = null, dd = 62;
  for (const [x, y] of DOORS) {
    if (grid[y * MW + x] !== 2 && grid[y * MW + x] !== 3) continue;
    const d = dist(p.x, p.y, (x + .5) * T, (y + .5) * T);
    if (d < dd) { dd = d; door = { kind: 'door', x, y, key: LOCKS[doorKey(x, y)] || null, open: isDoorOpen(x, y) }; }
  }
  return door;
}
// 门格上（含半径重叠）有玩家或敌人时不能关门
function doorBlocked(tx, ty) {
  const x0 = tx * T, y0 = ty * T;
  const overlap = e => { const nx = clamp(e.x, x0, x0 + T), ny = clamp(e.y, y0, y0 + T); return Math.hypot(e.x - nx, e.y - ny) < e.r; };
  return overlap(S.p) || S.enemies.some(e => !e.dead && overlap(e));
}
function interact() {
  const f = findInteract(); if (!f) return;
  const p = S.p;
  if (f.kind === 'exit') { useExit(f.ex); return; }
  if (f.kind === 'door') {
    const dk = doorKey(f.x, f.y);
    if (grid[f.y * MW + f.x] === 3) {
      if (!p.keys[f.key]) { sfx('locked'); msg(KEYS[f.key].hint); return; }

      setDoorOpen(f.x, f.y, true); drawTileAt(f.x, f.y); sfx('door'); emitNoise((f.x + .5) * T, (f.y + .5) * T, NOISE.doorOpen); msg(`使用了「${KEYS[f.key].name}」。门开了。`);
    } else {
      if (isDoorOpen(f.x, f.y) && doorBlocked(f.x, f.y)) { msg('有东西挡着，门关不上。'); sfx('locked'); return; }
      setDoorOpen(f.x, f.y, !isDoorOpen(f.x, f.y)); drawTileAt(f.x, f.y); sfx('door'); emitNoise((f.x + .5) * T, (f.y + .5) * T, isDoorOpen(f.x, f.y) ? NOISE.doorOpen : NOISE.doorClose);

    }
    return;
  }
  const it = f.it;
  switch (it.t) {
    case 'typewriter': openSlots('save'); return;  // 选存档槽（ui/menus.js）
    case 'bust': turnBust(it); return;   // 机关道具：转一下，拿不走（game/puzzles.js）
    case 'plate': readPlate(); return;
    case 'safe': openSafe(it); return;
    case 'altar': useAltar(it); return;
    case 'lift': useLift(it); return;
    case 'fusebox': useFusebox(it); return;
    case 'valve': useValve(it); return;
    case 'ln2lever': useLN2Lever(it); return;
    case 'ladle': useLadle(it); return;
    case 'trainConsole': useTrainConsole(it); return;
    case 'escapedoor': useEscapeDoor(it); return;
    case 'gunlocker': useGunLocker(it); return;
    case 'growlight': useGrowLight(it); return;
    case 'glcase': useGlCase(it); return;
    case 'console': useConsole(it); return;
    case 'traindoor': useTrainDoor(it); return;
    case 'switch':   // 灯开关：来回切换 flag；lamps 里带同名 flag 的灯跟着亮灭
      if (S.flags[it.v]) delete S.flags[it.v]; else S.flags[it.v] = true;
      sfx('locked', 0.5); msg(S.flags[it.v] ? '啪嗒。灯亮了。' : '啪嗒。灯灭了。'); return;
    case 'smgammo': case 'magammo': case 'gl': case 'glammo': case 'glbomb': case 'glacid':
    case 'ammo': case 'shells': case 'herb': case 'spray': case 'shotgun': case 'grenade': case 'flash':   // 手雷、闪光弹以前漏了：按 E 道具消失但没进背包
      if (!pickUp(it)) return;

    case 'key': p.keys[it.v] = true; msg(`获得「${KEYS[it.v].name}」`); sfx('key');

<script>/* player/items.js */
'use strict';
// 武器切换与装填（恢复品和背包在 player/inventory.js）

// ---------------------------------------------------------------- 武器切换
function hasWeapon(id) {
  const p = S.p;
  return invHas(id) || !!(p.weapons && p.weapons[id]); // weapons：后续地图的武器（调试用）
}
function equipWeapon(id) {
  const p = S.p;
  if (p.rail && p.rail.on) { p.rail.on = false; P.railCharge = 0; if (p.wep === id) { sfx('reload', 0.6); return true; } }   // 从电磁炮切回普通武器
  if (p.wep === id) return false;
  p.wep = id; P.reloadT = 0; P.lastSwitch = S.time; sfx('reload');
  return true;
}
// 数字键 1–5
function selectWeaponSlot(i) {
  if (i === 5) return equipRail();   // 6：电磁炮（剧情武器，不在 WEAPON_SLOTS 里）
  const slot = WEAPON_SLOTS[i];
  if (!slot) return false;
  if (!hasWeapon(slot.id)) { msg(`[${i + 1}] 这个栏位还没有武器。`, 1.8); return false; }
  return equipWeapon(slot.id);
}
// 鼠标滚轮：dir = 1 下一把，-1 上一把
function cycleWeapon(dir) {
  if (P.lastSwitch !== undefined && S.time - P.lastSwitch < WEAPON_SWITCH_CD) return false;
  const owned = WEAPON_SLOTS.map(s => s.id).filter(hasWeapon);
  if (owned.length < 2) return false;
  const i = owned.indexOf(S.p.wep);
  return equipWeapon(owned[(i + dir + owned.length) % owned.length]);
}

// 榴弹发射器换弹种：把枪里那发退回背包，装下一种背包里有的
function cycleGlRound() {
  const p = S.p, cur = glLoaded();
  const have = GL_ORDER.filter(k => k !== cur && invCount(GL_ROUNDS[k].item) > 0);
  if (!have.length) { msg(`只有${GL_ROUNDS[cur].name}。`, 1.5); return false; }
  const next = have.find(k => GL_ORDER.indexOf(k) > GL_ORDER.indexOf(cur)) || have[0];
  if (p.mag.gl > 0) {
    if (invAdd(inv(), GL_ROUNDS[cur].item, 1) > 0) { msg('背包满了，退不出这发榴弹。', 2); sfx('locked'); return false; }
    p.mag.gl = 0;
  }
  p.glType = next; P.reloadT = WEAPONS.gl.reload; sfx('reload');
  msg(`换装 ${GL_ROUNDS[next].name}`, 1.8);
  return true;
}
function reload() {
  const p = S.p, w = p.wep, W_ = WEAPONS[w];
  if (railOn()) return;   // 电磁炮不用装填
  if (w === 'gl' && P.reloadT <= 0 && p.mag.gl >= 1) { cycleGlRound(); return; }   // 榴弹：装着一发时 R = 换弹种
  if (!W_ || P.reloadT > 0 || p.mag[w] >= magCap(w)) return;
  if (ammoCount(w) <= 0) { msg(W_.noAmmo); sfx('empty'); return; }
  P.reloadT = W_.reload; sfx('reload');
}
</script>
<script>/* combat/combat.js */
'use strict';
// 小刀、射击、伤害结算、处刑者登场

function knife() {

  const p = S.p;
  for (const e of S.enemies) {
    if (e.dead) continue; const d = dist(p.x, p.y, e.x, e.y);
    if (d < KNIFE.reach + e.r && Math.abs(angDiff(p.a, Math.atan2(e.y - p.y, e.x - p.x))) < KNIFE.arc) damageEnemy(e, KNIFE.dmg, p.a, KNIFE.kb, false, KNIFE.stagger, 'knife');

function bleed(x, y, a, n, big) {

    const aa = a + rand(-0.7, 0.7), sp = rand(60, big ? 320 : 200);
    parts.push({ x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, life: rand(0.2, 0.5), max: 0.5, s: rand(1.5, 3.5), c: Math.random() < .5 ? '#8a0a0a' : '#5a0505', t: 'blood' });

// 位置（格）来自触发器；F9 调试时不给参数，出现在地图 1 的收容舱
function spawnExecutioner(tx = 52, ty = 8, quiet = false) {   // quiet：演出自己负责声音和提示（跳落）

// src：'knife' | 'pistol' | 'shotgun' …… 只有小刀受“1.5 秒内不再硬直”的限制

  if (e.t === 'lazarus') { const r = lazarusDamage(e, dmg, a, src); if (r === null) return; dmg = r; stag = 0; kb = 0; }   // 拉撒路：阶段弱点、变身无敌、阶段三只怕电磁炮
  if (e.t === 'tentacle') { stag = 0; kb = 0; }

  if (e.acidT > 0 && src !== 'acid' && src !== 'railgun') dmg *= GL_ROUNDS.acid.vuln;   // 酸液腐蚀：伤害 ×1.5

      msg('「处刑者」被打倒了，但只能维持片刻。', 3); cryAt('executioner', 'pain', e.x, e.y, 1, 1200, 0.3); shake = 20;
    } else if (e.stagAcc >= EXEC.midStagger && !e.midStagDone) { e.midStagDone = true; e.stag = EXEC.midStaggerT; e.state = 'chase'; floats.push({ x: e.x, y: e.y - 30, t: '踉跄', life: 1, c: '#ffcc55' }); cryAt('executioner', 'pain', e.x, e.y, 0.8, 1200, 0.3); }
    pushEnemy(e, Math.cos(a) * kb * 0.2, Math.sin(a) * kb * 0.2);

    if (e.t === 'bloater') bloaterBurst(e);   // 膨胀者：炸开，留下毒雾
    // 爬行者：身体伤害打死的僵尸有 30% 会在几秒后变成爬行者（爆头、小刀补刀的不会）。计划 5.2
    if (e.t === 'zombie' && !head && Math.random() < CRAWLER.reviveChance) e.revive = rand(CRAWLER.reviveDelay[0], CRAWLER.reviveDelay[1]);
    decals.push({ x: e.x + Math.cos(a) * 10, y: e.y + Math.sin(a) * 10, r: e.r * 1.7, rot: rand(6), a: 0.85 });

  } else if (e.t !== 'boss' && !(e.hurtVoT > S.time)) {

  p.hp -= dmg; P.inv = 1.1; P.hurtT = 0.5; shake = Math.max(shake, src === 'boss' ? 22 : 12);

<script>/* combat/hazards.js */
'use strict';
// 地图 3 的「范围伤害」：膨胀者的爆炸与毒雾、中毒、榴弹发射器的燃烧榴弹与火场
//
//   S.gas   毒雾   { x, y, r, t }   玩家站进去 → 中毒；怪物在里面也会慢慢掉血
//   S.fires 火场   { x, y, r, t }   燃烧榴弹落地后烧 HAZ.fire.t 秒；怪物在里面持续掉血（蔓生体只怕火）
//   S.nades 飞行中的榴弹 { x, y, vx, vy, left }
//   S.p.poison 中毒：每隔几秒掉一点血（不会致死，最低留 1），蓝色草药 / 含蓝的混合草药解毒

const HAZ = {
  bloat: { r: 95, dmgPlayer: 30, dmgEnemy: 70, gasR: 85, gasT: 7 },
  gas: { enemyDps: 6 },
  poison: { every: 2.2, dmg: 3, floor: 1 },
  nade: { speed: 620, blastR: 70, blastDmg: 90, fuse: 0.9 },
  fire: { r: 78, t: 4.5, dps: 45, playerDmg: 10 },
};

// ---------------------------------------------------------------- 膨胀者：死了就炸
function bloaterBurst(e) {
  if (e.burst) return; e.burst = true;
  const B = HAZ.bloat, p = S.p;
  sfxAt('explode', e.x, e.y, 1, 1600, 0.3); sfxAt('bash', e.x, e.y, 0.8, 1200, 0.2);
  shake = Math.max(shake, dist(e.x, e.y, p.x, p.y) < 300 ? 12 : 4);
  for (let i = 0; i < 40; i++) { const a = rand(6.283), v = rand(60, 260); parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, s: rand(3, 6), c: Math.random() < .5 ? '#8aa04a' : '#5a7a2a' }); }
  decals.push({ x: e.x, y: e.y, r: 34, rot: rand(6), a: 0.6, dirt: true });
  emitNoise(e.x, e.y, 10, 'bloat');
  // 冲击：炸到玩家，也炸到旁边的怪（引到敌群旁边再打爆 —— 计划 5.x）
  const d = dist(e.x, e.y, p.x, p.y);
  if (d < B.r) hurtPlayer(B.dmgPlayer, Math.atan2(p.y - e.y, p.x - e.x), 'bloat');
  for (const o of S.enemies) {
    if (o === e || o.dead) continue;
    const od = dist(e.x, e.y, o.x, o.y);
    if (od < B.r + o.r) damageEnemy(o, B.dmgEnemy * (1 - od / (B.r + o.r) * 0.5), Math.atan2(o.y - e.y, o.x - e.x), 20, false, 0.5, 'blast');
  }
  (S.gas = S.gas || []).push({ x: e.x, y: e.y, r: B.gasR, t: B.gasT, max: B.gasT });
}

// ---------------------------------------------------------------- 中毒
function poisonPlayer() {
  const p = S.p; if (p.poison) return;
  p.poison = true; p.poisonT = 0; sfx('hurt', 0.6);
  msg('你中毒了！（蓝色草药可以解毒）', 4);
}
function curePoison() { const p = S.p; if (!p.poison) return false; p.poison = false; p.poisonT = 0; return true; }

// ---------------------------------------------------------------- 榴弹发射器
function launchGrenade(ox, oy, a, range, kind = 'fire') {
  const N = HAZ.nade;
  (S.nades = S.nades || []).push({ x: ox, y: oy, vx: Math.cos(a) * N.speed, vy: Math.sin(a) * N.speed, left: Math.min(range, 900) / N.speed, t: 0, kind });
}
function grenadeBurst(x, y, kind = 'fire') {
  if (kind === 'bomb') return bombBurst(x, y);
  if (kind === 'acid') return acidBurst(x, y);
  const N = HAZ.nade, F = HAZ.fire, p = S.p;
  sfxAt('explode', x, y, 1, 1800, 0.35); shake = Math.max(shake, dist(x, y, p.x, p.y) < 320 ? 10 : 4);
  for (let i = 0; i < 36; i++) { const a = rand(6.283), v = rand(80, 300); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, s: rand(2, 5), c: Math.random() < .5 ? '#ffb040' : '#ff5a20' }); }

// 爆炸榴弹：大范围冲击，边缘减半；墙后面的炸不到；离得太近自己也挨炸
function bombBurst(x, y) {

  shake = Math.max(shake, dist(x, y, p.x, p.y) < 380 ? 18 : 6);
  for (let i = 0; i < 60; i++) { const a = rand(6.283), v = rand(120, 420); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.9), max: 0.9, s: rand(2, 6), c: Math.random() < .4 ? '#ffe080' : Math.random() < .5 ? '#ff8a20' : '#555' }); }

    if (o.dead || o.hidden) continue;

    damageEnemy(o, Math.round(B.dmg * (1 - 0.5 * Math.min(1, od / B.r))), Math.atan2(o.y - y, o.x - x), B.kb, false, B.stag, 'blast'); hit++;

// 酸液榴弹：小范围伤害 + 腐蚀（e.acidT 秒内受到的伤害 ×1.5，见 damageEnemy）
function acidBurst(x, y) {
  const A = GL_ROUNDS.acid, p = S.p;

  for (let i = 0; i < 40; i++) { const a = rand(6.283), v = rand(60, 260); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, s: rand(2, 5), c: Math.random() < .5 ? '#9ad040' : '#6a9a20' }); }
  decals.push({ x, y, r: 38, rot: rand(6), a: 0.6, dirt: true });
  emitNoise(x, y, 10, 'grenade');
  let hit = 0;
  for (const o of S.enemies) {
    if (o.dead || o.hidden) continue;
    if (dist(x, y, o.x, o.y) > A.r + o.r) continue;
    const fresh = !(o.acidT > 0);
    o.acidT = A.t;
    damageEnemy(o, A.dmg, Math.atan2(o.y - y, o.x - x), 6, false, 0.3, 'acid'); hit++;
    if (fresh && !o.dead) floats.push({ x: o.x, y: o.y - 34, t: '被腐蚀！受到伤害 ×1.5', life: 1.4, c: '#b0e050' });
  }

}

// ---------------------------------------------------------------- 每帧
function updateHazards(dt) {
  const p = S.p;
  // 飞行中的榴弹：撞墙 / 撞到怪 / 飞到射程尽头就炸。
  // 命中率：shoot() 发射时已经记了一发 shots，这里炸到怪才记 hits（以前榴弹永远算打空）
  drawAcid();
  const burst = g => { g.done = true; if (grenadeBurst(g.x, g.y, g.kind) > 0) S.stats.hits++; };
  for (const g of S.nades || []) {
    const steps = 3;
    for (let k = 0; k < steps && !g.done; k++) {
      const nx = g.x + g.vx * dt / steps, ny = g.y + g.vy * dt / steps;
      const hitE = S.enemies.find(o => !o.dead && !o.hidden && dist(nx, ny, o.x, o.y) < o.r + 8);
      if (opaqueT(Math.floor(nx / T), Math.floor(ny / T)) || hitE) { burst(g); break; }
      g.x = nx; g.y = ny;
    }
    g.left -= dt; g.t += dt;
    if (!g.done && g.left <= 0) burst(g);
    if (!g.done && Math.random() < 0.7) parts.push({ x: g.x, y: g.y, vx: rand(-15, 15), vy: rand(-15, 15), life: 0.35, max: 0.35, s: 2.5, c: 'rgba(200,200,200,0.5)' });
  }
  if (S.nades) S.nades = S.nades.filter(g => !g.done);
  // 酸液腐蚀：计时 + 冒绿泡
  for (const o of S.enemies) if (o.acidT > 0) { o.acidT -= dt; if (!o.dead && Math.random() < dt * 12) parts.push({ x: o.x + rand(-o.r, o.r), y: o.y + rand(-o.r, o.r), vx: rand(-8, 8), vy: rand(-30, -10), life: 0.5, max: 0.5, s: rand(2, 3.5), c: '#9ad040' }); }

    }

    if (Math.random() < dt * 30) { const a = rand(6.283), r = rand(f.r); parts.push({ x: f.x + Math.cos(a) * r, y: f.y + Math.sin(a) * r, vx: rand(-10, 10), vy: rand(-50, -20), life: rand(0.3, 0.6), max: 0.6, s: rand(2, 4), c: Math.random() < .5 ? '#ffa030' : '#ff5010' }); }
  }
  if (S.fires) S.fires = S.fires.filter(f => f.t > 0);
  // 毒雾
  for (const g of S.gas || []) {
    g.t -= dt;
    if (dist(g.x, g.y, p.x, p.y) < g.r) poisonPlayer();
    for (const o of S.enemies) if (!o.dead && o.t !== 'bloater' && o.t !== 'boss' && dist(g.x, g.y, o.x, o.y) < g.r) { o.gasAcc = (o.gasAcc || 0) + HAZ.gas.enemyDps * dt; if (o.gasAcc >= 10) { damageEnemy(o, o.gasAcc, 0, 0, false, 0, 'gas'); o.gasAcc = 0; } }
  }
  if (S.gas) S.gas = S.gas.filter(g => g.t > 0);

<script>/* combat/throwables.js */
'use strict';
// 投掷物（计划 6.2，副武器栏）：G 投掷，X 切换手雷 / 闪光弹。
//
//   破片手雷：落地滚一小段，引信到了就炸 —— 范围伤害 150（边缘减半）；离得太近自己也会被炸到

//             舔舐者是瞎的，不会被闪到，但那一声会把它引过去；蔓生体、淤泥体没有反应。
//             自己正对着闪光也会白屏一下（不影响操作）
//
//   S.throws 飞行 / 滚动中的投掷物 { id, x, y, vx, vy, t, fuse }
//   S.p.sub  当前选中的投掷物（背包里没有了就自动换成另一种）
// 被僵尸抓住时按 G：把投掷物塞给它，立刻挣脱（ai/grab.js 的 grabThrow）。

const THROW = {
  speed: 460, minDist: 70, maxDist: 330, friction: 3.2, bounce: 0.45, cd: 0.8,
  grenade:   { dmg: 150, r: 110, playerDmg: 40, stag: 1.0, kb: 40, fuse: 1.4, noise: 14 },
  flashbang: { r: 230, stun: 3, fuse: 1.0, noise: 12, white: 1.2 },

function curThrow() {
  const p = S.p;
  if (p.sub && invHas(p.sub)) return p.sub;
  const f = THROW_IDS.find(id => invHas(id)) || null;
  p.sub = f; return f;
}
function selectThrow(id) {
  if (!invHas(id)) return false;
  S.p.sub = id; msg(`投掷物：${ITEMS[id].name}（G 投掷）`, 1.8); return true;
}
function cycleThrow() {
  const have = THROW_IDS.filter(id => invHas(id));
  if (!have.length) { msg('没有投掷物。', 1.5); return false; }
  const i = have.indexOf(curThrow());

// 投掷：朝瞄准方向，落点 = 鼠标位置（夹在 70–330 像素之间）；没有鼠标信息就扔 200 像素
function throwItem(targetDist) {

  const v = Math.sqrt(2 * THROW.speed * THROW.friction * d);

  P.throwCd = THROW.cd; sfx('knife', 0.6);

}

function updateThrows(dt) {

  if (P.whiteT > 0) P.whiteT -= dt;
  for (const f of S.flashes || []) f.t -= dt;

function flashBurst(x, y) {
  const F = THROW.flashbang, p = S.p;
  sfxAt('glass', x, y, 0.8, 1600, 0.3); sfxAt('explode', x, y, 0.5, 1600, 0.2);
  (S.flashes = S.flashes || []).push({ x, y, t: 0.35 });
  emitNoise(x, y, F.noise, 'flash');   // 舔舐者会循着这一声扑过去

  for (const o of S.enemies) {
    if (o.dead || o.hidden || !FLASH_BLIND.has(o.t)) continue;
    if (o.t === 'boss' && (o.frozenT > 0 || o.knockdownT > 0)) continue;
    if (o.t === 'crawler' && o.state === 'lurk') continue;   // 趴在地上装死，眼睛是闭着的
    if (dist(x, y, o.x, o.y) > F.r || !losClear(x, y, o.x, o.y)) continue;
    if (o.t === 'executionerBerserk') {   // 暴走形态：只晃 1.5 秒；跳在半空中的不受影响
      if (o.state === 'leapAir') continue;
      o.stag = Math.max(o.stag || 0, BERSERK.flashStun); o.blindT = BERSERK.flashStun; o.state = 'chase'; n++;
      floats.push({ x: o.x, y: o.y - 26, t: '眩晕', life: 1.2, c: '#fff6c0' }); continue;
    }
    o.stag = Math.max(o.stag || 0, F.stun); o.blindT = F.stun; o.atkT = 0; n++;

// 地上 / 物品栏里共用的小图标（原点在中心，约 20×20）

<script>/* ai/nav.js */
'use strict';
// 流场寻路：三套寻路层（A 处刑者 / B 僵尸 / C 狗），以及自动开门

// ---------------------------------------------------------------- 流场寻路
// 带权最短路（Dijkstra + 二叉堆）：走一格代价 1，经过关着的门再加 NAV_DOOR_COST[层]。
// 80×64 的完整地图也只有 5120 格，三层每秒各算 4 次开销很小。
const navHeapN = new Int32Array(GRID_CAP * 4), navHeapC = new Int32Array(GRID_CAP * 4);
let navHeapLen = 0;
function navPush(n, c) {
  let i = navHeapLen++;
  while (i > 0) { const pi = (i - 1) >> 1; if (navHeapC[pi] <= c) break; navHeapN[i] = navHeapN[pi]; navHeapC[i] = navHeapC[pi]; i = pi; }
  navHeapN[i] = n; navHeapC[i] = c;
}
function navPop() {
  const top = navHeapN[0], last = --navHeapLen, ln = navHeapN[last], lc = navHeapC[last];
  let i = 0;
  for (;;) {
    let c = 2 * i + 1; if (c >= last) break;
    if (c + 1 < last && navHeapC[c + 1] < navHeapC[c]) c++;
    if (navHeapC[c] >= lc) break;
    navHeapN[i] = navHeapN[c]; navHeapC[i] = navHeapC[c]; i = c;
  }
  navHeapN[i] = ln; navHeapC[i] = lc;

}

function navLayerOf(e) { return (EDEF[e.t] && EDEF[e.t].nav) || 'C'; }
function flowOf(layer) { return layer === 'A' ? flowExec : layer === 'B' ? flowB : flow; }
// 兼容旧调用：passFor(x, y, true) = A 层，passFor(x, y) = C 层
function passFor(tx, ty, layer = 'C') {
  if (layer === true) layer = 'A'; else if (layer === false) layer = 'C';
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return false;
  const i = ty * MW + tx, v = grid[i];
  if (v === 1) return true;
  if (v !== 2) return false;                 // 墙、家具、锁着的门
  if (isDoorOpen(tx, ty)) return true;
  if (layer === 'D') return true;            // 导演用的距离层：所有没锁的门都算通（包括安全屋的门），只用来量距离
  return layer !== 'C' && !doorSafe[i];      // 关着的门：A/B 层可以通过（安全屋的门除外）
}
function stepCost(tx, ty, layer) {
  return (grid[ty * MW + tx] === 2 && !isDoorOpen(tx, ty)) ? 1 + NAV_DOOR_COST[layer] : 1;
}
function computeFlow(out = flow, layer = 'C') {
  if (layer === true) layer = 'A'; else if (layer === false) layer = 'C';
  computeFlowFrom(out, layer, Math.floor(S.p.x / T), Math.floor(S.p.y / T));
}
// 从任意格子 (sx, sy) 出发的寻路场。处刑者在“搜索 / 追踪”时只用从噪音地点出发的场，不知道玩家在哪（计划 3.2）
function computeFlowFrom(out, layer, sx, sy) {
  out.fill(-1);

  const s = sy * MW + sx; out[s] = 0; navHeapLen = 0; navPush(s, 0);

      const n = ny * MW + nx, nd = cd + stepCost(cx, cy, layer);

    }

// 四层寻路场原本是**同一帧**全部重算的：平均帧只要 0.08ms，但那一帧要 7ms，
// 尖峰是平均的 89 倍。在性能好的机器上看不出来，在普通笔记本上就是
// 每秒 4 次的规律性顿挫 —— 这种周期性卡顿比整体低帧更难受。
//
// 改成轮流算：每 1/16 秒算一层，四层转一圈仍然是 0.25 秒（刷新率没变），
// 但单帧只承担四分之一的工作。
const FLOW_ORDER = [[() => flow, 'C'], [() => flowB, 'B'], [() => flowExec, 'A'], [() => flowDir, 'D']];
const FLOW_SLICE = 0.25 / FLOW_ORDER.length;
let flowSlot = 0;
function computeFlowSlice() {
  const [get, layer] = FLOW_ORDER[flowSlot];
  computeFlow(get(), layer);
  flowSlot = (flowSlot + 1) % FLOW_ORDER.length;
  return FLOW_SLICE;
}

// 返回下一步要走向的点（世界坐标），到不了返回 null
function flowNext(e) { return flowNextOn(e, flowOf(navLayerOf(e)), S.p.x, S.p.y); }
// 沿寻路场 map 下坡走；已经在终点格时直接走向 (gx, gy)
function flowNextOn(e, map, gx, gy) {
  const layer = navLayerOf(e);
  const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T), cur = map[ty * MW + tx];
  if (cur < 0) return null;
  if (cur === 0) return [gx, gy];

  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue; const nx = tx + dx, ny = ty + dy;
    if (!passFor(nx, ny, layer)) continue;
    if (dx && dy && (!passFor(tx + dx, ty, layer) || !passFor(tx, ty + dy, layer))) continue;
    const v = map[ny * MW + nx]; if (v >= 0 && v < best) { best = v; bx = nx; by = ny; }
  }
  return bx < 0 ? null : [(bx + .5) * T, (by + .5) * T];
}

function autoOpenDoorForExecutioner(e, x, y) {
  const tx = Math.floor(x / T), ty = Math.floor(y / T);
  for (let yy = ty - 1; yy <= ty + 1; yy++) for (let xx = tx - 1; xx <= tx + 1; xx++) {
    if (xx < 0 || yy < 0 || xx >= MW || yy >= MH || grid[yy * MW + xx] !== 2 || isDoorOpen(xx, yy) || doorSafe[yy * MW + xx]) continue;
    if (dist(x, y, (xx + .5) * T, (yy + .5) * T) < T * 0.95) {
      setDoorOpen(xx, yy, true); drawTileAt(xx, yy); emitNoise((xx + .5) * T, (yy + .5) * T, 10, 'executioner-door', e);
      sfxAt('door', (xx + .5) * T, (yy + .5) * T, 1.8, 1600, 0.25); shake = Math.max(shake, 5); flowT = 0; return true;
    }
  }
  return false;
}
function autoOpenDoorOnRun(x, y, mdx = 0, mdy = 0) {
  const tx = Math.floor(x / T), ty = Math.floor(y / T);
  for (let yy = ty - 1; yy <= ty + 1; yy++) for (let xx = tx - 1; xx <= tx + 1; xx++) {
    if (xx < 0 || yy < 0 || xx >= MW || yy >= MH || grid[yy * MW + xx] !== 2 || isDoorOpen(xx, yy)) continue;
    const cx = (xx + .5) * T - x, cy = (yy + .5) * T - y, cl = Math.hypot(cx, cy), ml = Math.hypot(mdx, mdy) || 1;
    if (cl > 1 && (cx * mdx + cy * mdy) / (cl * ml) < 0.7) continue; // 不在前进方向上
    if (dist(x, y, (xx + .5) * T, (yy + .5) * T) < T * 0.9) { setDoorOpen(xx, yy, true); drawTileAt(xx, yy); emitNoise((xx + .5) * T, (yy + .5) * T, 6, 'door-run'); msg('奔跑撞开了门！', 1.5); flowT = 0; return true; }

<script>/* ai/doors.js */
'use strict';
// 僵尸拍门（B 层寻路）：正在追击的僵尸沿寻路走到关着的门前会拍门，
// 累计 DOOR_BASH_TIME 秒后把门撞开。进度保存在 S.doorBash（写进存档，不会自行恢复）。
// 只有“追击”状态的僵尸会拍门；只是听到声音来调查的僵尸会在门口停下，找不到人就离开。

// n：flowNext 给出的下一步。如果下一步是一扇关着、可以撞的门，而且僵尸已经贴到门上，返回门的格子坐标
function doorBashTarget(e, n) {
  if (!n || navLayerOf(e) !== 'B') return null;
  const tx = Math.floor(n[0] / T), ty = Math.floor(n[1] / T);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return null;
  const i = ty * MW + tx;
  if (grid[i] !== 2 || isDoorOpen(tx, ty) || doorSafe[i]) return null;
  if (dist(e.x, e.y, (tx + .5) * T, (ty + .5) * T) > T * 0.5 + e.r + 8) return null;
  return [tx, ty];
}

// 拍门中的僵尸“知道”玩家在门后：玩家离门不超过 DOOR_BASH_GIVEUP 格（B 层路径代价）时，记忆计时暂停
function bashKeepsTarget(e) {
  if (e.state !== 'bash') return false;
  const v = flowB[Math.floor(e.y / T) * MW + Math.floor(e.x / T)];
  return v >= 0 && v <= DOOR_BASH_GIVEUP + NAV_DOOR_COST.B + 1;
}

function doorBashProgress(tx, ty) { return (S.doorBash && S.doorBash[doorKey(tx, ty)]) || 0; }

// d：僵尸到玩家的距离（用来决定音量和提示）
function bashDoor(e, tx, ty, dt, d) {
  if (!S.doorBash) S.doorBash = {};
  const k = doorKey(tx, ty), cx = (tx + .5) * T, cy = (ty + .5) * T;
  const prev = S.doorBash[k] || 0, now = prev + dt;
  S.doorBash[k] = now;
  e.moving = false; e.state = 'bash';
  e.fa += angDiff(e.fa, Math.atan2(cy - e.y, cx - e.x)) * Math.min(1, dt * 6);
  if (prev === 0 && d < 12 * T) msg('门外传来沉闷的撞门声……', 3);
  e.bashT = (e.bashT || 0) - dt;
  if (e.bashT <= 0) {
    e.bashT = rand(0.8, 1.1);
    sfxAt('bash', e.x, e.y, 1, 750, 0.08); // 声源用撞门者的位置：和它同侧听得清，隔着门就发闷
    if (d < 4 * T) shake = Math.max(shake, 2);
    emitNoise(cx, cy, DOOR_BASH_NOISE, 'door-bash', e);
  }
  if (now >= DOOR_BASH_TIME) breakDoor(tx, ty, e, d);
}

function breakDoor(tx, ty, e, d) {
  const cx = (tx + .5) * T, cy = (ty + .5) * T;
  delete S.doorBash[doorKey(tx, ty)];
  setDoorOpen(tx, ty, true); drawTileAt(tx, ty);
  sfxAt('bash', cx, cy, 1, 1000, 0.1); sfxAt('door', cx, cy, 1.6, 1000, 0.1);
  emitNoise(cx, cy, DOOR_BREAK_NOISE, 'door-break', e);
  if (d < 12 * T) { msg('门被撞开了！', 2.5); shake = Math.max(shake, 5); }
  for (let i = 0; i < 8; i++) { const life = rand(0.4, 0.9); parts.push({ t: 'dust', x: cx + rand(-14, 14), y: cy + rand(-14, 14), vx: rand(-60, 60), vy: rand(-60, 60), life, max: life, s: rand(2, 4), c: '#6b5a44' }); }
  e.state = 'chase'; e.bashT = 0;
  computeAllFlows(); flowT = 0.25; // 门的状态变了：寻路必须立刻全部重算，不能等轮转（否则怪会撞着刚关上的门走）
}

// 门上的撞击痕迹（每帧绘制在地图之上）
function drawDoorDamage() {
  if (!S.doorBash) return;
  for (const k in S.doorBash) {
    const v = S.doorBash[k]; if (!(v > 0)) continue;
    const [tx, ty] = k.split(',').map(Number);
    if (isDoorOpen(tx, ty)) continue;
    const x = tx * T, y = ty * T, f = clamp(v / DOOR_BASH_TIME, 0, 1);
    ctx.save(); ctx.translate(x + T / 2, y + T / 2);
    ctx.strokeStyle = `rgba(20,10,5,${0.35 + f * 0.5})`; ctx.lineWidth = 1.5;
    const n = 1 + Math.floor(f * 6);
    for (let i = 0; i < n; i++) {
      const a = hash(tx * 7 + i, ty * 13 + i) * Math.PI * 2, l = 6 + f * 16;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * l, Math.sin(a) * l); ctx.lineTo(Math.cos(a + 0.4) * l * 1.2, Math.sin(a + 0.4) * l * 1.2); ctx.stroke();
    }
    ctx.restore();
  }
}
</script>
