      fired: [...M3_PLANT, 'm3_furnace', 'm3_mutate', 'm3_berserkDead', 'm3_tower', 'm3_train', 'm3_platform', 'm3_laz2', 'm3_laz3'],
      objective: '▲ 躲开脚下的触手，远离被腐蚀的地面',
      give: { ammo: 30, shells: 8, herb: 3, shotgun: true, smg: true, smgAmmo: 30, magnum: true, magAmmo: 6, gl: 2, grenade: 1, flashbang: 1 } },
  ],
};
// 按快捷键跳过去时额外塞的药（用户要求「跳图的时候多给点药，不用我自己去拿」）。只在试玩跳转里给，正式流程不受影响。
// 用混合好的草药：一格就是一次满血，不占一堆格子；蓝草药解猎手 / 膨胀者的毒
const WARP_HEAL_BONUS = [['mix_gr', 2], ['mix_gg', 2], ['spray', 2], ['herb_b', 2]];
const WARP_STAGE_NAME = { map1: '地图 1 宅邸', map2: '地图 2 研究所', map3: '地图 3 制药厂' };
const WARPS = WARP_SETS[WARP_STAGE].map((w, i) => ({ ...w, code: `Shift+${i + 1}` }));   // 当前这一批 = 快捷键
const ALL_WARPS = Object.values(WARP_SETS).flat();
const warpIdx = id => WARPS.findIndex(w => w.id === id);
const warpById = id => ALL_WARPS.find(w => w.id === id);

// 按快捷键跳转：先回到一局全新的游戏，再套落点。
// 以前是在当前进度上直接叠：连按两次多发一遍手雷、上一段的处刑者 / 计时器 / 标记跟着带过去，
// 同一个快捷键每次测出来的状态都不一样。现在每次都一样。
function warpHotkey(i) {
  if (!PLAYTEST_WARP || mode !== 'play' || !WARPS[i]) return;
  S = newState(); buildMap(); renderMap(); resetTransient();
  applyWarp(i);
}

function applyWarp(i) {
  if (!PLAYTEST_WARP) return;
  const w = typeof i === 'object' ? i : WARPS[i];   // 下标 = 当前这一批的快捷键；对象 = 直接套落点（其他批次，测试用 warpById 取）
  if (!w || mode !== 'play') return;
  // 目标在别的地图：先切过去（立即完成，不播过场）
  const target = w.map || 'map1';
  if (S.map !== target) gotoLevel(target, null, null, true);
  const p = S.p;
  if (w.fuses) S.fuses = { fuseA: true, fuseB: true, fuseC: true };

  // 先把跳过的门打开，再落地 —— 顺序反了的话玩家会卡在自己没开的锁后面
  for (const k of w.keys || []) p.keys[k] = true;
  for (const [x, y] of w.open || []) {
    const dk = doorKey(x, y);
    if (!S.unlocked.includes(dk)) S.unlocked.push(dk);
    if (grid[y * MW + x] === 3) grid[y * MW + x] = 2;
    setDoorOpen(x, y, true);
    drawTileAt(x, y);
  }
  // 发了的钥匙，地图上那一把就当已经捡过（否则再捡一次会把「捡钥匙」的剧情重播一遍，比如冷库的伏击）
  for (const it of S.items) if (it.t === 'key' && (w.keys || []).includes(it.v)) it.taken = true;
  // safes：这些密码柜当作已经打开过（奖励由 give 发），免得再开一次多拿一份
  for (const it of S.items) if (it.t === 'safe' && (w.safes || []).includes(it.v)) it.open = true;
  if (w.took) {
    const rs = LEVEL.rooms.filter(r => w.took.includes(r.id));
    for (const it of S.items) {
      if (isProp(it.t) || it.t === 'file' || it.t === 'key' || it.t === 'mod' || it.t === 'shotgun' || it.t === 'smg' || it.t === 'magnum') continue;
      const tx = Math.floor(it.x / T), ty = Math.floor(it.y / T);
      if (rs.some(r => tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h)) it.taken = true;
    }
  }
  for (const f of w.flags || []) S.flags[f] = true;
  for (const id of w.fired || []) S.fired[`${S.map}:${id}`] = true;

  const g = w.give || {};
  const v = inv();
  if (g.shotgun && !invHas('shotgun')) { invAdd(v, 'shotgun', 1); p.mag.shotgun = WEAPONS.shotgun.mag; }
  if (g.smg && !invHas('smg')) { invAdd(v, 'smg', 1); p.mag.smg = WEAPONS.smg.mag; p.wep = 'smg'; }
  if (g.smgAmmo) invAdd(v, 'ammo_smg', g.smgAmmo);
  if (g.gl && !invHas('gl')) { invAdd(v, 'gl', 1); p.mag.gl = 1; invAdd(v, 'ammo_fire', g.gl); p.glLoaded = 'fire'; }
  if (g.glBomb) invAdd(v, 'ammo_bomb', g.glBomb);
  if (g.glAcid) invAdd(v, 'ammo_acid', g.glAcid);
  if (g.magnum && !invHas('magnum')) { invAdd(v, 'magnum', 1); p.mag.magnum = WEAPONS.magnum.mag; }
  if (g.magAmmo) invAdd(v, 'ammo_magnum', g.magAmmo);
  if (g.grenade) invAdd(v, 'grenade', g.grenade);
  if (g.flashbang) invAdd(v, 'flashbang', g.flashbang);
  if (g.ammo) invAdd(v, 'ammo_pistol', g.ammo);
  if (g.shells) invAdd(v, 'ammo_shotgun', g.shells);
  if (g.herb) invAdd(v, 'herb_g', g.herb);
  for (const [id, n] of WARP_HEAL_BONUS) invAdd(v, id, n);   // 试玩跳转多给的药
  p.hp = 100;

  const at = w.at || [LEVEL.start.x, LEVEL.start.y];
  p.x = at[0] * T; p.y = at[1] * T;
  p.a = w.a !== undefined ? w.a : (LEVEL.start.a ?? -Math.PI / 2);
  p.vx = p.vy = 0;
  cam.x = p.x - W / 2; cam.y = p.y - H / 2;

  // 跳过去之后不该留着上一段的目标提示和倒计时
  S.objective = w.objective || null;
  S.countdown = null;
  S.cine = 0; S.cineThen = null;
  S.enemies = S.enemies.filter(e => !e.dead && (w.keep ? w.keep.includes(e.t) || dist(e.x, e.y, p.x, p.y) > 400 : dist(e.x, e.y, p.x, p.y) > 400));   // keep：这些种类即使在附近也留着（就是来测它们的）
  for (const [t, x, y] of w.spawn || []) S.enemies.push(mkEnemy(t, x, y));
  if (w.execDone) {   // 焚化炉之后：追踪形态已经不存在
    const D = S.executioner = S.executioner || freshExecutioner();
    D.done = true; D.active = false; D.follow = null; S.enemies = S.enemies.filter(e => e.t !== 'boss');
  }
  if (w.boss) { P.room = -1; spawnExecutioner(w.boss[0], w.boss[1]); }
  if (w.lazPhase) { P.room = curRoom(); warpLazarus(w.lazPhase); }
  // follow：处刑者已经在追你了，几秒后从这张图的入口（电梯井）砸下来 —— 和正式流程一致
  if (w.follow && !w.execDone && !activeExecutioner()) {
    const D = S.executioner = S.executioner || freshExecutioner();
    D.spawned = D.active = true; D.follow = { map: S.map, left: w.follow };
  }
  // 重放某个触发器（比如后庭院开场），并把它的倒计时缩短到 countdown 秒
  if (w.trigger) {
    const t = (LEVEL.triggers || []).find(t => t.id === w.trigger);
    if (t) {
      S.fired[`${S.map}:${t.id}`] = true;
      S.timers = S.timers.filter(x => x.map !== S.map);
      S.enemies = S.enemies.filter(e => e.t !== 'boss'); S.pod = null; S.crash = null;
      P.room = curRoom(); runActions(t.do, `warp:${t.id}`);
      if (w.countdown && S.countdown) S.countdown.left = w.countdown;
    }
  }
  msg(`[试玩跳转] ${w.name}`, 3);
  sfx('save', 0.6);
}
</script>
<script>/* game/update.js */
'use strict';
// 每帧更新的调度顺序

// ---------------------------------------------------------------- 更新
// 登上直升机的演出（demo 版的结局）：只有直升机真的停在停机坪上（flags.heli）才算。
// 以前只看「这张地图有没有停机坪」，地图 1 的升降梯演出也被当成登机：
// 1.15 秒时人被瞬移到停机坪、镜头跟着飞过去、人物不再绘制。完整版里直升机会坠毁，所以现在这段永远不会触发。
function heliBoarding() { return S.cine > 0 && !!PAD && !!S.flags.heli; }
// 每帧的更新顺序；各部分的实现分别在 player/、world/、ai/、render/ 下
function update(dt) {
  S.time += dt;
  processGameTimers(dt);
  P.inv -= dt; P.fireCd -= dt; P.knifeCd -= dt; P.knifeT -= dt; P.flash -= dt; P.hurtT -= dt; P.bannerT -= dt; if (P.slowT > 0) P.slowT -= dt;
  flowT -= dt; if (flowT <= 0) flowT = computeFlowSlice();   // 每帧只重算一层（ai/nav.js：避免每秒 4 次的尖峰）

  // 演出段（S.cine > 0）：玩家交出控制权，怪物也停手。
  // 计时器和触发器照常跑 —— 整段演出就是靠它们一拍一拍推进的。
  // 不把玩家冻在原地不动的原因：结局那几秒他还要「走向直升机」，所以只锁输入不锁位移。
  if (S.flags.heli) S.heliT = (S.heliT || 0) + dt;   // 直升机自己的时间轴：降落 → 停机 → 升空

  // 直升机坠毁演出：锁输入、怪物停手，镜头由演出自己控制（game/events.js）
  if (S.crash || S.leap) {
    if (S.crash) updateHeliCrash(dt); else updateExecLeap(dt);
    updateRoomsAndEvents(dt);
    updateEffects(dt);
    updateAmbience(dt);
    return;
  }
  if (S.pod && S.pod.t < 2) {
    const was = S.pod.t; S.pod.t += dt;
    if (was < 1.3 && S.pod.t >= 1.3) { sfxAt('bash', S.pod.x, S.pod.y, 1, 2000, 0.4); sfxAt('explode', S.pod.x, S.pod.y, 0.35, 2000, 0.3); shake = Math.max(shake, 14); }
  }

  if (S.cine > 0) {
    S.cine -= dt; S.cineT = (S.cineT || 0) + dt;
    // 前 1.1 秒：林岚自己走向舱门（玩家已经交出控制权，但人不能定在原地不动）
    if (heliBoarding() && S.cineT < 1.1) {
      const k = Math.min(1, dt * 4.5);
      S.p.x += (PAD.x - S.p.x) * k; S.p.y += (PAD.y + 18 - S.p.y) * k;
      S.p.a = Math.atan2(PAD.y - S.p.y, PAD.x - S.p.x);
    }
    // 旋翼下洗：一圈被吹起来的草屑和尘土，整段演出持续
    if (heliBoarding() && Math.random() < 0.9) {
      const ang = rand(6.283), r0 = 30 + rand(60);
      parts.push({ x: PAD.x + Math.cos(ang) * r0, y: PAD.y + Math.sin(ang) * r0 + 20,
        vx: Math.cos(ang) * (90 + rand(140)), vy: Math.sin(ang) * (90 + rand(140)) - 20,
        life: rand(0.35, 0.8), max: 0.8, s: rand(1.5, 3), c: Math.random() < .5 ? '#6a6a4a' : '#8a8464', t: 'dust' });
    }
    // 升降梯（地图 1 → 地图 2）：林岚走进升降梯站好，之后一直待在里面；镜头照常跟着她
    if (S.cineLift && S.cineT < 0.9) { const k = Math.min(1, dt * 5); S.p.x += (S.cineLift.x - S.p.x) * k; S.p.y += (S.cineLift.y - S.p.y) * k; }
    updateTrainDepart(dt);
    updateRoomsAndEvents(dt);
    updateEffects(dt);
    updateAmbience(dt);
    updateCamera(dt, false);
    if (heliBoarding() && S.cineT > 1.15) { S.p.x = PAD.x; S.p.y = PAD.y + 18; }  // 已登机，人锁在舱门位置（不再绘制）
    // 第 4.4 秒：草坪上那个东西转过来仰头看着你。写在这里而不是渲染里 ——
    // 渲染函数不该改游戏状态，否则无画面测试根本跑不到这段逻辑。
    if (heliBoarding() && S.cineT > 4.4) {
      const b = S.enemies.find(e => e.t === 'boss' && !e.dead);
      if (b) b.fa = b.a = Math.atan2(PAD.y - b.y, PAD.x - b.x);
    }
    if (S.cine <= 0) { S.cine = 0; S.cineLift = null; if (S.cineThen === 'win') { mode = 'win'; modeT = 0; } else if (typeof S.cineThen === 'string' && S.cineThen.startsWith('goto:')) { S.train = null; gotoLevel(S.cineThen.slice(5)); } S.cineThen = null; }
    return;
  }

  const aiming = updatePlayer(dt);
  updateRoomsAndEvents(dt);
  updateEnemies(dt);
  updateHazards(dt);
  updateChaseMusic(dt);
  updateAmbience(dt);
  separateEntities();
  updateEffects(dt);
  updateCamera(dt, aiming);
}
</script>
<script>/* player/update.js */
'use strict';
// 玩家每帧更新

// 玩家：瞄准、移动、射击、装填、心跳。返回本帧是否在瞄准
function updatePlayer(dt) {
  const p = S.p;
  if (updateGrab(dt)) { mouse.lp = false; P.jHeld = !!keys.KeyJ; P.focus = 0; return false; }   // 被僵尸抓着：什么都做不了，只能连按 E（ai/grab.js）
  // 瞄准 & 朝向
  const wx = mouse.x + cam.x, wy = mouse.y + cam.y;
  p.a = Math.atan2(wy - p.y, wx - p.x);
  const aiming = isAimKey() && P.reloadT <= 0;
  // 移动（安全屋隔音：在里面奔跑不发出噪音，不会把外面的怪引来）
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  const ml = Math.hypot(mx, my);
  const status = p.hp > 66 ? 0 : p.hp > 33 ? 1 : 2;
  const sprinting = !!keys.ShiftLeft && !aiming;
  let spd = aiming ? PLAYER_SPEED.aim : sprinting ? PLAYER_SPEED.run : PLAYER_SPEED.walk;
  if (P.reloadT > 0) spd *= PLAYER_SPEED.reloadMul;
  spd *= STATUS_SPEED[status];
  if (P.slowT > 0) spd *= CRAWLER.slowMul;   // 脚踝被爬行者抓住
  const wr = curRoom(), water = wr >= 0 && ROOMS[wr].water;   // 积水区：移动变慢，每一步都有水声
  if (water) spd *= water;
  if (ml > 0) {
    const mdx = mx / ml * spd * dt, mdy = my / ml * spd * dt;
    if (sprinting) autoOpenDoorOnRun(p.x + mdx, p.y + mdy, mdx, mdy);
    moveEnt(p, mdx, mdy);
    P.walk += dt * spd * 0.06;
    P.stepT -= dt * spd / 120; if (P.stepT <= 0) { P.stepT = sprinting ? 0.42 : 0.58; sfx(water ? 'wade' : 'step', water ? (sprinting ? 1.4 : 1) : sprinting ? 1.3 : 0.45); if (sprinting && !inSafe()) emitNoise(p.x, p.y, NOISE.run, 'run'); else if (water) emitNoise(p.x, p.y, NOISE.wade, 'wade'); }
  }
  if (aiming) P.focus = Math.min(1, P.focus + dt / (ml > 0 ? 1.6 : 0.8)); else P.focus = Math.max(0, P.focus - dt * 3);
  if (mouse.lp) { if (aiming) shoot(); else if (!inSafe()) msg('按住右键 / 空格 / K 瞄准后才能射击（T 切换持续瞄准）。', 2.5); }
  if (keys.KeyJ && !P.jHeld && aiming) shoot();
  else if (WEAPONS[p.wep] && WEAPONS[p.wep].auto && aiming && (mouse.l || keys.KeyJ)) shoot(); // 全自动武器：按住连射
  updateRail(dt, aiming);   // 电磁炮蓄力（ai/lazarus.js）
  P.jHeld = !!keys.KeyJ; // J 与左键一致：半自动，每按一次开一枪
  mouse.lp = false;
  // 装填
  if (P.reloadT > 0) {
    P.reloadT -= dt;
    if (P.reloadT <= 0) { const w = p.wep; if (w === 'gl') p.glLoaded = glCur(); p.mag[w] = (p.mag[w] || 0) + takeAmmo(w, Math.max(0, magCap(w) - (p.mag[w] || 0))); }
  }
  if (p.guardT > 0) p.guardT = Math.max(0, p.guardT - dt); // 红草药减伤剩余时间
  // 心跳
  if (status === 2) { P.heartT -= dt; if (P.heartT <= 0) { P.heartT = 0.75; sfx('heart'); } }
  return aiming;
}
</script>
<script>/* game/events.js */
'use strict';
// 房间切换（房间名横幅）并把事件交给触发器引擎；具体事件写在 config/triggers.js

function updateRoomsAndEvents(dt) {
  const r = curRoom();
  if (r >= 0 && r !== P.room) {
    P.room = r; const R = ROOMS[r];
    if (!S.visited[R.id]) { P.bannerT = 3; P.bannerTxt = R.name; }
    S.visited[R.id] = true;
    fireEvent('enter', { room: R.id, safe: !!R.safe });
  }
  updateTriggers();
}

// ---------------------------------------------------------------- 直升机坠毁演出（约 6.5 秒）
// 0.0  交出控制权，镜头拉向处刑者和直升机之间
// 0.3  它弯腰从地上掀起一块大石头（泥土飞溅，地上留下一个坑），0.3–1.0 慢慢举过头顶
// 1.0  后仰蓄力 → 1.35 甩出，石头打着旋飞 0.55 秒
// 1.9  命中尾梁：火花、尾桨断飞、机身开始打转冒黑烟
// 1.9–4.2  失控螺旋下坠，越转越快
// 4.2  砸地：白闪、爆炸、火球、旋翼碎片四散 → 残骸（heliDown）
// 6.5  镜头回到林岚，交还控制权
const CRASH = { rip: 0.3, wind: 1.0, throw: 1.35, hit: 1.9, ground: 4.2, end: 6.5 };
const easeIn = k => k * k, easeOut = k => 1 - (1 - k) * (1 - k);

function startHeliCrash() {
  if (S.crash || S.leap || S.cine > 0 || S.flags.heliDown || !PAD) return;
  const b = S.enemies.find(e => e.t === 'boss' && !e.dead);
  if (b && b.knockdownT > 0) { b.knockdownT = 0; b.stagAcc = 0; b.midStagDone = false; b.state = 'idle'; b.alert = true; }   // 跪着的时候：它就地站起来再掀石头（不会凭空换位置）
  const bx = b ? b.x : PAD.x - 190, by = b ? b.y : PAD.y + 170;
  const alt0 = typeof heliAlt === 'function' ? Math.max(0.35, heliAlt()) : 0.5;
  delete S.flags.heli;
  S.crash = { t: 0, bx, by, alt0, ang: 0, w: 0, hx: PAD.x, hy: PAD.y, alt: alt0, debris: [], hit: false, ground: false, ripped: false, thrown: false };
  msg('那个东西停了下来，抬头盯着直升机。', 3);
}

// 石头的飞行位置（世界坐标 + 抛物线高度），t 为演出时间
function crashRockPos(c) {
  const k = clamp((c.t - CRASH.throw) / (CRASH.hit - CRASH.throw), 0, 1);
  const tx = PAD.x, ty = PAD.y + 60 * (1 + c.alt0 * 0.55) - c.alt0 * 30;   // 尾梁位置
  return { x: lerp(c.bx, tx, k), y: lerp(c.by, ty, k), h: Math.sin(k * Math.PI) * 60 + k * c.alt0 * 40, rot: k * 14, k };
}

function updateHeliCrash(dt) {
  const c = S.crash; if (!c) return;
  const t0 = c.t; c.t += dt; const t = c.t;
  const pass = x => t0 < x && t >= x;
  const boss = S.enemies.find(e => e.t === 'boss' && !e.dead);
  if (boss) { boss.fa = boss.a = Math.atan2(c.hy - boss.y, c.hx - boss.x); boss.ph = (boss.ph || 0) + dt * (t < CRASH.throw ? 0.6 : 0.2); }

  if (pass(CRASH.rip)) {
    c.ripped = true; sfxAt('bash', c.bx, c.by, 1, 1500); sfxAt('bash', c.bx, c.by, 0.6, 1500); shake = Math.max(shake, 6);
    const a = Math.atan2(PAD.y - c.by, PAD.x - c.bx), rx = c.bx + Math.cos(a) * 30, ry = c.by + Math.sin(a) * 30;
    decals.push({ x: rx, y: ry, r: 16, rot: 0, a: 0.55, dirt: true });                  // 石头原来的坑
    for (let i = 0; i < 26; i++) { const d = rand(6.283), v = rand(60, 200); parts.push({ x: rx, y: ry, vx: Math.cos(d) * v, vy: Math.sin(d) * v, life: rand(0.4, 0.9), max: 0.9, s: rand(2, 4), c: Math.random() < .5 ? '#4a3a26' : '#6a5a3e', t: 'dust' }); }
    msg('它弯下腰，从草地里硬生生掀起一块大石头——', 3);
  }
  if (pass(CRASH.throw)) { c.thrown = true; cryAt('executioner', 'roar', c.bx, c.by, 0.9, 3000, 0.5); shake = Math.max(shake, 7); }
  if (c.thrown && !c.hit && Math.random() < 0.8) {            // 石头拖出的土屑
    const h = crashRockPos(c);
    parts.push({ x: h.x, y: h.y - h.h, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.4, max: 0.4, s: 2, c: '#777', t: 'dust' });
  }
  if (pass(CRASH.hit)) {
    c.hit = true; sfx('bash', 1); sfx('explode', 0.45); shake = Math.max(shake, 11);
    const tx = PAD.x, ty = PAD.y + 50;
    for (let i = 0; i < 36; i++) { const a = rand(6.283), v = rand(80, 320); parts.push({ x: tx, y: ty - c.alt0 * 30, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.8), max: 0.8, s: rand(1.5, 3), c: Math.random() < .5 ? '#ffd070' : '#fff2b0', t: 'spark' }); }
    c.debris.push({ x: tx, y: ty, vx: 190, vy: 120, rot: 0, vr: 18, w: 28, h: 4, life: 2.2, c: '#9aa4ae' });   // 尾桨
    for (let i = 0; i < 7; i++) { const d = rand(6.283), v = rand(100, 260); c.debris.push({ x: tx, y: ty, vx: Math.cos(d) * v, vy: Math.sin(d) * v + 80, rot: rand(6.28), vr: rand(-12, 12), w: rand(6, 13), h: rand(5, 10), life: rand(1.2, 2), c: i % 2 ? '#6b665e' : '#4f4a44' }); }   // 石头撞碎
    msg('【无线电】被什么东西砸中了！尾桨没了——失控了——Mayday！', 4);
  }
  if (c.hit && !c.ground) {                                   // 失控螺旋
    const k = clamp((t - CRASH.hit) / (CRASH.ground - CRASH.hit), 0, 1);
    c.w = lerp(3, 16, k); c.ang += c.w * dt;
    const cx = PAD.x + 20, cy = PAD.y + 10, r = 70 * (1 - k);
    c.hx = cx + Math.cos(k * 7) * r; c.hy = cy + Math.sin(k * 7) * r * 0.7;
    c.alt = (c.alt0 + 0.15 * Math.sin(Math.min(k * 3, Math.PI))) * (1 - easeIn(k));
    const tail = { x: c.hx - Math.sin(c.ang) * 60 * (1 + c.alt * .55), y: c.hy + Math.cos(c.ang) * 60 * (1 + c.alt * .55) - c.alt * 30 };
    for (let i = 0; i < 2; i++) parts.push({ x: tail.x + rand(-6, 6), y: tail.y + rand(-6, 6), vx: rand(-25, 25), vy: rand(-40, -5), life: rand(0.8, 1.5), max: 1.5, s: rand(5, 9), c: Math.random() < .3 ? '#ff8a30' : '#1a1a1a', t: 'smoke' });
    if (Math.floor(t0 * 3) !== Math.floor(t * 3)) sfx('bash', 0.25);
  }
  if (pass(CRASH.ground)) {
    c.ground = true; c.alt = 0; S.crashFlash = 1;
    runActions([{ flag: 'heliDown' }, { banner: '—— 坠 毁 ——' }], 'heliCrash');
    sfx('explode', 1.2); shake = Math.max(shake, 20);
    const gx = PAD.x + 20, gy = PAD.y + 10;
    for (let i = 0; i < 70; i++) { const a = rand(6.283), v = rand(60, 360); parts.push({ x: gx, y: gy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.3), max: 1.3, s: rand(3, 8), c: ['#ffcf60', '#ff8a30', '#ff5020', '#2a2220'][i % 4], t: 'fire' }); }
    for (let i = 0; i < 2; i++) { const a = rand(6.283); c.debris.push({ x: gx, y: gy, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, rot: rand(6.28), vr: rand(-20, 20), w: 110, h: 6, life: 1.6, c: '#8d969f' }); }   // 断掉的旋翼
    for (let i = 0; i < 10; i++) { const a = rand(6.283), v = rand(120, 300); c.debris.push({ x: gx, y: gy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rand(6.28), vr: rand(-15, 15), w: rand(6, 14), h: rand(4, 9), life: rand(1, 2), c: '#2b3138' }); }
    const d = dist(S.p.x, S.p.y, gx, gy);                      // 离得太近会被气浪掀开（不扣血）
    if (d < 140) { const a = Math.atan2(S.p.y - gy, S.p.x - gx); moveEnt(S.p, Math.cos(a) * (140 - d), Math.sin(a) * (140 - d)); }
  }
  for (const q of c.debris) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.pow(0.25, dt); q.vy *= Math.pow(0.25, dt); q.rot += q.vr * dt; q.vr *= Math.pow(0.4, dt); }
  c.debris = c.debris.filter(q => q.life > 0);
  if (S.crashFlash) S.crashFlash = Math.max(0, S.crashFlash - dt * 1.6);

  // 镜头：前半段看处刑者和直升机，砸地后慢慢回到林岚
  // 举石头时镜头偏向处刑者（看清它弯腰掀石头），甩出后跟着石头移向直升机
  const wBoss = t < CRASH.throw ? 0.75 : lerp(0.75, 0.3, clamp((t - CRASH.throw) / (CRASH.hit - CRASH.throw), 0, 1));
  const focus = t < CRASH.hit ? { x: lerp(PAD.x, c.bx, wBoss), y: lerp(PAD.y, c.by, wBoss) } : { x: c.hx, y: c.hy };
  const back = clamp((t - CRASH.ground - 0.9) / 1.2, 0, 1);
  const fx = lerp(focus.x, S.p.x, back), fy = lerp(focus.y, S.p.y, back);
  cam.x = lerp(cam.x, fx - W / 2, Math.min(1, dt * 3)); cam.y = lerp(cam.y, fy - H / 2, Math.min(1, dt * 3));

  if (t >= CRASH.end) { S.crash = null; S.crashFlash = 0; }
}

// ---------------------------------------------------------------- 处刑者从二楼栏杆跳下（计划 3.5：放入最后一枚徽章时）
// 0.0  交出控制权、黑边；头顶木头断裂，木屑和灰往下掉，落点出现影子
// 1.0  它从画面外砸下来 → 1.35 落地：震屏、尘土一圈、地板裂开；离得太近的林岚被气浪推开（不扣血）
// 1.35–2.6  它慢慢直起身，1.8 秒一声怒吼，红眼盯着你
// 2.6  交还控制权，它进入追击 —— 酒窖的门就在身后，跑
const LEAP = { drop: 1.0, land: 1.35, roar: 1.8, end: 2.6 };
function startExecLeap(tx, ty) {
  if (S.leap || S.crash || S.cine > 0) return;   // 已经在别的演出里（比如玩家抢先坐上了升降梯）就不跳了
  const old = S.enemies.find(e => e.t === 'boss' && !e.dead);
  if (old && execSeen(old)) {   // 它就在你眼前（比如刚被你打倒在主厅里）：不能再从二楼跳下来一只
    if (execDown(old)) { msg('石板挪开的巨响在大厅里回荡。那个东西还跪在地上 —— 趁现在！', 3.5); return; }
    exChase(old); cryAt('executioner', 'roar', old.x, old.y, 1, 3000, 0.6); shake = Math.max(shake, 10);
    msg('它听见了石板挪开的声音，转过身冲了过来！', 3); return;
  }
  S.enemies = S.enemies.filter(e => e !== old);      // 不在眼前：不管原来在哪，都从楼上下来
  S.leap = { t: 0, x: (tx + .5) * T, y: (ty + .5) * T };
  sfxAt('creak', S.leap.x, S.leap.y, 1.4, 1500); sfxAt('bash', S.leap.x, S.leap.y, 0.6, 1500);
  msg('头顶的栏杆发出一声断裂的巨响——', 2.5);
}
function updateExecLeap(dt) {
  const L = S.leap; if (!L) return;
  const t0 = L.t; L.t += dt; const t = L.t, pass = x => t0 < x && t >= x;
  if (t < LEAP.land && Math.random() < 0.7) parts.push({ x: L.x + rand(-40, 40), y: L.y + rand(-60, 10), vx: rand(-10, 10), vy: rand(30, 80), life: rand(0.4, 0.9), max: 0.9, s: rand(1.5, 3.5), c: Math.random() < .5 ? '#6a5a44' : '#8a7a60', t: 'dust' });
  if (pass(LEAP.land)) {
    spawnExecutioner(L.x / T - .5, L.y / T - .5, true);
    const b = S.enemies.find(e => e.t === 'boss' && !e.dead);
    if (b) { b.fa = b.a = Math.atan2(S.p.y - b.y, S.p.x - b.x); b.state = 'wait'; }
    sfx('bash', 1.2); sfx('explode', 0.55); shake = Math.max(shake, 24);
    decals.push({ x: L.x, y: L.y + 4, r: 26, rot: 0, a: 0.6, dirt: true });
    for (let i = 0; i < 44; i++) { const a = rand(6.283), v = rand(120, 300); parts.push({ x: L.x, y: L.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, s: rand(2, 5), c: Math.random() < .5 ? '#6a5a44' : '#9a8a70', t: 'dust' }); }
    const d = dist(S.p.x, S.p.y, L.x, L.y);
    if (d < 120) { const a = Math.atan2(S.p.y - L.y, S.p.x - L.x); moveEnt(S.p, Math.cos(a) * (120 - d), Math.sin(a) * (120 - d)); }
  }
  const b = S.enemies.find(e => e.t === 'boss' && !e.dead);
  if (b && t >= LEAP.land) { b.fa = b.a = Math.atan2(S.p.y - b.y, S.p.x - b.x); b.ph = (b.ph || 0) + dt * 0.3; }
  if (pass(LEAP.roar) && b) { cryAt('executioner', 'roar', b.x, b.y, 1, 3000, 0.6); shake = Math.max(shake, 12); msg('「处刑者」从二楼跳了下来！', 3); }
  // 镜头：看落点和林岚之间
  const fx = lerp(L.x, S.p.x, 0.4), fy = lerp(L.y, S.p.y, 0.4);
  cam.x = lerp(cam.x, fx - W / 2, Math.min(1, dt * 4)); cam.y = lerp(cam.y, fy - H / 2, Math.min(1, dt * 4));
  if (t >= LEAP.end) {
    S.leap = null;
    if (b) { b.state = 'idle'; b.alert = true; b.atkT = 0; b.lastSeen = { x: S.p.x, y: S.p.y }; b.stag = 0.5; }   // idle + alert：下一帧由状态机转入追击；stag 给玩家半秒起跑
  }
}

// ---------------------------------------------------------------- 地图 2 结尾：货运列车开走
// 0–0.7 秒林岚跳上车门；1.2 秒起列车加速向东，钻进隧道（站台东墙）；2.6 秒处刑者撞开闸门冲上站台，扑了个空
const TRAIN_ANIM = { go: 1.2, acc: 170, bossAt: 2.6 };
// opt（地图 3 结局用）：tunnel 隧道口所在的东墙 x（格，缺省 64）、clip 站台西边界（格，缺省 24）、noBoss 不让处刑者追出来
function startTrainDepart(r, opt = {}) {
  const [x, y, w, h] = r;
  S.train = { t: 0, x: x * T, y: y * T, w: w * T, h: h * T, door: { x: S.p.x, y: S.p.y }, bossIn: false,
    tunnel: opt.tunnel ?? 64, clip: opt.clip ?? 24, noBoss: !!opt.noBoss, north: S.p.y < y * T };
  sfx('metal', 1); shake = Math.max(shake, 4);
}
const trainOffset = t => t < TRAIN_ANIM.go ? 0 : 0.5 * TRAIN_ANIM.acc * (t - TRAIN_ANIM.go) ** 2;
function updateTrainDepart(dt) {
  const R = S.train; if (!R) return;
  const was = R.t; R.t += dt;
  const p = S.p;
  // 林岚跳上车：朝车门走两步，然后人就在车上了（不再绘制）
  if (R.t < 0.7) { p.y += ((R.north ? R.y + 6 : R.y + R.h - 6) - p.y) * Math.min(1, dt * 6); p.a = R.north ? Math.PI / 2 : -Math.PI / 2; }
  // 列车起步 / 加速的声音
  if (was < TRAIN_ANIM.go && R.t >= TRAIN_ANIM.go) { sfx('bash', 0.8); sfx('sizzle', 0.9); shake = Math.max(shake, 6); }
  const off = trainOffset(R.t), sp = R.t > TRAIN_ANIM.go ? TRAIN_ANIM.acc * (R.t - TRAIN_ANIM.go) : 0;
  if (sp > 0) { R.clack = (R.clack || 0) - dt * sp / 90; if (R.clack <= 0) { R.clack = 1; sfx('step', 1.6); } }
  // 车轮火花：沿着车底往后飞
  if (sp > 60 && Math.random() < 0.8) {
    const xs = R.x + off + Math.random() * R.w, ys = R.y + R.h - 4;
    if (xs < R.tunnel * T) parts.push({ x: xs, y: ys, vx: -sp * 0.4 - rand(40), vy: rand(-40, 10), life: rand(0.2, 0.45), max: 0.45, s: rand(1.5, 3), c: Math.random() < .5 ? '#ffd070' : '#ff9a30' });
  }
  // 镜头：人在车上 —— 跟着车门走一小段，然后停在站台上看着列车远去
  p.x = R.door.x + Math.min(off, 5 * T);
  // 处刑者：撞开闸门冲上站台，追着车跑，追不上
  if (!R.noBoss && was < TRAIN_ANIM.bossAt && R.t >= TRAIN_ANIM.bossAt) {
    let b = activeExecutioner();
    if (b && execSeen(b) && execDown(b)) R.bossDown = true;   // 你把它打倒 / 冻住了才上的车：它就躺在原地看着车开走
    else if (b && execSeen(b)) { b.state = 'chase'; R.bossIn = true; cryAt('executioner', 'roar', b.x, b.y, 1, 5000, 0.6); shake = Math.max(shake, 10); }   // 它就在站台上：从原地追出来
    else {   // 不在眼前（或者还没登场）：撞开闸门冲上站台
      if (!b) { spawnExecutioner(48, 12, true); b = activeExecutioner(); }
      if (b) { b.x = 48.5 * T; b.y = 12 * T; b.frozenT = 0; b.knockdownT = 0; b.state = 'chase'; R.bossIn = true; }
      sfxAt('bash', 48.5 * T, 13 * T, 1.4, 5000, 0.6); cryAt('executioner', 'roar', 48.5 * T, 12 * T, 1, 5000, 0.6); shake = Math.max(shake, 14);
    }
  }
  if (R.bossDown && R.t > 6.2 && !R.roar2) {   // 倒在地上冲着远去的列车吼一声
    R.roar2 = true; const d = activeExecutioner(); if (d) cryAt('executioner', 'pain', d.x, d.y, 1, 5000, 0.5);
  }
  const b = R.bossIn && activeExecutioner();
  if (b) {
    const tx = Math.min(R.x + off + R.w - 30, 62 * T), ty = R.y + R.h + 26;
    const a = Math.atan2(ty - b.y, tx - b.x), d = Math.hypot(tx - b.x, ty - b.y);
    if (d > 8) { const v = Math.min(d, 230 * dt); b.x += Math.cos(a) * v; b.y += Math.sin(a) * v; b.ph = (b.ph || 0) + dt * 1.6; }
    b.fa = b.a = Math.atan2(R.y + R.h / 2 - b.y, Math.min(R.x + off + R.w, 64 * T) - b.x);
    if (R.t > 6.2 && !R.roar2) { R.roar2 = true; cryAt('executioner', 'roar', b.x, b.y, 1, 5000, 0.5); shake = Math.max(shake, 8); }
  }
}
// 渲染（在地面和道具之后、人物之前）：先把站台上静态的那列车盖掉，再画移动中的列车，裁在站台里（东墙就是隧道口）
function drawTrainDepart() {
  const R = S.train; if (!R) return;
  const off = trainOffset(R.t);
  ctx.save();
  ctx.fillStyle = '#16181a'; ctx.fillRect(R.x - 4, R.y, R.w + 8, R.h);   // 空出来的轨道
  ctx.fillStyle = '#4a4540'; for (let x = R.x; x < R.x + R.w; x += 22) ctx.fillRect(x, R.y + 8, 8, R.h - 16);   // 枕木
  ctx.fillStyle = '#8a8a88'; ctx.fillRect(R.x - 4, R.y + 18, R.w + 8, 3); ctx.fillRect(R.x - 4, R.y + R.h - 21, R.w + 8, 3);   // 钢轨
  ctx.beginPath(); ctx.rect(R.clip * T, R.y - T, (R.tunnel - R.clip) * T, R.h + 2 * T); ctx.clip();
  const px = R.x + off, py = R.y, pw = R.w, ph = R.h, n = Math.max(1, Math.round(pw / (T * 6)));
  for (let k = 0; k < n; k++) {
    const x0 = px + k * pw / n + 4, w0 = pw / n - 8;
    ctx.fillStyle = '#3a3f44'; ctx.fillRect(x0, py + 6, w0, ph - 12);
    ctx.fillStyle = '#23272b'; for (let j = 12; j < w0 - 8; j += 16) ctx.fillRect(x0 + j, py + 10, 3, ph - 20);
    ctx.fillStyle = '#8a6a2a'; ctx.fillRect(x0, py + ph / 2 - 3, w0, 6);
    if (k < n - 1) { ctx.fillStyle = '#222'; ctx.fillRect(x0 + w0, py + ph / 2 - 4, 8, 8); }   // 车钩
  }
  // 最后一节车厢：开着的车门（林岚就在里面）+ 红色尾灯
  const dx = R.door.x + off;
  const dy = R.north ? py + 6 : py + ph - 26;
  ctx.fillStyle = '#0c0c0a'; ctx.fillRect(dx - 16, dy, 32, 20);
  ctx.fillStyle = 'rgba(255,220,150,0.35)'; ctx.fillRect(dx - 12, dy + 2, 24, 16);
  const blink = 0.6 + 0.4 * Math.sin(R.t * 10);
  ctx.fillStyle = `rgba(255,40,30,${blink})`; ctx.beginPath(); ctx.arc(px + 6, py + 16, 5, 0, 7); ctx.arc(px + 6, py + ph - 16, 5, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(px, py + ph / 2, 0, px, py + ph / 2, 90); g.addColorStop(0, `rgba(255,30,20,${0.35 * blink})`); g.addColorStop(1, 'rgba(255,30,20,0)');
  ctx.fillStyle = g; ctx.fillRect(px - 90, py - 50, 180, ph + 100);
  ctx.restore();
  // 隧道口：东墙上一块黑洞
  ctx.fillStyle = '#050505'; ctx.fillRect(R.tunnel * T - 6, R.y - 6, 12, R.h + 12);
}
</script>
<script>/* ai/enemies.js */
'use strict';
// 普通敌人 AI：感知、调查、追击、攻击、分离（处刑者在 ai/executioner.js）

// ---------------------------------------------------------------- 敌人 AI
function updateEnemies(dt) {
  // 感知模型：看见 → 追击（alert）；听见 → 前往声源调查（heard）；丢失目标一段时间后 → 去最后看见的位置，再回到游荡。
  // 处刑者有自己的状态机和导演系统（ai/executioner.js）
  const safe = inSafe();
  updateFollow(dt);
  const ex = activeExecutioner();
  if (ex && S.executioner) updateDirector(dt, ex, safe);
  for (const e of S.enemies) updateEnemy(e, dt, safe);
}

function updateEnemy(e, dt, safe) {
    const p = S.p;
    if (e.dead) { e.deadT += dt; if (e.revive && e.deadT > e.revive) tryReviveCrawler(e); return; }
    if (e.t === 'crawler' && e.state === 'lurk') { updateLurk(e, dt, safe); return; }
    if (e.t === 'vine') { updateVine(e, dt, safe); return; }     // 温室里的蔓生体（ai/vine.js）
    if (e.t === 'slime') { updateSlime(e, dt, safe); return; }   // 水里的淤泥体（ai/slime.js）
    if (e.t === 'hunter') { updateHunter(e, dt, safe); return; }   // 生产车间的猎手（ai/hunter.js）
    if (e.t === 'licker') { updateLicker(e, dt, safe); return; }   // 失明：只靠听觉（ai/licker.js）
    if (e.t === 'boss') { updateExecutioner(e, dt, safe); return; }
    if (e.t === 'executionerBerserk') { updateBerserk(e, dt, safe); return; }
    if (e.t === 'lazarus') { updateLazarus(e, dt, safe); return; }   // 终点站台 Boss 战（ai/lazarus.js）
    if (e.t === 'tentacle') { updateTentacle(e, dt, safe); return; }   // 焚化炉 Boss 战（ai/berserk.js）  // 常驻追踪者：任何距离都更新
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
    if (d > SLEEP_DIST) return;  // 远处的普通敌人休眠
    if (e.leaveCd > 0) e.leaveCd -= dt;
    e.ph += dt; e.knifeStunT = Math.max(0, (e.knifeStunT || 0) - dt);
    const ang = Math.atan2(dy, dx);
    // 视野锥（计划 5.1 / 5.2）：没发现你之前只看得见前方 fov 度（僵尸 100°、狗 180°），背后只靠听觉；
    // 已经在追你（alert）时一直盯着，不看方向。贴身 70px 以内怎样都会发现
    const fov = EDEF[e.t].fov, inCone = e.alert || !fov || Math.abs(angDiff(e.fa, ang)) <= fov * Math.PI / 360;
    const los = d < e.sight && inCone && losClear(e.x, e.y, p.x, p.y);
    const direct = walkClear(e.x, e.y, p.x, p.y);
    // 看见玩家（玩家在安全屋里时不算）
    if (!safe && (los || d < 70)) {
      if (!e.alert) enemyCry(e, 'spot', 1, 700, 0.2);   // 发现你的那一下（狗连吠、僵尸嘶吼、寄生体尖叫）：「被看见了」的提示
      e.alert = true; e.lostT = 0; e.heard = null; e.heardField = null; e.lastSeen = { x: p.x, y: p.y };
    }
    if (e.alert && !los) {
      if (!bashKeepsTarget(e)) e.lostT = (e.lostT || 0) + dt; // 拍门时（玩家就在门后不远）不会遗忘
      if (safe || e.lostT > (EDEF[e.t].memory || 6)) {
        e.alert = false; e.lostT = 0;
        if (safe) leaveSafeDoor(e, p);   // 玩家躲进安全屋：不守门，走开去别处
        else {
          const ls = e.lastSeen || { x: p.x, y: p.y };
          e.heard = { x: ls.x, y: ls.y, t: 8, label: 'lastSeen' }; e.heardField = noiseField(ls.x, ls.y, 14);
        }
      }
    }
    if (!e.alert && e.state === 'bash') e.state = 'idle'; // 放弃拍门
    // 声音
    e.groanT -= dt;
    // 平时的叫声。追你的时候（alert）只是偶尔低声喘吼：像《僵尸世界大战》那样，发现你时吼一声，之后不再一路大喊
    if (e.groanT <= 0) { e.groanT = e.alert ? rand(8, 14) : rand(4, 9); enemyCry(e, 'idle', (e.t === 'parasite' ? 0.5 : 1) * (e.alert ? 0.6 : 1), e.t === 'parasite' ? 500 : 650); }
    if (e.stag > 0) { e.stag -= dt; return; }
    if (e.state === 'grab') return;   // 正抓着玩家（ai/grab.js 负责）
    if (safe && e.state === 'attack') { e.state = 'chase'; e.atkT = 0; }
    if (e.state === 'attack') {
      e.atkT -= dt; e.fa += angDiff(e.fa, ang) * Math.min(1, dt * 4);
      if (e.t === 'dog') moveEnt(e, Math.cos(e.fa) * 230 * dt, Math.sin(e.fa) * 230 * dt);
      if (e.atkT <= 0) {
        if (d < e.r + p.r + EDEF[e.t].reach + 6) {
          if (e.t === 'zombie' && tryGrab(e)) return;   // 僵尸：先抓住，连按 E 挣脱（ai/grab.js）
          hurtPlayer(e.dmg, ang, e.t);
          if (e.t === 'crawler') { P.slowT = CRAWLER.slowT; msg('脚踝被一只手死死攥住了！', 2); }   // 抓脚踝：短暂减速
        }
        e.state = 'rec'; e.recT = EDEF[e.t].rec;
      }
      return;
    }
    if (e.state === 'rec') { e.recT -= dt; if (e.recT <= 0) e.state = 'chase'; return; }
    let vx = 0, vy = 0, sp = e.spd;
    if (e.alert) {
      if (d < e.r + p.r + EDEF[e.t].reach * 0.7 && los && direct && !safe) { e.state = 'attack'; e.atkT = EDEF[e.t].windup; if (!(e.atkVoT > S.time)) { e.atkVoT = S.time + rand(3, 5); enemyCry(e, 'attack', e.t === 'dog' ? 1 : 0.8, 650); } return; }   // 扑咬叫声每只 3–5 秒最多一次（围上来的一群不会每一下都吼）
      let tx, ty;
      if (los && direct) { tx = p.x; ty = p.y; }
      else {
        const n = flowNext(e);
        // B 层（僵尸）：下一步是关着的门，而且已经贴到门上 → 拍门
        const bd = doorBashTarget(e, n);
        if (bd) { bashDoor(e, bd[0], bd[1], dt, d); return; }
        if (n) { tx = n[0]; ty = n[1]; }
      }
      if (e.state === 'bash') e.state = 'chase';
      if (tx !== undefined) { const a = Math.atan2(ty - e.y, tx - e.x); vx = Math.cos(a); vy = Math.sin(a); }
    } else if (e.heard) {
      // 调查：沿噪音场走向声源，到达后环顾片刻再放弃
      e.heard.t -= dt;
      const n = dist(e.x, e.y, e.heard.x, e.heard.y) > T * 0.8 ? noiseNext(e) : null;
      if (n) { const a = Math.atan2(n[1] - e.y, n[0] - e.x); vx = Math.cos(a) * 0.85; vy = Math.sin(a) * 0.85; }
      else { e.heard.t = Math.min(e.heard.t, 2.5); e.fa += dt * 1.5; }
      if (e.heard.t <= 0) { e.heard = null; e.heardField = null; }
    } else if (safe && d < SAFE_LEAVE.near * T && (e.leaveCd || 0) <= 0) {
      leaveSafeDoor(e, p);   // 在安全屋门口晃悠的也会走开（不会堵门）
    } else {
      e.wT -= dt; if (e.wT <= 0) { e.wT = rand(2, 5); e.wa = rand(Math.PI * 2); e.moving = Math.random() < 0.5; }
      if (e.moving) { vx = Math.cos(e.wa) * 0.35; vy = Math.sin(e.wa) * 0.35; }
    }
    if (e.t === 'zombie') sp *= 0.8 + 0.4 * Math.abs(Math.sin(e.ph * 2.2)); // 蹒跚
    if (e.t === 'crawler') { sp *= 0.5 + 0.9 * Math.max(0, Math.sin(e.ph * 3)); if ((vx || vy) && Math.random() < dt * 2) decals.push({ x: e.x - Math.cos(e.fa) * 12, y: e.y - Math.sin(e.fa) * 12, r: rand(3, 6), rot: 0, a: 0.5 }); }   // 一下一下往前拖，身后留血痕
    if (vx || vy) {
      const ox = e.x, oy = e.y;
      moveEnt(e, vx * sp * dt, vy * sp * dt);
      e.fa += angDiff(e.fa, Math.atan2(vy, vx)) * Math.min(1, dt * 5);
      // 安全屋阻挡：任何敌人都不能进入，且会取消已开始的攻击。
      if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; e.state = 'chase'; e.atkT = 0; }
    }
}

// ---------------------------------------------------------------- 不堵安全屋的门
// 玩家在安全屋里时，门外的敌人放弃目标，走到离安全屋 far 格以外的地方再游荡 —— 出门时不会一开门就撞上一群
const SAFE_LEAVE = { near: 8, far: [10, 16], t: 14, cd: 6 };
function leaveSafeDoor(e, p) {
  e.leaveCd = SAFE_LEAVE.cd;
  const ex = Math.floor(e.x / T), ey = Math.floor(e.y / T);
  for (let k = 0; k < 40; k++) {
    const a = rand(6.283), r = rand(SAFE_LEAVE.far[0], SAFE_LEAVE.far[1]);
    const tx = Math.floor(p.x / T + Math.cos(a) * r), ty = Math.floor(p.y / T + Math.sin(a) * r);
    if (tx < 1 || ty < 1 || tx >= MW - 1 || ty >= MH - 1 || solidT(tx, ty) || grid[ty * MW + tx] !== 1) continue;
    const x = (tx + .5) * T, y = (ty + .5) * T;
    if (inSafeTile(x, y)) continue;
    const f = noiseField(x, y, SAFE_LEAVE.far[1] + 12);
    if (f[ey * MW + ex] < 0) continue;   // 走不过去
    e.heard = { x, y, t: SAFE_LEAVE.t, label: 'leave' }; e.heardField = f; e.state = 'idle';
    return true;
  }
  // 找不到合适的地方：至少别站在门口 —— 朝远离玩家的方向慢慢走
  e.heard = null; e.heardField = null; e.wa = Math.atan2(e.y - p.y, e.x - p.x); e.moving = true; e.wT = 4;
  return false;
}

// 敌人之间、敌人与玩家之间互相推开
function separateEntities() {
  const p = S.p;
  const al = S.enemies.filter(e => !e.dead);
  for (let i = 0; i < al.length; i++) {
    const a = al[i];
    for (let j = i + 1; j < al.length; j++) {
      const b = al[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
      if (!(d < m && d > 0.01)) continue;
      const nx = dx / d, ny = dy / d;
      // 处刑者不会被挡住：挡路的僵尸被它整个推开，并踉跄一下（计划 3.2“推开”）
      if (a.t === 'boss' || b.t === 'boss') {
        const o = a.t === 'boss' ? b : a, s = a.t === 'boss' ? 1 : -1;
        pushEnemy(o, s * nx * (m - d), s * ny * (m - d));
        if (m - d > 1 && !(o.stag > 0)) o.stag = EXEC.trample;  // 每帧都会分开，所以重叠只有 1–2 像素
        continue;
      }
      const o = (m - d) / 2; pushEnemy(a, -nx * o, -ny * o); pushEnemy(b, nx * o, ny * o);
    }
    const dx = a.x - p.x, dy = a.y - p.y, d = Math.hypot(dx, dy), m = a.r + p.r;
    if (d < m && d > 0.01) pushEnemy(a, dx / d * (m - d), dy / d * (m - d));
  }
}

// ---------------------------------------------------------------- 爬行者
// 死掉的僵尸「复活」成爬行者：原地、原朝向，仍然趴着装死。玩家要走近才会复活（远处的保持死亡）
function tryReviveCrawler(e) {
  const d = dist(e.x, e.y, S.p.x, S.p.y);
  if (d > CRAWLER.reviveDist * T || inSafe()) return;
  const c = mkEnemy('crawler', 0, 0);
  Object.assign(e, { t: 'crawler', dead: false, deadT: 0, revive: 0, hp: c.hp, maxhp: c.hp, r: c.r, spd: c.spd, sight: c.sight, dmg: c.dmg, reach: c.reach,
    state: 'lurk', alert: false, stag: 0, atkT: 0, twitchT: rand(0.5, 1.5), heard: null, heardField: null });
}
// 装死：不动、不出声，只偶尔抽一下手指。玩家踩到跟前、或者它挨了打，就暴起抓脚踝
function updateLurk(e, dt, safe) {
  e.twitchT -= dt; if (e.twitchT <= 0) { e.twitchT = rand(CRAWLER.twitch[0], CRAWLER.twitch[1]); e.twitch = 0.35; }
  if (e.twitch > 0) e.twitch -= dt;
  const d = dist(e.x, e.y, S.p.x, S.p.y);
  if (e.alert || (!safe && d < CRAWLER.wakeDist)) {
    e.state = 'attack'; e.atkT = EDEF.crawler.windup; e.alert = true; e.lastSeen = { x: S.p.x, y: S.p.y };
    e.fa = Math.atan2(S.p.y - e.y, S.p.x - e.x);
    groanAt(e.x, e.y, 1, false, 700, 0.3, 'attack'); shake = Math.max(shake, 3);   // 装死的爬行者扑起来：嘶吼
  }
}
</script>
<script>/* ai/grab.js */
'use strict';
// 僵尸抓人（计划 5.2）：僵尸的攻击打中时不直接咬，而是先抓住你 —— 连按 E 挣脱。
//
//   被抓住：不能移动、瞄准、射击；屏幕中间出现「连按 E 挣脱」和进度条
//   GRAB.bite 秒内按够 GRAB.need 次 E → 挣脱：僵尸被推开、踉跄；你有一小段时间不会被再抓
//   没挣脱 → 被咬一口（GRAB.biteDmg，比普通攻击疼），然后僵尸松口
//   投掷物（G）：被抓时按 G = 把手雷 / 闪光弹塞给它 → 立刻挣脱（手雷直接炸它，闪光弹让它眩晕）
//   抓你的僵尸被别的东西打倒 / 打出硬直 → 松手
//
//   P.grab = { e, t, n }   e 抓你的僵尸，t 已经抓了多久，n 按了几次 E

const GRAB = {
  grabDmg: 5,        // 被抓住那一下的抓伤
  bite: 1.8,         // 这么多秒内没挣脱就会被咬
  need: 8,           // 挣脱要按几次 E
  biteDmg: 32,       // 咬一口（普通攻击 20）
  cd: 2.5,           // 挣脱 / 被咬之后，这么久不会被再抓
  pushStag: 1.4,     // 挣脱时僵尸踉跄多久
  nadeDmg: 150,      // 被抓时塞手雷：直接炸抓你的那只
};

function isGrabbed() { return !!(P.grab && P.grab.e); }

// 僵尸的攻击打中：能抓就抓（返回 true），不能抓就走普通伤害
function tryGrab(e) {
  if (isGrabbed() || (P.grabCd || 0) > 0 || (P.inv || 0) > 0 || inSafe() || mode !== 'play') return false;   // 无敌时间里抓不住
  P.grab = { e, t: 0, n: 0 };
  e.state = 'grab'; e.atkT = 0;
  hurtPlayer(GRAB.grabDmg, Math.atan2(S.p.y - e.y, S.p.x - e.x), 'grab');
  P.reloadT = 0; P.focus = 0; P.railCharge = 0;
  enemyCry(e, 'attack', 1, 800, 0.3);
  msg('被抓住了！连按 E 挣脱！', 2);
  return true;
}

function releaseGrab(how) {
  const g = P.grab; if (!g) return;
  const e = g.e; P.grab = null; P.grabCd = GRAB.cd;
  if (!e || e.dead) return;
  if (how === 'escape') {
    const a = Math.atan2(e.y - S.p.y, e.x - S.p.x);
    pushEnemy(e, Math.cos(a) * 26, Math.sin(a) * 26);
    e.state = 'chase'; e.stag = GRAB.pushStag; P.inv = Math.max(P.inv || 0, 0.6);
    floats.push({ x: e.x, y: e.y - 26, t: '挣脱！', life: 1, c: '#e8e070' });
    sfx('bash', 0.7);
  } else if (e.state === 'grab') { e.state = 'rec'; e.recT = EDEF[e.t].rec; }
}

// 连按 E
function grabMash() {
  const g = P.grab; if (!g) return false;
  g.n++; shake = Math.max(shake, 3); sfx('knife', 0.3);
  if (g.n >= GRAB.need) releaseGrab('escape');
  return true;
}

// 被抓时按 G：把投掷物塞给它
function grabThrow() {
  const g = P.grab; if (!g) return false;
  const id = curThrow();
  if (!id) { msg('没有投掷物 —— 连按 E 挣脱！', 1.5); return false; }
  const e = g.e;
  invTake(id, 1); curThrow();
  releaseGrab('escape');
  if (id === 'grenade') {
    sfxAt('explode', e.x, e.y, 1, 1600, 0.3); shake = Math.max(shake, 14);
    for (let i = 0; i < 30; i++) { const a = rand(6.283), v = rand(80, 300); parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, s: rand(2, 5), c: Math.random() < .5 ? '#ffd070' : '#ff7a20' }); }
    damageEnemy(e, GRAB.nadeDmg, Math.atan2(e.y - S.p.y, e.x - S.p.x), 30, false, 1, 'blast');
    emitNoise(e.x, e.y, THROW.grenade.noise, 'grenade');
    msg('把手雷塞进了它嘴里！', 2);
  } else {
    sfx('explode', 0.4); e.stag = Math.max(e.stag || 0, THROW.flashbang.stun); e.alert = false;
    P.whiteT = Math.max(P.whiteT || 0, 0.5);
    msg('闪光弹贴脸炸开 —— 它捂着眼睛松手了！', 2);
  }
  return true;
}

// 每帧（player/update.js 开头调用）。返回 true = 被抓着，这一帧玩家不能做别的
function updateGrab(dt) {
  if ((P.grabCd || 0) > 0) P.grabCd -= dt;
  const g = P.grab; if (!g) return false;
  const e = g.e, p = S.p;
  if (!e || e.dead || e.stag > 0 || e.state !== 'grab' || inSafe() || mode !== 'play') { releaseGrab('drop'); return false; }
  g.t += dt;
  // 被抓着：僵尸贴在身上，朝着你
  const a = Math.atan2(p.y - e.y, p.x - e.x); e.fa = a;
  const want = e.r + p.r - 4, d = dist(e.x, e.y, p.x, p.y);
  if (d > want + 1) moveEnt(e, Math.cos(a) * (d - want) * Math.min(1, dt * 10), Math.sin(a) * (d - want) * Math.min(1, dt * 10));
  if (g.t >= GRAB.bite) {
    P.inv = 0; hurtPlayer(GRAB.biteDmg, a, 'zombie');
    bleed(p.x, p.y, a, 20, true);
    msg('被狠狠咬了一口！', 2);
    releaseGrab('bite');
  }
  return true;
}

// 屏幕中间的提示和进度条（ui/hud.js 调用）
function drawGrab() {
  const g = P.grab; if (!g) return;
  const k = Math.min(1, g.n / GRAB.need), left = Math.max(0, 1 - g.t / GRAB.bite);
  const x = W / 2 - 120, y = H / 2 + 70, shakeX = Math.sin(performance.now() / 30) * 2;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#ffe070'; ctx.fillText('连按 E 挣脱！', W / 2 + shakeX, y - 12);
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x, y, 240, 12);
  ctx.fillStyle = '#e8d050'; ctx.fillRect(x, y, 240 * k, 12);
  ctx.fillStyle = left < 0.35 ? '#e83a2a' : '#a02020'; ctx.fillRect(x, y + 16, 240 * left, 4);
  if (curThrow()) { ctx.font = '13px sans-serif'; ctx.fillStyle = '#ccc'; ctx.fillText(`或按 G 把${ITEMS[curThrow()].name}塞给它`, W / 2, y + 38); }
  ctx.restore();
}
</script>
<script>/* ai/licker.js */
'use strict';
// 舔舐者（计划 5.x / 4.2）：完全失明，只靠听觉。
//   · 正常走路不会被发现；跑步、开枪、开关门会暴露（emitNoise 在 world/noise.js 里把声源位置交给它）
//   · 它扑向的是「声音在哪」，不是「玩家在哪」—— 响完就走开，它会扑个空
//   · 声源附近有人（舌头够得着）→ 长舌 3 格远程攻击；声源在 4 格内且路上没挡 → 猛扑
//   · 贴身撞上它也会被发现（摸到了）
//   · 近距离的枪声太响，它会混乱几秒（原地打转）
// 数值在 config/enemies.js 的 EDEF.licker / LICKER。

function lickerHear(e, x, y, label, radius = 0) {
  e.heard = { x, y, t: LICKER.memory, label }; e.heardAt = S.time; e.heardField = null;
  // 只有霰弹枪这种级别的巨响、而且贴得很近才会震懵它；震懵过一次之后一段时间内不会再被震懵
  if (label === 'gun' && radius >= LICKER.confuseNoise && dist(e.x, e.y, x, y) < LICKER.confuseDist && S.time >= (e.confCd || 0)) {
    e.confT = LICKER.confuseT; e.confCd = S.time + LICKER.confuseCd; e.state = 'idle';
  }
  if (!e.alertSfxT || S.time - e.alertSfxT > 3) { e.alertSfxT = S.time; cryAt('licker', 'screech', e.x, e.y, 0.6, 800, 0.1); }
}

function updateLicker(e, dt, safe) {
  const p = S.p, d = dist(e.x, e.y, p.x, p.y);
  if (d > SLEEP_DIST) return;
  e.ph += dt; e.tongueT = Math.max(0, (e.tongueT || 0) - dt);
  if (e.stag > 0) { e.stag -= dt; return; }
  if (e.confT > 0) { e.confT -= dt; return; }   // 震懵：原地甩头（只在绘制里抖动，不转身）
  // 撞上了：摸到了人
  if (!safe && d < e.r + p.r + 10) lickerHear(e, p.x, p.y, 'touch');
  const fresh = e.heard && S.time - (e.heardAt || 0) < LICKER.fresh;
  if (e.heard) { e.heard.t -= dt; if (e.heard.t <= 0) { e.heard = null; } }
  e.alert = !!fresh;

  if (e.state === 'attack') {
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.tongueT = 0.25;
      if (!safe && d < LICKER.tongue && losClear(e.x, e.y, p.x, p.y)) hurtPlayer(e.dmg, Math.atan2(p.y - e.y, p.x - e.x), 'licker');
      e.state = 'rec'; e.recT = EDEF.licker.rec;
    }
    return;
  }
  if (e.state === 'lunge') {
    e.lungeT -= dt;
    const ox = e.x, oy = e.y;
    moveEnt(e, Math.cos(e.fa) * LICKER.lungeSpd * dt, Math.sin(e.fa) * LICKER.lungeSpd * dt);
    if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; e.lungeT = 0; }
    if (!safe && d < e.r + p.r + 8 && !e.lungeHit) { e.lungeHit = true; hurtPlayer(Math.round(e.dmg * 1.2), e.fa, 'licker'); }
    if (e.lungeT <= 0) { e.state = 'rec'; e.recT = 0.8; }
    return;
  }
  if (e.state === 'rec') { e.recT -= dt; if (e.recT <= 0) e.state = 'idle'; return; }

  let vx = 0, vy = 0, sp = e.spd;
  if (fresh) {
    const hx = e.heard.x, hy = e.heard.y, dh = dist(e.x, e.y, hx, hy);
    const ah = Math.atan2(hy - e.y, hx - e.x);
    // 声源旁边有人、舌头够得着 → 长舌
    if (!safe && d < LICKER.tongue && dist(p.x, p.y, hx, hy) < LICKER.nearSource && losClear(e.x, e.y, p.x, p.y)) {
      e.state = 'attack'; e.atkT = EDEF.licker.windup; e.fa = Math.atan2(p.y - e.y, p.x - e.x);
      sfxAt('bite', e.x, e.y, 0.5, 600); cryAt('licker', 'lash', e.x, e.y, 0.9, 700); return;
    }
    // 声源在扑击距离内、路上没有挡 → 猛扑向声源
    if (dh < LICKER.lungeDist && dh > 40 && walkClear(e.x, e.y, hx, hy) && (e.lungeCd || 0) <= S.time) {
      e.state = 'lunge'; e.fa = ah; e.lungeT = Math.min(LICKER.lungeT, dh / LICKER.lungeSpd); e.lungeHit = false; e.lungeCd = S.time + 2.5; return;
    }
    if (dh > 30) {
      let a = ah;
      if (!walkClear(e.x, e.y, hx, hy)) { if (!e.heardField) e.heardField = noiseField(hx, hy, 16); const n = noiseNext(e); if (n) a = Math.atan2(n[1] - e.y, n[0] - e.x); }
      vx = Math.cos(a); vy = Math.sin(a);
    } else { e.fa += dt * 2; }   // 到了声源：左右摆头，听
  } else {
    e.wT -= dt; if (e.wT <= 0) { e.wT = rand(2, 5); e.wa = rand(Math.PI * 2); e.moving = Math.random() < 0.4; }
    if (e.moving) { vx = Math.cos(e.wa) * 0.3; vy = Math.sin(e.wa) * 0.3; }
    e.groanT -= dt; if (e.groanT <= 0) { e.groanT = rand(5, 10); cryAt('licker', 'clicks', e.x, e.y, 0.8, 550); }   // 舌头嗒嗒响 + 喘气：玩家靠它判断位置
  }
  if (vx || vy) {
    const ox = e.x, oy = e.y;
    moveEnt(e, vx * sp * dt, vy * sp * dt);
    e.fa += angDiff(e.fa, Math.atan2(vy, vx)) * Math.min(1, dt * 5);
    if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; }
  }
}

// 半透明、裸露的肌肉和大脑，四肢着地；攻击时一根长舌
function drawLicker(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.dead) { ctx.globalAlpha = 0.8; ctx.rotate(e.fa); ctx.fillStyle = '#4a1414'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, 0, 0, 7); ctx.fill(); ctx.restore(); return; }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(3, 5, 22, 13, e.fa, 0, 7); ctx.fill();   // 地上的投影
  let a = e.fa; if (e.confT > 0) a += Math.sin(S.time * 25) * 0.25;
  ctx.rotate(a);
  ctx.globalAlpha = e.state === 'lunge' || e.state === 'attack' ? 0.95 : 0.72;
  const s = Math.sin(e.ph * (e.state === 'lunge' ? 20 : 6));
  ctx.strokeStyle = '#7a2a24'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const [x0, y0, dx, dy] of [[6, -6, 12 + s * 4, -14], [6, 6, 12 - s * 4, 14], [-8, -6, -10 - s * 4, -14], [-8, 6, -10 + s * 4, 14]]) {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + dx * .6, y0 + dy); ctx.lineTo(x0 + dx, y0 + dy * 1.1); ctx.stroke();
  }
  ctx.fillStyle = '#8a2e28'; ctx.beginPath(); ctx.ellipse(-2, 0, 17, 9, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(40,5,5,0.6)'; ctx.lineWidth = 1; for (let k = -10; k < 10; k += 4) { ctx.beginPath(); ctx.moveTo(k, -8); ctx.lineTo(k + 2, 8); ctx.stroke(); }
  ctx.fillStyle = '#d98a8a'; ctx.beginPath(); ctx.ellipse(12, 0, 8, 7, 0, 0, 7); ctx.fill();   // 裸露的大脑
  ctx.strokeStyle = '#a05050'; ctx.beginPath(); ctx.moveTo(6, 0); ctx.quadraticCurveTo(12, -4, 18, 0); ctx.moveTo(8, 3); ctx.quadraticCurveTo(13, 6, 17, 3); ctx.stroke();
  ctx.fillStyle = '#2a0808'; ctx.fillRect(18, -2, 4, 4);   // 嘴
  ctx.globalAlpha = 1;
  if (e.state === 'attack' || e.tongueT > 0) {
    const len = e.tongueT > 0 ? LICKER.tongue : 10 + (1 - e.atkT / EDEF.licker.windup) * 10;
    ctx.strokeStyle = '#c85a6a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(20, 0);
    ctx.quadraticCurveTo(20 + len / 2, Math.sin(e.ph * 20) * 8, 20 + len, 0); ctx.stroke();
  }
  ctx.restore();
}

<script>/* ai/slime.js */
'use strict';
// 淤泥体（计划 4.2 污水区）：藏在积水里，只露出气泡。
//   · 潜伏（hidden）时子弹打不到、画面上只看得见一串气泡 —— 看气泡判断它在哪
//   · 玩家踩进它附近 → 从水里暴起，把人往水里拖（伤害 + 长时间减速）
//   · 暴起后露在水面上几秒，这时才能打；之后又沉下去换个位置
//   · 只在积水房间（room.water）里活动，永远不会离开水
// 数值：EDEF.slime / SLIME（config/enemies.js）

function inWater(x, y) { const ri = roomAt[Math.floor(y / T) * MW + Math.floor(x / T)]; return ri >= 0 && !!ROOMS[ri].water; }

function updateSlime(e, dt, safe) {
  const p = S.p, d = dist(e.x, e.y, p.x, p.y);
  if (d > SLEEP_DIST) return;
  e.ph += dt;
  if (e.stag > 0) { e.stag -= dt; return; }
  const pw = inWater(p.x, p.y) && !safe;
  if (e.hidden === undefined) e.hidden = true;
  // 气泡
  e.bubT = (e.bubT || 0) - dt;
  if (e.hidden && e.bubT <= 0) { e.bubT = rand(0.25, 0.7); parts.push({ x: e.x + rand(-10, 10), y: e.y + rand(-10, 10), vx: 0, vy: -6, life: 0.7, max: 0.7, s: rand(2, 4), c: 'rgba(150,190,160,0.7)', t: 'bubble' }); }

  if (e.state === 'grab') {           // 暴起前摇：水面鼓起来
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.hidden = false;
      if (pw && d < SLIME.grabReach) {
        hurtPlayer(e.dmg, Math.atan2(p.y - e.y, p.x - e.x), 'slime');
        P.slowT = SLIME.slowT; msg('冰冷的淤泥缠住了你的腿，把你往水里拖！', 2.5);
        sfxAt('drip', e.x, e.y, 0.8, 500); cryAt('slime', 'gloop', e.x, e.y, 1, 550);
      }
      e.state = 'up'; e.upT = SLIME.upT;
    }
    return;
  }
  let vx = 0, vy = 0;
  if (e.state === 'up') {             // 露在水面上：能被打
    e.upT -= dt;
    if (pw && d < SLIME.grabReach && (e.atkCd || 0) <= S.time) { e.state = 'grab'; e.atkT = 0.35; e.atkCd = S.time + 1.6; return; }
    if (pw) { const a = Math.atan2(p.y - e.y, p.x - e.x); vx = Math.cos(a) * 0.6; vy = Math.sin(a) * 0.6; }
    if (e.upT <= 0) { e.state = 'sub'; e.hidden = true; e.subT = rand(1.5, 3); cryAt('slime', 'bubble', e.x, e.y, 0.8, 450); }
  } else {                            // 潜伏：朝水里的玩家慢慢漂过去
    e.state = 'sub'; e.hidden = true;
    e.subT = Math.max(0, (e.subT || 0) - dt);
    if (pw && d < SLIME.senseDist) {
      const a = Math.atan2(p.y - e.y, p.x - e.x); vx = Math.cos(a); vy = Math.sin(a);
      if (d < SLIME.emergeDist && e.subT <= 0) { e.state = 'grab'; e.atkT = SLIME.tell; cryAt('slime', 'gloop', e.x, e.y, 1, 550); return; }
    } else {
      e.wT -= dt; if (e.wT <= 0) { e.wT = rand(2, 4); e.wa = rand(Math.PI * 2); }
      vx = Math.cos(e.wa) * 0.3; vy = Math.sin(e.wa) * 0.3;
    }
  }
  if (vx || vy) {
    const ox = e.x, oy = e.y;
    moveEnt(e, vx * e.spd * dt, vy * e.spd * dt);
    if (!inWater(e.x, e.y) || inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; e.wa = rand(Math.PI * 2); }   // 永远不离开水
    e.fa = Math.atan2(vy, vx);
  }
}

function drawSlime(e) {
  if (e.dead) { ctx.save(); ctx.translate(e.x, e.y); ctx.fillStyle = 'rgba(40,60,40,0.6)'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, 0, 0, 7); ctx.fill(); ctx.restore(); return; }
  if (e.hidden && e.state !== 'grab') return;   // 潜伏：只有气泡（粒子）
  ctx.save(); ctx.translate(e.x, e.y);
  const rise = e.state === 'grab' ? 1 - Math.max(0, e.atkT) / SLIME.tell : 1;
  const wob = Math.sin(e.ph * 8) * 2;
  ctx.globalAlpha = 0.45 + 0.5 * rise;
  ctx.fillStyle = 'rgba(20,40,30,0.6)'; ctx.beginPath(); ctx.ellipse(0, 4, 24 * rise + 6, 12 * rise + 4, 0, 0, 7); ctx.fill();   // 水面上的涟漪
  ctx.fillStyle = '#2f4a32'; ctx.beginPath(); ctx.ellipse(0, -4 * rise, 14 + wob, 16 * rise + 2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a6a3e'; ctx.beginPath(); ctx.ellipse(-3, -8 * rise, 6, 5 * rise + 1, 0, 0, 7); ctx.fill();
  if (e.state === 'up' || rise > 0.6) {
    ctx.strokeStyle = '#3a5a36'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let k = -1; k <= 1; k += 2) { ctx.beginPath(); ctx.moveTo(k * 8, -2); ctx.quadraticCurveTo(k * 22, -10 + wob, k * 26, 6); ctx.stroke(); }
    ctx.fillStyle = '#c8d86a'; ctx.fillRect(-5, -12 * rise, 2, 2); ctx.fillRect(3, -12 * rise, 2, 2);
  }
  ctx.restore();
}

<script>/* ai/vine.js */
'use strict';
// 蔓生体（地图 3 温室）：伪装成种植槽里的一丛植物，不会移动。
//   · 平时（hide）：看起来就是一丛叶子，只是偶尔轻轻抖一下 —— 留心的玩家能认出来
//   · 玩家走近 / 被打 → 暴起（up）：近身用藤鞭抽，远一点就吐酸液（命中会中毒）
//   · 普通伤害正常，榴弹爆炸和火场 ×2；不会被击退（combat.js）
const VINE = { wake: 120, lashWind: 0.5, lashRec: 0.9, spitRange: 6 * 48, spitCd: 3.2, spitSpd: 320, acidDmg: 10, fireMul: 2 };

function updateVine(e, dt, safe) {
  const p = S.p, d = dist(e.x, e.y, p.x, p.y);
  e.ph += dt;
  if (e.state !== 'up') {
    e.state = 'hide';
    if ((d < VINE.wake && !safe) || e.alert) {
      e.state = 'up'; e.alert = true; e.spitT = 1.2; e.atkT = 0;
      cryAt('vine', 'creak', e.x, e.y, 1, 900, 0.2);
      shake = Math.max(shake, 5); msg('种植槽里的藤蔓猛地立了起来！', 3);
    }
    return;
  }
  e.fa = Math.atan2(p.y - e.y, p.x - e.x);
  if (safe) return;
  // 藤鞭：前摇 → 抽
  if (e.atkT > 0) {
    e.atkT -= dt;
    if (e.atkT <= 0) {
      if (d < e.reach + e.r + p.r) hurtPlayer(e.dmg, e.fa, 'vine');
      e.recT = VINE.lashRec; cryAt('vine', 'lash', e.x, e.y, 1, 750);
    }
    return;
  }
  if (e.recT > 0) { e.recT -= dt; return; }
  if (d < e.reach + e.r + p.r - 6) { e.atkT = VINE.lashWind; return; }
  // 酸液
  e.spitT -= dt;
  if (e.spitT <= 0 && d < VINE.spitRange && losClear(e.x, e.y, p.x, p.y)) {
    e.spitT = VINE.spitCd;
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    (S.acid = S.acid || []).push({ x: e.x + Math.cos(a) * 20, y: e.y + Math.sin(a) * 20, vx: Math.cos(a) * VINE.spitSpd, vy: Math.sin(a) * VINE.spitSpd, left: VINE.spitRange / VINE.spitSpd + 0.2 });
    cryAt('vine', 'spit', e.x, e.y, 0.9, 750);
  }
}
function updateAcid(dt) {
  const p = S.p;
  for (const b of S.acid || []) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.left -= dt;
    if (opaqueT(Math.floor(b.x / T), Math.floor(b.y / T)) || b.left <= 0) { b.done = true; decals.push({ x: b.x, y: b.y, r: 7, rot: 0, a: 0.5, dirt: true }); continue; }
    if (dist(b.x, b.y, p.x, p.y) < p.r + 6) {
      b.done = true; hurtPlayer(VINE.acidDmg, Math.atan2(b.vy, b.vx), 'acid'); poisonPlayer();
      for (let i = 0; i < 10; i++) parts.push({ x: b.x, y: b.y, vx: rand(-90, 90), vy: rand(-90, 90), life: 0.4, max: 0.4, s: 2.5, c: '#b8d040' });
    }
  }
  if (S.acid) S.acid = S.acid.filter(b => !b.done);
}
function drawVine(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.dead) {
    ctx.fillStyle = '#2a2a14'; for (let i = 0; i < 6; i++) { const a = i * 1.05; ctx.fillRect(Math.cos(a) * 10 - 3, Math.sin(a) * 10 - 3, 6, 6); }
    ctx.restore(); return;
  }
  const up = e.state === 'up', t = e.ph;
  // 叶丛（伪装时就是这样）
  const twitch = !up && Math.sin(t * 0.7) > 0.97 ? Math.sin(t * 40) * 2 : 0;
  ctx.fillStyle = up ? '#3a5a22' : '#2f5a2a';
  for (let i = 0; i < 7; i++) { const a = i * 0.9 + 0.3; ctx.beginPath(); ctx.arc(Math.cos(a) * 11 + twitch, Math.sin(a) * 11, 9, 0, 7); ctx.fill(); }
  ctx.fillStyle = up ? '#5a7a2a' : '#3f6a34'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
  if (up) {
    // 立起来的藤鞭 + 一张有牙的「花苞」嘴，朝着玩家
    ctx.rotate(e.fa);
    const lash = e.atkT > 0 ? 1 - e.atkT / VINE.lashWind : 0;
    ctx.strokeStyle = '#4a6a24'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(20, s * (18 + 8 * Math.sin(t * 5)), 28 + lash * 40, s * (6 + 10 * Math.sin(t * 7 + s))); ctx.stroke(); }
    ctx.fillStyle = '#7a2a3a'; ctx.beginPath(); ctx.arc(8, 0, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8e0c0'; for (let i = -2; i <= 2; i++) ctx.fillRect(12, i * 3 - 1, 4, 2);
  }
  ctx.restore();
}
function drawAcid() { ctx.fillStyle = '#c0e040'; for (const b of S.acid || []) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill(); } }

<script>/* ai/hunter.js */
'use strict';
// 猎手（计划 4.3、5.2）：地图 3 生产车间的精英敌人。数值在 config/enemies.js 的 EDEF.hunter / HUNTER。
//   · 平时走得比你跑得慢（155，玩家奔跑 215），拉开距离靠飞扑补上；会开门（A 层寻路）；看见你之后记 12 秒
//   · 包抄：看得见你时不直线冲，而是绕向你身体一侧的一个点；被枪口指着时会横向闪身
//   · 近身：爪击。2.5–6 格、路上没挡：伏低 0.55 秒后飞扑（360），命中带毒；扑空趴 0.85 秒
//   · 处决：你的生命 ≤ 40 时，飞扑变成处决 —— 前摇 1 秒，全身发红光并尖啸；
//     前摇期间只要打中它就会中断（踉跄），之后 20 秒内不再尝试。
//     处决扑中 = 重伤：打到只剩 1 血、中毒（毒不致死），之后 20 秒内也不再处决 —— 赶紧治疗。
//     只剩 1 血时再被扑中（普通飞扑）才会死。（原来是即死，试玩反馈太难，改用计划第 11 节第 4 条的「其他选择」）

function hunterDoor(e) {
  // 和处刑者一样：走到关着的门前直接推开（安全屋的门除外），但声音小一些
  const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T);
  for (let yy = ty - 1; yy <= ty + 1; yy++) for (let xx = tx - 1; xx <= tx + 1; xx++) {
    if (xx < 0 || yy < 0 || xx >= MW || yy >= MH || grid[yy * MW + xx] !== 2 || isDoorOpen(xx, yy) || doorSafe[yy * MW + xx]) continue;
    if (dist(e.x, e.y, (xx + .5) * T, (yy + .5) * T) < T * 0.95) {
      setDoorOpen(xx, yy, true); drawTileAt(xx, yy); sfxAt('door', (xx + .5) * T, (yy + .5) * T, 1.2, 1100, 0.2);
      emitNoise((xx + .5) * T, (yy + .5) * T, NOISE.doorOpen, 'hunter-door', e); flowT = 0; return true;
    }
  }
  return false;
}

// 开始飞扑 / 处决的前摇
function hunterStartLeap(e, p, exec) {
  e.fa = Math.atan2(p.y - e.y, p.x - e.x);
  if (exec) {
    e.state = 'execWind'; e.atkT = HUNTER.execTell;
    cryAt('hunter', 'shriek', e.x, e.y, 1.1, 1400, 0.4);   // 尖啸
    floats.push({ x: e.x, y: e.y - 30, t: '！！', life: 1, c: '#ff3030' });
  } else {
    e.state = 'crouch'; e.atkT = HUNTER.leapTell; cryAt('hunter', 'hiss', e.x, e.y, 0.8, 700, 0.15);   // 越来越响的嘶气，0.4 秒后扑过来
  }
}
function hunterLeap(e, p, exec) {
  const d = dist(e.x, e.y, p.x, p.y);
  e.fa = Math.atan2(p.y - e.y, p.x - e.x);   // 起跳那一刻锁定方向：之后横移就能躲开
  e.state = 'leap'; e.execLeap = !!exec; e.lungeHit = false;
  e.lungeT = Math.min(d + 40, HUNTER.leapMax + 40) / HUNTER.leapSpd;
  e.leapCd = S.time + rand(HUNTER.leapCd[0], HUNTER.leapCd[1]);
  sfxAt('bash', e.x, e.y, 0.5, 700, 0.1);
}
function hunterHitPlayer(e, p) {
  if (e.execLeap && p.hp <= HUNTER.execBelow) {
    // 处决：P.inv（刚挨过打的无敌时间）照样有效；扑中 = 重伤（打到只剩 1 血），本来就只剩 1 血才会死
    if (P.inv > 0 || mode !== 'play') return;
    e.execCd = S.time + HUNTER.execCd;   // 给你时间治疗：20 秒内不再处决
    if (p.hp <= HUNTER.execLeave) { hurtPlayer(p.hp + 999, e.fa, 'hunter'); msg('猎手的爪子从你的喉咙上划了过去。', 4); return; }
    hurtPlayer(p.hp - HUNTER.execLeave, e.fa, 'hunter');
    if (HUNTER.leapPoison && p.hp > 0) poisonPlayer();
    msg('猎手的爪子撕开了你的肩膀 —— 只剩一口气了，快治疗！', 4.5);
    return;
  }
  const hp0 = p.hp;
  hurtPlayer(HUNTER.leapDmg, e.fa, 'hunter');
  if (HUNTER.leapPoison && p.hp < hp0 && p.hp > 0) poisonPlayer();
}

function updateHunter(e, dt, safe) {
  const p = S.p, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
  if (d > SLEEP_DIST) return;
  if (!e.side) e.side = e.id % 2 ? 1 : -1;   // 包抄从哪一侧绕（被枪指着闪身后会换边）
  e.ph += dt; e.knifeStunT = Math.max(0, (e.knifeStunT || 0) - dt);
  const ang = Math.atan2(dy, dx);
  const los = d < e.sight && losClear(e.x, e.y, p.x, p.y);
  if (!safe && (los || d < 70)) {
    if (!e.alert) cryAt('hunter', 'shriek', e.x, e.y, 0.6, 900, 0.15);
    e.alert = true; e.lostT = 0; e.heard = null; e.heardField = null; e.lastSeen = { x: p.x, y: p.y };
  }
  if (e.alert && !los) {
    e.lostT = (e.lostT || 0) + dt;
    if (safe || e.lostT > EDEF.hunter.memory) {
      e.alert = false; e.lostT = 0;
      const ls = e.lastSeen || { x: p.x, y: p.y };
      e.heard = { x: ls.x, y: ls.y, t: 8, label: 'lastSeen' }; e.heardField = noiseField(ls.x, ls.y, 14);
    }
  }
  e.groanT -= dt; if (e.groanT <= 0) { e.groanT = rand(4, 8); cryAt('hunter', 'chitter', e.x, e.y, 0.7, 600); }   // 喉咙里咯咯响：靠它判断位置
  if (e.stag > 0) { e.stag -= dt; return; }
  if (safe && e.state !== 'leap' && e.state !== 'rec') { if (e.state !== 'idle') e.state = 'chase'; e.atkT = 0; }

  // ---- 前摇 / 动作中
  if (e.state === 'slash') {
    e.atkT -= dt; e.fa += angDiff(e.fa, ang) * Math.min(1, dt * 6);
    if (e.atkT <= 0) {
      if (!safe && d < e.r + p.r + EDEF.hunter.reach + 6) hurtPlayer(e.dmg, ang, 'hunter');
      e.state = 'rec'; e.recT = EDEF.hunter.rec;
    }
    return;
  }
  if (e.state === 'crouch' || e.state === 'execWind') {
    e.atkT -= dt; e.fa += angDiff(e.fa, ang) * Math.min(1, dt * 8);
    if (e.atkT <= 0) {
      if (safe || !los) { e.state = 'chase'; return; }
      hunterLeap(e, p, e.state === 'execWind');
    }
    return;
  }
  if (e.state === 'leap') {
    e.lungeT -= dt;
    const ox = e.x, oy = e.y;
    moveEnt(e, Math.cos(e.fa) * HUNTER.leapSpd * dt, Math.sin(e.fa) * HUNTER.leapSpd * dt);
    if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; e.lungeT = 0; }
    if (!safe && !e.lungeHit && dist(e.x, e.y, p.x, p.y) < e.r + p.r + 10) { e.lungeHit = true; hunterHitPlayer(e, p); }
    if (e.lungeT <= 0 || (Math.abs(e.x - ox) + Math.abs(e.y - oy) < 0.5)) { e.state = 'rec'; e.recT = e.lungeHit ? 0.9 : HUNTER.leapMissRec; e.execLeap = false; }
    return;
  }
  if (e.state === 'dodge') {
    e.dodgeT -= dt;
    const ox = e.x, oy = e.y, a = ang + e.side * Math.PI / 2;
    moveEnt(e, Math.cos(a) * HUNTER.dodgeSpd * dt, Math.sin(a) * HUNTER.dodgeSpd * dt);
    if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; }
    if (e.dodgeT <= 0) e.state = 'chase';
    return;
  }
  if (e.state === 'rec') { e.recT -= dt; if (e.recT <= 0) e.state = 'chase'; return; }

  // ---- 决策
  let vx = 0, vy = 0, sp = e.spd;
  if (e.alert) {
    if (e.state === 'idle') e.state = 'chase';
    const direct = walkClear(e.x, e.y, p.x, p.y);
    if (!safe && los && direct) {
      // 近身：爪击
      if (d < e.r + p.r + EDEF.hunter.reach * 0.8) { e.state = 'slash'; e.atkT = EDEF.hunter.windup; cryAt('hunter', 'snarl', e.x, e.y, 0.8, 650); return; }
      // 飞扑 / 处决
      const execOk = p.hp <= HUNTER.execBelow && S.time >= (e.execCd || 0);
      if (d > HUNTER.leapMin && d < HUNTER.leapMax && S.time >= (e.leapCd || 0)) { hunterStartLeap(e, p, execOk); return; }
      // 被枪口指着（瞄准中、准星几乎对着它）→ 横向闪身
      const aimed = P.focus > 0.15 && Math.abs(angDiff(p.a, ang + Math.PI)) < 0.22;
      if (aimed && d > 90 && S.time >= (e.dodgeCd || 0)) {
        e.dodgeCd = S.time + HUNTER.dodgeCd; e.side = -e.side; e.state = 'dodge'; e.dodgeT = HUNTER.dodgeT; return;
      }
    }
    let tx, ty;
    if (los && direct) {
      // 包抄：远的时候奔向玩家身侧的一个点，近了才正面扑上来
      tx = p.x; ty = p.y;
      if (d > HUNTER.flankDist) {
        const fx = p.x + Math.cos(ang + e.side * Math.PI / 2) * HUNTER.flankDist, fy = p.y + Math.sin(ang + e.side * Math.PI / 2) * HUNTER.flankDist;
        if (walkClear(e.x, e.y, fx, fy) && !solidT(Math.floor(fx / T), Math.floor(fy / T))) { tx = fx; ty = fy; }
      }
    } else {
      const n = flowNext(e);
      if (n) { tx = n[0]; ty = n[1]; }
      hunterDoor(e);
    }
    if (tx !== undefined) { const a = Math.atan2(ty - e.y, tx - e.x); vx = Math.cos(a); vy = Math.sin(a); }
  } else if (e.heard) {
    e.heard.t -= dt;
    const n = dist(e.x, e.y, e.heard.x, e.heard.y) > T * 0.8 ? noiseNext(e) : null;
    if (n) { const a = Math.atan2(n[1] - e.y, n[0] - e.x); vx = Math.cos(a) * 0.6; vy = Math.sin(a) * 0.6; }
    else { e.heard.t = Math.min(e.heard.t, 2.5); e.fa += dt * 2; }
    if (e.heard.t <= 0) { e.heard = null; e.heardField = null; }
  } else {
    e.state = 'idle';
    e.wT -= dt; if (e.wT <= 0) { e.wT = rand(2, 5); e.wa = rand(Math.PI * 2); e.moving = Math.random() < 0.5; }
    if (e.moving) { vx = Math.cos(e.wa) * 0.3; vy = Math.sin(e.wa) * 0.3; }
  }
  if (vx || vy) {
    const ox = e.x, oy = e.y;
    moveEnt(e, vx * sp * dt, vy * sp * dt);
    e.fa += angDiff(e.fa, Math.atan2(vy, vx)) * Math.min(1, dt * 7);
    if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; e.state = 'chase'; }
  }
}

// 受伤（combat.js 的 damageEnemy 调用）：处决前摇中被打中 → 中断
function hunterHurt(e) {
  if (e.state === 'execWind') {
    e.state = 'rec'; e.recT = 0.4; e.stag = Math.max(e.stag, 0.8); e.execCd = S.time + HUNTER.execCd;
    floats.push({ x: e.x, y: e.y - 30, t: '打断！', life: 1.2, c: '#ffcc55' });
    cryAt('hunter', 'pain', e.x, e.y, 1, 700, 0.2); e.hurtVoT = S.time + 0.7;
  } else if (e.state === 'crouch') { e.state = 'chase'; }
}

// 外形：瘦长的爬行类，墨绿色鳞皮，前肢是一对长爪。处决前摇时全身发红光
function drawHunter(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.dead) {
    ctx.rotate(e.fa); ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#23301f'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a1010'; ctx.beginPath(); ctx.ellipse(-4, 2, 10, 5, 0, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  const exec = e.state === 'execWind', crouch = e.state === 'crouch' || exec, leap = e.state === 'leap';
  if (exec) {   // 红光：越接近扑出越亮
    const k = 1 - Math.max(0, e.atkT) / HUNTER.execTell;
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 46 + k * 16);
    g.addColorStop(0, `rgba(255,40,30,${0.35 + k * 0.4})`); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 62 + k * 16, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(3, 5, leap ? 14 : 19, 11, e.fa, 0, 7); ctx.fill();
  let a = e.fa; if (e.stag > 0) a += Math.sin(e.ph * 40) * 0.2;
  ctx.rotate(a);
  const sc = crouch ? 0.88 : leap ? 1.12 : 1; ctx.scale(sc, crouch ? 1.12 : 1);
  const s = Math.sin(e.ph * (e.alert ? 16 : 7));
  // 后腿、尾巴
  ctx.strokeStyle = '#2c3a26'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-14 - s * 3, -14); ctx.moveTo(-8, 6); ctx.lineTo(-14 + s * 3, 14); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.quadraticCurveTo(-22, s * 6, -30, s * 3); ctx.stroke();
  // 身体
  ctx.fillStyle = exec ? '#6a2a20' : '#34482e'; ctx.beginPath(); ctx.ellipse(-1, 0, 15, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = exec ? '#8a3a2a' : '#46603a'; for (let k = -10; k <= 6; k += 5) { ctx.beginPath(); ctx.arc(k, 0, 2.2, 0, 7); ctx.fill(); }   // 背脊的鳞
  // 前臂 + 长爪（攻击、飞扑时前伸）
  const reach = e.state === 'slash' || leap ? 10 : crouch ? -2 : 3;
  ctx.strokeStyle = '#3c5232'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(6, -7); ctx.lineTo(14 + reach + s * 2, -13); ctx.moveTo(6, 7); ctx.lineTo(14 + reach - s * 2, 13); ctx.stroke();
  ctx.strokeStyle = '#d8d0b8'; ctx.lineWidth = 1.5;
  for (const sy of [-1, 1]) for (let c = -1; c <= 1; c++) {
    const bx = 14 + reach + (sy < 0 ? s : -s) * 2, by = 13 * sy;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 9, by + c * 3 + sy * 2); ctx.stroke();
  }
  // 头
  ctx.fillStyle = exec ? '#7a3024' : '#3e5634'; ctx.beginPath(); ctx.ellipse(15, 0, 7, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = exec || e.alert ? '#ff3a2a' : '#c8b040';
  ctx.beginPath(); ctx.arc(18, -3, 1.6, 0, 7); ctx.arc(18, 3, 1.6, 0, 7); ctx.fill();
  ctx.restore();
}
</script>
<script>/* ai/berserk.js */
'use strict';
// 焚化炉桥段 + Boss 战一：暴走处刑者（计划 3.5、3.6、4.4）
//
// 桥段：焚化炉车间中间是一道熔渣坑，只有一座窄吊桥能过；吊桥正上方悬着钢水包。
//   把处刑者引上吊桥，拉下控制台的钢水闸（useLadle）→ 1 秒后钢水浇下来：
//     · 它在桥上 → 被钢水浇透，却变异成「暴走形态」（EDEF.executionerBerserk）→ Boss 战开始，
//       追踪者系统就此结束（不再跟随、不再有导演系统）；车间的门被警报联锁锁死，打赢才开
//     · 没在桥上 → 白浇，钢水包要重新加热 12 秒
//     · 你自己站在桥上 → 重伤
//
// Boss：3000 血，有上限、能杀死。和追踪形态完全独立的一套数值（config/enemies.js）。
//   阶段一（3000–1500）：速度 200，连续两下挥砍；中距离跳劈，落点有 0.8 秒红圈预警
//   阶段二（< 1500）：  撕掉拘束服，隔一段就冲撞；撞墙晕 2.5 秒。撞到钢水管道 → 管道破裂，一次 600
//   弱点：背后裸露的心脏，从背后打伤害 ×2
//   不会被普通攻击打出硬直；闪光弹只能晃它 1.5 秒

const BERSERK = {
  slash: { windup: 0.5, rec: 1.0, combo: 2, gap: 0.28, step: 280, arc: 1.1 },   // arc：只砍得到正前方 ±63° 以内的人
  leap: { min: 3.5 * 48, max: 8 * 48, cd: [5, 7], dmg: 55, r: 80, air: 0.45, land: 1.4 },
  charge: { min: 3 * 48, cd: [3.5, 5], tell: 0.7, spd: 440, time: 1.8, dmg: 50 },
  pipeR: 1.9 * 48,         // 撞墙时离钢水管道这么近 → 管道破裂
  backArc: 1.3,            // 子弹方向和它的朝向夹角小于这个（约 75°，背后 150° 的扇形）= 打在背后
  // 转身速度上限（弧度/秒）。它体型大、转身慢：绕到背后是这场 Boss 战的核心技巧（玩家跑 215，它走 200，光靠跑绕不过去）
  //   · 挥砍蓄力时几乎转不动 → 从侧面闪过去，这一刀就砍空
  //   · 硬直（rec：挥砍收招、跳劈落地、冲撞结束）完全不转身 → 这是绕背输出的窗口
  turn: { chase: 3.2, slash: 1.6 },
  flashStun: 1.5,
};
// 按上限转向目标角度
function turnToward(e, a, rate, dt) { const d = angDiff(e.fa, a); e.fa += Math.sign(d) * Math.min(Math.abs(d), rate * dt); }
const FURNACE = { land: 1.0, pourT: 2.6, recharge: 12, selfDmg: 60, enemyDmg: 400 };

function berserkBoss() { return S.enemies.find(e => e.t === 'executionerBerserk' && !e.dead) || null; }
function onBridge(x, y) {
  const F = LEVEL && LEVEL.furnace; if (!F) return false;
  const [bx, by, bw, bh] = F.bridge, tx = x / T, ty = y / T;
  return tx >= bx && tx < bx + bw && ty >= by && ty < by + bh;
}

// ---------------------------------------------------------------- 钢水闸
function useLadle(it) {
  if (S.flags.execMutated) { msg('钢水包已经倒空了，吊臂歪在一边。', 2.5); return; }
  if (S.pour) return;
  const wait = (S.pourReady || 0) - S.time;
  if (wait > 0) { sfx('locked', 0.4); msg(`钢水包正在重新加热……还要 ${Math.ceil(wait)} 秒。`, 2); return; }
  S.pour = { t: 0, landed: false };
  sfx('metal', 1.2); sfxAt('sizzle', it.x, it.y, 1, 1600, 0.3); shake = Math.max(shake, 6);
  emitNoise(it.x, it.y, 10, 'ladle');
  msg('闸门「哐」地落下 —— 吊桥上方的钢水包开始倾斜！', 2.5);
}
function updatePour(dt) {
  const s = S.pour; if (!s) return;
  s.t += dt;
  const F = LEVEL.furnace;
  if (!F) { S.pour = null; return; }
  const [bx, by, bw, bh] = F.bridge;
  if (s.t < FURNACE.pourT && Math.random() < dt * 60) {
    const x = (bx + Math.random() * bw) * T, y = (by + Math.random() * bh) * T;
    parts.push({ x, y, vx: rand(-40, 40), vy: rand(-80, -20), life: rand(0.3, 0.7), max: 0.7, s: rand(2, 5), c: Math.random() < .5 ? '#ffd060' : '#ff6a10' });
  }
  if (!s.landed && s.t >= FURNACE.land) {
    s.landed = true; shake = Math.max(shake, 16);
    sfxAt('explode', (bx + bw / 2) * T, (by + bh / 2) * T, 1, 2400, 0.4); sfxAt('sizzle', (bx + bw / 2) * T, (by + bh / 2) * T, 1.5, 2400, 0.4);
    const ex = activeExecutioner();
    let hit = false;
    for (const e of S.enemies) {
      if (e.dead || !onBridge(e.x, e.y)) continue;
      if (e === ex) { hit = true; continue; }
      if (e.t !== 'executionerBerserk') damageEnemy(e, FURNACE.enemyDmg, Math.PI / 2, 0, false, 0, 'fire');
    }
    if (onBridge(S.p.x, S.p.y)) { hurtPlayer(FURNACE.selfDmg, Math.PI / 2, 'fire'); msg('钢水溅了你一身！', 2.5); }
    if (hit) mutateExecutioner(ex);
    else { S.pourReady = S.time + FURNACE.recharge; msg('钢水轰地浇在空荡荡的吊桥上……它不在桥上。钢水包开始重新加热。', 4); }
  }
  if (s.t >= FURNACE.pourT) S.pour = null;
}
// 处刑者被钢水浇透 → 暴走形态。追踪者系统到此结束（计划 3.6）
function mutateExecutioner(ex) {
  const x = ex.x, y = ex.y;
  S.enemies = S.enemies.filter(e => e !== ex);
  const D = S.executioner;
  if (D) { D.active = false; D.follow = null; D.done = true; D.tension = 0; }
  const b = mkEnemy('executionerBerserk', 0, 0);
  b.x = x; b.y = y; b.fa = ex.fa; b.introT = 2.8; b.alert = true; b.state = 'chase';
  b.leapCd = S.time + 4; b.chargeCd = S.time + 3;
  S.enemies.push(b);
  shake = 28; cryAt('berserk', 'roar', x, y, 1.2, 4000, 0.6);
  for (let i = 0; i < 60; i++) { const a = rand(6.283), v = rand(60, 300); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 1), max: 1, s: rand(2, 6), c: Math.random() < .5 ? '#ffb040' : '#5a1010' }); }
  msg('钢水把它浇了个透 —— 可它没有倒下。外壳一块块崩裂，左手长出了利爪……', 5);
  setFlag('execMutated');
}

// ---------------------------------------------------------------- 钢水管道
function pipeBroken(i) { return !!(S.pipes && S.pipes[i]); }
function checkPipes(e) {
  const F = LEVEL.furnace; if (!F || !F.pipes) return false;
  let hit = false;
  F.pipes.forEach(([px, py], i) => {
    if (pipeBroken(i) || dist(e.x, e.y, (px + .5) * T, (py + .5) * T) > BERSERK.pipeR) return;
    (S.pipes = S.pipes || {})[i] = true; hit = true;
    const x = (px + .5) * T, y = (py + .5) * T;
    sfxAt('explode', x, y, 1.2, 2400, 0.4); sfxAt('sizzle', x, y, 1.5, 2000, 0.3); shake = Math.max(shake, 18);
    (S.fires = S.fires || []).push({ x, y, r: 70, t: 5, max: 5 });
    damageEnemy(e, EDEF.executionerBerserk.envDamage, Math.atan2(e.y - y, e.x - x), 0, false, 0, 'env');
    floats.push({ x: e.x, y: e.y - 40, t: '管道破裂！', life: 1.5, c: '#ffa040' });
    msg('钢水管道被撞裂了，滚烫的钢水浇了它一身！', 3);
  });
  return hit;
}

// ---------------------------------------------------------------- AI
function updateBerserk(e, dt, safe) {
  const B = BERSERK, D = EDEF.executionerBerserk, p = S.p;
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
  e.ph += dt;
  if (e.introT > 0) { e.introT -= dt; e.fa += angDiff(e.fa, ang) * Math.min(1, dt * 2); return; }
  if (e.stunT > 0) { e.stunT -= dt; return; }
  if (e.stag > 0) { e.stag -= dt; return; }
  if (e.hp <= D.phase2At && !e.phase2) {
    e.phase2 = true; e.state = 'rec'; e.recT = 1.4; e.chargeCd = S.time + 1.5;
    cryAt('berserk', 'roar', e.x, e.y, 1.2, 4000, 0.5); shake = Math.max(shake, 20);
    msg('它撕掉了身上的拘束服 —— 开始发疯似的横冲直撞！（引它撞上墙边的钢水管道）', 5);
    return;
  }
  const reach = e.r + p.r + D.reach;
  switch (e.state) {
    case 'slash': {
      e.atkT -= dt; turnToward(e, ang, B.turn.slash, dt);
      if (e.combo > 0 && d > reach * 0.7) {   // 第二下：踏步追上被第一下打退的玩家
        const ox = e.x, oy = e.y; moveEnt(e, Math.cos(ang) * B.slash.step * dt, Math.sin(ang) * B.slash.step * dt);
        if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; }
      }
      if (e.atkT > 0) return;
      if (!safe && d < reach + 8 && Math.abs(angDiff(e.fa, ang)) < B.slash.arc) hurtPlayer(D.dmg, ang, 'boss');   // 已经绕到侧面 / 背后 → 砍空
      sfxAt('bash', e.x, e.y, 0.6, 900);
      e.combo = (e.combo || 0) + 1;
      if (e.combo < B.slash.combo && d < reach * 1.6) { e.atkT = B.slash.gap; return; }
      e.state = 'rec'; e.recT = B.slash.rec; e.combo = 0; return;
    }
    case 'leapTell': {
      e.atkT -= dt; e.fa = Math.atan2(e.leapY - e.y, e.leapX - e.x);
      if (e.atkT <= 0) { e.state = 'leapAir'; e.airT = 0; e.leapFrom = { x: e.x, y: e.y }; cryAt('berserk', 'grunt', e.x, e.y, 1, 1600, 0.3); }
      return;
    }
    case 'leapAir': {
      e.airT += dt; const k = Math.min(1, e.airT / B.leap.air);
      e.x = e.leapFrom.x + (e.leapX - e.leapFrom.x) * k; e.y = e.leapFrom.y + (e.leapY - e.leapFrom.y) * k;
      if (k >= 1) {
        e.state = 'rec'; e.recT = B.leap.land; shake = Math.max(shake, 16); sfxAt('bash', e.x, e.y, 1.5, 2000, 0.4);
        decals.push({ x: e.x, y: e.y, r: 40, rot: rand(6), a: 0.6, dirt: true });
        if (!safe && dist(e.x, e.y, p.x, p.y) < B.leap.r + p.r) hurtPlayer(B.leap.dmg, Math.atan2(p.y - e.y, p.x - e.x), 'boss');
        // 落在墙里 / 家具上：往回找最近能站的地方
        if (solidT(Math.floor(e.x / T), Math.floor(e.y / T))) { e.x = e.leapFrom.x; e.y = e.leapFrom.y; }
      }

    }
    case 'chargeTell': {

      if (e.atkT <= 0) { e.state = 'charge'; e.chargeT = B.charge.time; e.chargeA = e.fa; e.chargeHit = false; cryAt('berserk', 'roar', e.x, e.y, 1, 2000, 0.3); }
      return;
    }
    case 'charge': {
      e.chargeT -= dt;
      const ox = e.x, oy = e.y;
      moveEnt(e, Math.cos(e.chargeA) * B.charge.spd * dt, Math.sin(e.chargeA) * B.charge.spd * dt);
      if (inSafeTile(e.x, e.y)) { e.x = ox; e.y = oy; }
      if (!safe && !e.chargeHit && dist(e.x, e.y, p.x, p.y) < e.r + p.r + 6) { e.chargeHit = true; hurtPlayer(B.charge.dmg, e.chargeA, 'boss'); }
      const along = (e.x - ox) * Math.cos(e.chargeA) + (e.y - oy) * Math.sin(e.chargeA);   // 沿冲撞方向前进了多少（擦着墙滑也算撞上）
      if (along < B.charge.spd * dt * 0.5) {   // 撞墙：晕 2.5 秒；旁边有钢水管道就撞裂它
        e.state = 'chase'; e.stunT = D.stunAfterCharge; shake = Math.max(shake, 14); sfxAt('bash', e.x, e.y, 1.6, 2000, 0.4);
        floats.push({ x: e.x, y: e.y - 34, t: '晕眩', life: 1.2, c: '#ffcc55' });

  }

  if (direct && d < reach * 0.85 && Math.abs(angDiff(e.fa, ang)) < 1.6) { e.state = 'slash'; e.atkT = B.slash.windup; e.combo = 0; cryAt('berserk', 'grunt', e.x, e.y, 0.7, 900, 0.1); return; }
  if (e.phase2 && direct && d > B.charge.min && S.time >= (e.chargeCd || 0)) {
    e.state = 'chargeTell'; e.atkT = B.charge.tell; e.chargeCd = S.time + rand(B.charge.cd[0], B.charge.cd[1]); return;
  }
  if (!e.phase2 && los && d > B.leap.min && d < B.leap.max && S.time >= (e.leapCd || 0) && !solidT(Math.floor(p.x / T), Math.floor(p.y / T))) {
    e.state = 'leapTell'; e.atkT = D.leapTell; e.leapX = p.x; e.leapY = p.y; e.leapCd = S.time + rand(B.leap.cd[0], B.leap.cd[1]); return;
  }
  const n = direct ? [p.x, p.y] : flowNext(e);
  if (n) {
    const a = Math.atan2(n[1] - e.y, n[0] - e.x), ox = e.x, oy = e.y;
    turnToward(e, a, B.turn.chase, dt);   // 转身慢：朝着当前面朝的方向走，目标在身后时要先转过来（转身时走得慢）
    const k = Math.max(0.25, Math.cos(angDiff(e.fa, a)));
    moveEnt(e, Math.cos(e.fa) * e.spd * k * dt, Math.sin(e.fa) * e.spd * k * dt);

  }
}

// 受伤修正（combat.js 的 damageEnemy 调用）：返回修正后的伤害
function berserkDamage(e, dmg, a, src) {
  if (src === 'env') return dmg;
  if (Math.abs(angDiff(a, e.fa)) < BERSERK.backArc) {
    if (Math.random() < 0.5) floats.push({ x: e.x, y: e.y - 30, t: '心脏！', life: 0.8, c: '#ff5050' });
    return dmg * EDEF.executionerBerserk.weakSpot.mul;
  }
  return dmg;
}

// ---------------------------------------------------------------- 绘制
function drawBerserk(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.dead) {
    ctx.rotate(e.fa); ctx.globalAlpha = 0.9; ctx.fillStyle = '#2a0e0a'; ctx.beginPath(); ctx.ellipse(0, 0, 34, 20, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#6a1a10'; ctx.beginPath(); ctx.arc(-10, 0, 7, 0, 7); ctx.fill(); ctx.restore(); return;
  }
  const air = e.state === 'leapAir', k = air ? Math.sin(Math.min(1, e.airT / BERSERK.leap.air) * Math.PI) : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(3, 6, 24 - k * 6, 18 - k * 5, 0, 0, 7); ctx.fill();
  if (air) { ctx.translate(0, -k * 26); ctx.scale(1 + k * 0.2, 1 + k * 0.2); }
  let a = e.fa; if (e.stunT > 0) a += Math.sin(e.ph * 30) * 0.15;
  if (e.introT > 0) { ctx.translate(Math.sin(e.ph * 40) * 3, 0); }
  ctx.rotate(a);
  const p2 = e.phase2, s = Math.sin(e.ph * (e.state === 'charge' ? 18 : 6)) * 7;
  const skin = p2 ? '#6a2a22' : '#2a1a18', skin2 = p2 ? '#8a3a2a' : '#3a2420';
  ctx.fillStyle = '#140c0a'; ctx.fillRect(-8 + s, -19, 16, 11); ctx.fillRect(-8 - s, 8, 16, 11);   // 腿
  ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(0, 0, 21, 30, 0, 0, 7); ctx.fill();
  if (!p2) { ctx.strokeStyle = '#4a3a34'; ctx.lineWidth = 2; for (let k2 = -16; k2 <= 16; k2 += 8) { ctx.beginPath(); ctx.moveTo(-10, k2); ctx.lineTo(12, k2 + 3); ctx.stroke(); } }   // 拘束服的带子
  else { ctx.strokeStyle = '#a04a3a'; ctx.lineWidth = 1.5; for (let k2 = -18; k2 <= 18; k2 += 6) { ctx.beginPath(); ctx.moveTo(-14, k2); ctx.quadraticCurveTo(0, k2 + 4, 14, k2); ctx.stroke(); } }   // 裸露的肌肉
  // 背后的心脏（弱点）：一跳一跳地发红光
  const beat = 0.6 + 0.4 * Math.max(0, Math.sin(e.ph * 7));
  ctx.fillStyle = `rgba(255,50,30,${0.35 * beat})`; ctx.beginPath(); ctx.arc(-16, 0, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#c02020'; ctx.beginPath(); ctx.arc(-15, 0, 6 + beat * 2, 0, 7); ctx.fill();
  // 右臂：普通的拳；左臂：利爪（挥砍时前伸）
  const sl = e.state === 'slash', pr = sl ? 28 + (e.combo % 2 ? 10 : 0) - Math.max(0, e.atkT) * 20 : e.state === 'chargeTell' ? 6 : 16;
  ctx.fillStyle = skin2; ctx.fillRect(4, 16, 18, 10); ctx.beginPath(); ctx.arc(24, 21, 8, 0, 7); ctx.fill();
  ctx.fillRect(4, -27, pr, 10);
  ctx.strokeStyle = '#d8d0c0'; ctx.lineWidth = 2.5;
  for (let c = -1; c <= 1; c++) { ctx.beginPath(); ctx.moveTo(pr + 4, -22 + c * 4); ctx.lineTo(pr + 26, -24 + c * 7); ctx.stroke(); }
  // 头
  ctx.fillStyle = skin2; ctx.beginPath(); ctx.arc(6, 0, 12, 0, 7); ctx.fill();
  const eye = e.state === 'chargeTell' || e.state === 'leapTell' ? '#ff2a1a' : '#ffb0a0';
  ctx.fillStyle = eye; ctx.fillRect(13, -6, 3, 3); ctx.fillRect(13, 3, 3, 3);
  ctx.restore();
}
// 盖在黑暗之上的预警：跳劈落点的红圈、冲撞前的红光（必须看得见，才躲得开）
function drawBerserkTells() {
  const e = berserkBoss(); if (!e) return;
  if (e.state === 'leapTell' || e.state === 'leapAir') {
    const k = e.state === 'leapTell' ? 1 - e.atkT / EDEF.executionerBerserk.leapTell : 1;
    ctx.strokeStyle = `rgba(255,40,30,${0.5 + 0.4 * k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.leapX, e.leapY, BERSERK.leap.r, 0, 7); ctx.stroke();
    ctx.fillStyle = `rgba(255,30,20,${0.12 + 0.25 * k})`; ctx.beginPath(); ctx.arc(e.leapX, e.leapY, BERSERK.leap.r * k, 0, 7); ctx.fill();
  }
  if (e.state === 'chargeTell') {
    const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, 60);
    g.addColorStop(0, 'rgba(255,60,30,0.55)'); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, 60, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,60,30,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.fa) * 400, e.y + Math.sin(e.fa) * 400); ctx.stroke(); ctx.setLineDash([]);
  }
  if (e.introT > 0) {
    const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, 80);
    g.addColorStop(0, 'rgba(255,150,40,0.6)'); g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, 80, 0, 7); ctx.fill();
  }
}
// 地面层：吊桥、钢水包、倒下来的钢水、墙上的钢水管道
function drawFurnace() {
