  const cx = x0 + w / 2, cy = y0 + h / 2, empty = S.flags.execMutated, tilt = S.pour ? Math.min(1, S.pour.t / FURNACE.land) : empty ? 1 : 0;
  ctx.save(); ctx.translate(cx, cy);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-w, -4); ctx.lineTo(w, -4); ctx.stroke();   // 吊轨
  ctx.rotate(tilt * 0.7);
  ctx.fillStyle = '#3a3230'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill();
  ctx.fillStyle = empty ? '#2a2220' : `rgba(255,${120 + Math.floor(40 * Math.sin(S.time * 3))},30,0.9)`; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
  ctx.restore();
  // 倒下来的钢水
  if (S.pour) {
    const k = Math.min(1, S.pour.t / FURNACE.land), fade = S.pour.t > FURNACE.pourT - 0.6 ? (FURNACE.pourT - S.pour.t) / 0.6 : 1;
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.max(w, h) * 0.7);
    g.addColorStop(0, `rgba(255,220,120,${0.9 * k * fade})`); g.addColorStop(0.6, `rgba(255,110,20,${0.7 * k * fade})`); g.addColorStop(1, 'rgba(200,40,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x0 - 10, y0 - 10, w + 20, h + 20);
  }
  // 墙上的钢水管道（完好的发着暗红的光，破了的只剩断口）
  (F.pipes || []).forEach(([px, py], i) => {
    const x = (px + .5) * T, y = (py + .5) * T, broken = pipeBroken(i);
    ctx.fillStyle = broken ? '#2a2422' : '#5a4a44'; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill();
    ctx.strokeStyle = broken ? '#1a1412' : '#8a7a70'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.stroke();
    if (!broken) { ctx.fillStyle = `rgba(255,${90 + Math.floor(30 * Math.sin(S.time * 4 + i))},20,0.8)`; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); }
  });
}

<script>/* ai/lazarus.js */
'use strict';
// 控制塔 + 终点站台 + Boss 战二：「拉撒路」（洛克伍德博士变异体）、电磁炮、J 登场（计划 2、4.3、4.5、6.1）
//
// 流程：打倒暴走处刑者 → 焚化炉车间北门通往控制塔（安全屋，J 在这里第一次露面）→ 控制台启动列车，
//   焚化炉车间南门打开 → 终点站台：洛克伍德博士现身，变异成拉撒路 → 三个阶段 → 倒下后 30 秒内跳上列车撤离（触手追击，见 updateEscape）
//
// 拉撒路：三个阶段各有一条血（1800 / 2200 / 4500），一个阶段打空 → 变身演出（无敌）→ 下一阶段满血
//   阶段一 人形：近身横扫（前摇 0.7 秒）、投掷钢材（红线预警）。每次出招后肩上的眼球睁开 2 秒 —— 这时打它 ×2.5
//   阶段二 四足兽形：速度 240（比你跑得快），扑咬 + 冲撞；撞墙晕 3 秒（输出窗口）；隔几秒召唤寄生体（30 血）
//   阶段三 巨大肉块：堵在站台东头不动，触手从你脚下钻出来（1 秒预警，打它 40 就能打断）；
//          站台从东往西被腐蚀，站在腐蚀区里持续掉血。J 丢来电磁炮（1500 × 3 发，按住射击蓄力 3 秒），
//          其他武器只有 10% 伤害。电磁炮打光了它还活着 → J 再丢一块电池（不会卡关）

const LAZ = {
  morph: 2.6,                                  // 变身演出（无敌）
  p1: {
    spd: 95,
    sweep: { windup: 0.7, rec: 0.8, arc: 1.3, reach: 92, dmg: 30 },
    toss: { min: 3.5 * 48, tell: 0.8, rec: 0.6, cd: [3, 4.5], spd: 560, dmg: 28, r: 14 },
    eyeOpen: 2.0,                              // 出招后眼球睁开多久
  },
  p2: {
    spd: 240,
    bite: { windup: 0.35, rec: 0.6, reach: 34, dmg: 22 },
    charge: { min: 3 * 48, tell: 0.6, spd: 520, time: 1.6, dmg: 35, cd: [2.5, 4] },
    roarCd: [11, 15],                          // 冲撞预警隔这么久才用一次满口咆哮，其余用短促的低哼（试玩反馈：阶段二太吵）
    summon: { cd: [7, 9], n: 2, max: 4 },
  },
  p3: {
    at: [85.5, 51.5], r: 72,                   // 肉块的位置（格）和半径
    // 触手：间隔 3–4 秒、1.3 秒预警、半径 50 —— 拿着电磁炮蓄力（瞄准速度 55）也能横移躲开，不必松手（玩家反馈后放慢）
    tentacle: { cd: [3, 4], first: 3, tell: 1.3, r: 50, dmg: 30, life: 0.5 },
    flinch: 2.5,                               // 被电磁炮打中后抽搐这么久：不长触手，地上正在冒的也缩回去
    corrode: { from: 80, to: 62, spd: 0.3, dps: 12 },   // 腐蚀边界从 x=80 格往西推到 62 格，每秒 0.3 格
    touch: 20,                                 // 贴上肉块
    jDelay: 2.2, resupply: 8,                  // J 丢电磁炮的延迟；打光了多久再补一块电池
  },
};
// 电磁炮（剧情武器，不占格子，数字键 6 切换）
const RAILGUN = { name: '电磁炮 EM-X', dmg: 1500, ammo: 3, charge: 3, cd: 0.8, range: 1500, noise: 20,
  keep: 1.2, decay: 1 };   // 松手后蓄力保留 1.2 秒（躲一下再接着蓄），之后每秒掉 1 秒

function lazarusBoss() { return S.enemies.find(e => e.t === 'lazarus' && !e.dead) || null; }
const lazPhaseDef = e => EDEF.lazarus.phases[(e.phase || 1) - 1];

// ---------------------------------------------------------------- 登场（触发器动作 lazarus: [x, y]）
function startLazarus(at) {
  if (S.enemies.some(e => e.t === 'lazarus')) return;
  const e = mkEnemy('lazarus', at[0], at[1]);
  e.phase = 1; e.alert = true; e.state = 'chase'; e.introT = 3.2; e.eyeT = 0; e.tossCd = S.time + 5;
  e.fa = Math.atan2(S.p.y - e.y, S.p.x - e.x);
  S.enemies.push(e);
  cryAt('lazarus', 'roar', e.x, e.y, 1, 3000, 0.5); shake = Math.max(shake, 14);
}
// 试玩跳转：直接从第 phase 阶段开打
function warpLazarus(phase) {
  S.enemies = S.enemies.filter(e => !['lazarus', 'parasite', 'tentacle'].includes(e.t));
  startLazarus([64, 51]); const e = lazarusBoss(); e.introT = 0;
  if (phase > 1) { e.phase = phase - 1; finishLazMorph(e); }
  S.fired[`${S.map}:m3_platform`] = true;
  const k = doorKey(80, 43); S.unlocked = S.unlocked.filter(u => u !== k); setDoorOpen(80, 43, false); grid[43 * MW + 80] = 3; drawTileAt(80, 43);
}
// 一个阶段打空 → 变身（无敌），演完进入下一阶段
function startLazMorph(e) {
  e.morphT = LAZ.morph; e.state = 'morph'; e.hp = 1; e.eyeT = 0; e.stunT = 0;
  cryAt('lazarus', 'roar', e.x, e.y, 1.2, 4000, 0.6); shake = Math.max(shake, 24);
  for (let i = 0; i < 50; i++) { const a = rand(6.283), v = rand(60, 280); parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 1), max: 1, s: rand(2, 6), c: Math.random() < .5 ? '#8a1a2a' : '#c06080', t: 'blood' }); }
  if (e.phase === 1) msg('它的脊椎「咔啦咔啦」地拉长，四肢着地 —— 已经不是人的形状了。', 4.5);
  else { msg('它退到站台尽头，身体像面团一样鼓胀起来，把整个站台堵死了……', 5); S.enemies.forEach(o => { if (o.t === 'parasite' && !o.dead) { o.dead = true; o.deadT = 0; } }); }
}
function finishLazMorph(e) {
  e.phase++; const D = lazPhaseDef(e);
  e.hp = e.maxhp = D.hp; e.state = 'chase'; e.atkT = 0; e.recT = 0;
  if (e.phase === 2) { e.r = 22; e.spd = LAZ.p2.spd; e.chargeCd = S.time + 2; e.summonCd = S.time + 3; }
  if (e.phase === 3) {
    e.r = LAZ.p3.r; e.x = LAZ.p3.at[0] * T; e.y = LAZ.p3.at[1] * T; e.tentCd = S.time + LAZ.p3.tentacle.first;
    S.corrode = LAZ.p3.corrode.from;
    S.jThrow = { t: -LAZ.p3.jDelay };   // J 先出现，过一会儿把电磁炮丢过来
    jAppear([52, 45], true);
  }
  setFlag(e.phase === 2 ? 'lazarus2' : 'lazarus3');
}

// ---------------------------------------------------------------- 控制塔的列车控制台
function useTrainConsole(it) {
  if (S.flags.trainStarted) { msg('列车已经启动了。终点站台在焚化炉车间的南门外。', 3); return; }
  sfx('metal', 1); sfx('bash', 0.5); shake = Math.max(shake, 5);
  msg('闸门落下。远处传来柴油机「突突突」的启动声 —— 列车开始预热了。', 5);
  if (S.npcJ) jLeave();
  setFlag('trainStarted');
}

// ---------------------------------------------------------------- AI
function updateLazarus(e, dt, safe) {
  const p = S.p, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
  e.ph += dt;
  if (e.introT > 0) { e.introT -= dt; turnToward(e, ang, 2, dt); return; }
  if (e.morphT > 0) { e.morphT -= dt; if (e.morphT <= 0) finishLazMorph(e); return; }
  if (e.eyeT > 0) e.eyeT -= dt;
  if (e.phase === 3) { updateLazMass(e, dt, safe, d); return; }
  if (e.stunT > 0) { e.stunT -= dt; return; }
  const reachBase = e.r + p.r;
  if (e.phase === 1) {
    const C = LAZ.p1;
    switch (e.state) {
      case 'sweep': {
        e.atkT -= dt; turnToward(e, ang, 2.4, dt);
        if (e.atkT > 0) return;

        if (S.time >= (e.roarCd || 0)) { e.roarCd = S.time + rand(C.roarCd[0], C.roarCd[1]); cryAt('lazarus', 'roar', e.x, e.y, 0.9, 1800, 0.3); }

        e.state = 'chase'; e.stunT = EDEF.lazarus.phases[1].stunAfterCharge; shake = Math.max(shake, 14); sfxAt('bash', e.x, e.y, 1.15, 2000, 0.4);

function lazMove(e, direct, spd, turn, dt) {

// ---------------------------------------------------------------- 受伤修正（combat.js 的 damageEnemy 调用）
// 返回修正后的伤害；返回 null = 这一下完全无效（变身中 / 登场演出中）
function lazarusDamage(e, dmg, a, src) {
  if (e.introT > 0 || e.morphT > 0) { if (Math.random() < 0.3) floats.push({ x: e.x, y: e.y - 40, t: '无效', life: 0.6, c: '#aaa' }); return null; }

  }

// ---------------------------------------------------------------- 站台上的其他东西：钢材、腐蚀、J、电磁炮

// ---------------------------------------------------------------- 绘制
function drawLazarus(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.dead) {

    ctx.beginPath(); ctx.ellipse(0, 0, e.r * 1.1, e.r * 0.8, 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a2030'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(Math.cos(i) * e.r * 0.6, Math.sin(i * 1.7) * e.r * 0.4, e.r * 0.2, 0, 7); ctx.fill(); }
    ctx.restore(); return;
  }
  const shakeX = e.morphT > 0 || e.introT > 0 ? Math.sin(e.ph * 40) * 3 : 0;
  ctx.translate(shakeX, 0);
  if (e.phase === 3) { drawLazMass(e); ctx.restore(); return; }
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(3, 6, e.r + 4, e.r - 2, 0, 0, 7); ctx.fill();
  let a = e.fa; if (e.stunT > 0) a += Math.sin(e.ph * 30) * 0.15;
  ctx.rotate(a);
  const s = Math.sin(e.ph * (e.phase === 2 ? 16 : 6));
  if (e.phase === 1) {
    // 人形：白大褂碎片、半身肉瘤、右臂变异成巨大的肉棒
    ctx.fillStyle = '#1a1414'; ctx.fillRect(-8 + s * 6, -16, 14, 10); ctx.fillRect(-8 - s * 6, 6, 14, 10);

<script>/* ai/executioner.js */

// 处刑者（追踪形态）AI 与导演系统（计划 3.1–3.6）。参数全部在 config/director.js。

//   track      追踪：听到噪音、跟丢了、被导演挪过来。沿“从目标点出发”的寻路场走过去 —— 不知道玩家的实际位置

function activeExecutioner() { return S.enemies.find(e => e.t === 'boss' && !e.dead) || null; }

function roomAdjacency() {

function goalFlow(gx, gy) {
  const tx = Math.floor(gx / T), ty = Math.floor(gy / T), key = tx + ',' + ty;

// ---------------------------------------------------------------- 状态切换

function exGoElsewhere(e) {

// 走一步：推开挡路的门、沉重脚步声（立体声，6 格内轻微震屏）、不能进安全屋。返回实际移动的距离

  const ox = e.x, oy = e.y;

  moveEnt(e, vx * sp * dt, vy * sp * dt);

    e.stepT = 0.72; e.stepSide = !e.stepSide;
    sfxAt('exstep', e.x, e.y, 1.8, 2000, 0.15);
    if (e.stepSide && Math.random() < 0.35) sfxAt('metal', e.x, e.y, 0.25, 900, 0);   // 身上的铁链 / 大衣上的金属扣
    const k2 = 1 - clamp(dPlayer / (14 * T), 0, 1);
    if (k2 > 0) shake = Math.max(shake, 1.5 + 7 * k2 * k2);
  }

function exWalkTo(e, tx, ty, sp, dt, dPlayer) { const a = Math.atan2(ty - e.y, tx - e.x); return exWalk(e, Math.cos(a), Math.sin(a), sp, dt, dPlayer); }

function exGoTo(e, g, sp, dt, dPlayer, near = T * 0.8) {

  if (dist(e.x, e.y, g.x, g.y) < near) return 'arrived';
  const n = flowNextOn(e, goalFlow(g.x, g.y), g.x, g.y);
  if (!n) return 'fail';
  exWalkTo(e, n[0], n[1], sp, dt, dPlayer);

// ---------------------------------------------------------------- 感知
// 看见：视线距离内、在前方视野角内、中间没有遮挡；贴身时不看方向。玩家在安全屋里时看不见
function exSees(e, d, safe) {
  if (safe) return false;
  const p = S.p;
  if (d < EXEC.closeSense) return true;
  if (d > EXEC.sightDist) return false;
  if (Math.abs(angDiff(e.fa, Math.atan2(p.y - e.y, p.x - e.x))) > EXEC.fov * Math.PI / 360) return false;
  return losClear(e.x, e.y, p.x, p.y);
}

// ---------------------------------------------------------------- 每帧更新
function freezeExecutioner(e) {
  e.frozenT = LN2.freeze; e.state = 'frozen'; e.alert = false; e.atkT = 0; e.dashT = 0; e.stag = 0;

}
function updateExecutioner(e, dt, safe) {
  const p = S.p, D = S.executioner;
  // 被液氮冻住：一动不动；时间到破冰，直接追踪玩家当前位置（计划 3.x：环境击倒，不计入打倒阈值）
  if (e.frozenT > 0) {
    e.frozenT -= dt; e.state = 'frozen';
    if (e.frozenT < 4 && Math.random() < dt * 3) sfxAt('bash', e.x, e.y, 0.25, 900);   // 冰层开裂
    if (e.frozenT <= 0) {
      e.frozenT = 0; exTrack(e, p.x, p.y);
      if (D) D.protectT = Math.max(D.protectT || 0, 3);
      sfxAt('bash', e.x, e.y, 1.2, 1800); cryAt('executioner', 'roar', e.x, e.y, 1, 2400, 0.2); shake = 16;
      for (let i = 0; i < 24; i++) parts.push({ x: e.x, y: e.y, vx: rand(-160, 160), vy: rand(-160, 160), life: 0.8, max: 0.8, s: rand(3, 6), c: '#cfe6ff' });
      msg('冰层炸开了 —— 它朝你的方向冲了过来！', 3.5);
    }

  }

  if (e.knockdownT > 0) {
    e.knockdownT -= dt; e.state = 'knockdown'; e.alert = false; e.atkT = 0;
    if (e.knockdownT <= 0) {
      e.knockdownT = 0; e.stagAcc = 0; e.midStagDone = false; exChase(e);
      D.protectT = Math.max(D.protectT || 0, DIRECTOR.afterKnockdown);
      cryAt('executioner', 'roar', e.x, e.y, 1, 2400, 0.4); msg('沉重的脚步声重新响起……'); shake = 14;
    }
    return;
  }
  if (e.state === 'knockdown' || !e.state || e.state === 'idle') { if (e.alert) exChase(e); else exSearch(e); }  // 刚生成 / 旧存档
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
  // 玩家躲进安全屋：正在追的话走到门外守候

  if (safe && (CHASING[e.state] || (e.state === 'track' && !e.leaving))) exGuard(e);
  e.groanT -= dt;
  if (e.groanT <= 0) { e.groanT = rand(4, 9); cryAt('executioner', 'growl', e.x, e.y, 1, 1100); }
  if (e.stag > 0) { e.stag -= dt; return; }

  const retreating = e.state === 'retreat';
  const sees = exSees(e, d, safe) && (!retreating || d < DIRECTOR.retreatNotice * T);
  if (sees) { e.lastSeen = { x: p.x, y: p.y }; e.lostT = 0; }
  if ((sees || e.alert) && !CHASING[e.state] && !safe) { if (!e.alert) cryAt('executioner', 'roar', e.x, e.y, 0.8, 1300); exChase(e); }
  // 听觉：搜索 / 追踪 / 守候时听到噪音就去声源（追击中不需要，撤离中不理会，安全屋里的声音不算）
  if (e.heard) {

    case 'dash': return exDashStep(e, dt, d, ang);
    case 'chase': return exChaseStep(e, dt, d, ang, sees, safe);
    case 'track': return exTrackStep(e, dt, d);
    case 'guard': return exGuardStep(e, dt, d);
    case 'retreat': return exRetreatStep(e, dt, d);

}

function exChaseStep(e, dt, d, ang, sees) {
  const p = S.p, X = EXEC;
  if (!sees) {
    e.lostT = (e.lostT || 0) + dt;
    if (e.lostT > X.loseSight) { const ls = e.lastSeen || { x: p.x, y: p.y }; e.lostT = 0; exTrack(e, ls.x, ls.y); return; }
  }

  if (direct && d < e.r + p.r + EDEF.boss.reach * 0.7) { exStartAttack(e); return; }

  e.dashCd = (e.dashCd || 0) - dt;

    if (Math.random() < X.dash.chance) { e.state = 'dash'; e.dashT = X.dash.tell + X.dash.time; e.dashA = ang; cryAt('executioner', 'roar', e.x, e.y, 1, 1300); return; }
  }

}

  e.state = 'attack'; e.atk = grab ? 'grab' : 'punch'; e.atkT = grab ? EXEC.grab.windup : EXEC.punch.windup;

}
function exAttackStep(e, dt, d, ang, safe) {

  if (safe) { exGuard(e); return; }
  if (e.atkT > 0) return;
  const p = S.p, inReach = d < e.r + p.r + EDEF.boss.reach + 6;
  if (e.atk === 'grab') {
    e.state = 'rec'; e.recT = EXEC.grab.rec;
    if (!inReach || P.inv > 0 || mode !== 'play') return;

      // 小刀反击挣脱：不受伤，它踉跄；小刀要过一会儿才能再用
      P.knifeCd = EXEC.grab.counterKnifeCd; P.knifeT = KNIFE.swing; P.inv = 0.8;
      sfx('knife'); sfx('hit'); bleed(e.x, e.y, ang + Math.PI, 8, false);
      e.state = 'chase'; e.stag = EXEC.grab.counterStun; S.stats.escapes = (S.stats.escapes || 0) + 1;
      floats.push({ x: e.x, y: e.y - 34, t: '挣脱！', life: 1.2, c: '#9fd8ff' });
      msg('被抓住的一瞬间，你把小刀扎进它的手臂，挣脱了！（小刀需要几秒才能再用）', 3.5);
      return;
    }
    // 手雷 / 闪光弹挣脱（计划 3.1、6.2）：塞进它嘴里 / 怼着脸引爆。手雷的伤害照常计入打倒阈值
    const th = invHas('grenade') ? 'grenade' : invHas('flashbang') ? 'flashbang' : null;
    if (th) {
      invTake(th, 1); P.inv = 1.2; S.stats.escapes = (S.stats.escapes || 0) + 1;
      moveEnt(p, Math.cos(ang + Math.PI) * 50, Math.sin(ang + Math.PI) * 50);
      e.state = 'chase';
      if (th === 'grenade') { msg('你把手雷塞进它嘴里，一脚蹬开 —— 轰！', 3.5); grenadeBlast(e.x + Math.cos(ang + Math.PI) * 10, e.y + Math.sin(ang + Math.PI) * 10); }
      else { msg('你把闪光弹怼在它脸上引爆，趁它看不见挣脱了！', 3.5); flashBurst(e.x, e.y); }
      e.stag = Math.max(e.stag || 0, EXEC.grab.counterStun);
      floats.push({ x: e.x, y: e.y - 34, t: '挣脱！', life: 1.2, c: '#9fd8ff' });
      return;
    }
    hurtPlayer(EXEC.grab.dmg, ang, 'boss'); msg('被处刑者抓住了！', 2);
    return;
  }

}
function exDashStep(e, dt, d, ang) {
  const X = EXEC.dash, p = S.p;

  if (e.dashT > X.time) { e.fa += angDiff(e.fa, ang) * Math.min(1, dt * 6); e.dashA = e.fa; return; }  // 蓄力：原地转向，方向在起跑时固定

  const moved = exWalk(e, Math.cos(e.dashA), Math.sin(e.dashA), X.speed, dt, d);

  if (moved < X.speed * dt * 0.3) { e.state = 'rec'; e.recT = 0.7; shake = Math.max(shake, 6); sfxAt('bash', e.x, e.y, 0.8, 900); }  // 撞墙

  const r = exGoTo(e, e.goal, e.spd, dt, d);

}
function exSearchStep(e, dt, d, away) {

    if (e.lookT <= 0) e.goal = nextRoomGoal(e, away);
    return;
  }
  if (!e.goal) e.goal = nextRoomGoal(e, away);
  const r = exGoTo(e, e.goal, e.spd * 0.85, dt, d, T * 0.9);

}

  const g = e.goal;
  if (g) {
    const r = exGoTo(e, g, e.spd, dt, d, T * 0.6);
    if (r === 'moving') return;
    if (r === 'fail') e.goal = null;   // 走不到门口：原地守候
    else e.fa += angDiff(e.fa, Math.atan2(g.door.y - e.y, g.door.x - e.x)) * Math.min(1, dt * 3);  // 面向门
  }

  e.retreatT -= dt;
  if (e.retreatT <= 0) { exSearch(e); return; }
  if (e.goal && !e.lookT) {
    const r = exGoTo(e, e.goal, e.spd, dt, d);
    if (r !== 'moving') { e.goal = null; e.lookT = EXEC.lookAround; }
    return;
  }
  exSearchStep(e, dt, d, true);  // 到了之后在那一带搜索，每次选离玩家更远的房间
}

// ---------------------------------------------------------------- 导演系统
function updateDirector(dt, e, safe) {

  D.tension = (D.tension || 0) + clamp(target - (D.tension || 0), -R.tensionFall * dt, R.tensionRise * dt);

  if (CHASING[e.state]) { D.chaseT = (D.chaseT || 0) + dt; if (D.chaseT >= R.tightTime) exRetreat(e); }

  const paused = safe || D.graceT > 0 || D.protectT > 0 || inPuzzleRoom() || e.knockdownT > 0 || e.frozenT > 0 || CHASING[e.state] || e.state === 'retreat' || e.state === 'guard';
  if (pd <= R.looseDist) D.looseT = 0;

}
function directorTeleport(e) {

  e.x = s.x; e.y = s.y; e.stuckT = 0; D.looseT = 0; D.teleports = (D.teleports || 0) + 1;

  if (door) sfxAt('door', door.x, door.y, 1.8, 1600, 0.25);
  // 落地后在这一带搜索（环顾 → 随机检查相邻房间），而不是直接走进玩家的房间：
  // 它“出现在附近”，但不知道玩家的确切位置（计划 3.2：只有追击才知道玩家在哪）
  e.lastRoom = undefined; exSearch(e);

}
// 读档保护：它离玩家不到 12 格就挪到 20 格以外看不见的地方；30 秒内不瞬移。防止“读档 → 出门 → 被秒杀”

  const D = S.executioner; if (!D) return;
  D.playerSafe = inSafe(); D.graceT = 0; D.looseT = 0; D.chaseT = 0; D.protectT = DIRECTOR.loadProtect;
  const e = activeExecutioner(); if (!e) return;
  computeAllFlows();
  e.heard = null; e.heardField = null; e.atkT = 0; e.stag = 0; e.lastSeen = null;
  if (e.knockdownT <= 0) exSearch(e);
  if (pathDistTo(e.x, e.y) < DIRECTOR.loadNear) {
    const s = findSpot(DIRECTOR.loadFar, DIRECTOR.loadFar + 12) || findSpot(DIRECTOR.loadFar, Infinity) || farthestSpot();
    if (s) { e.x = s.x; e.y = s.y; }
  }
}

// ---------------------------------------------------------------- 换地图跟随（计划 3.6）
// 离开地图时调用（swapLevel 里、切换之前）：目标地图有剧情入口（execEntry）就跟过去，否则留在原地图
function execBeforeLeave(toId) {
  const D = S.executioner; if (!D || !D.active) return;
  if (!LEVELS[toId] || !LEVELS[toId].execEntry) return;
  const e = activeExecutioner();
  // 它一旦登场就一直跟着玩家：即使此刻不在这张图里（还在路上 / 被冻着 / 倒地），也照样跟到下一张图
  if (!e && D.follow && D.follow.map === toId) return;
  const R = DIRECTOR, [a, b] = e && (CHASING[e.state] || e.state === 'track') ? R.followChased : R.follow;
  if (e) S.enemies = S.enemies.filter(x => x !== e);
  D.follow = { map: toId, left: rand(a, b) };
}
// 每帧：玩家在目标地图里，喘息时间走完就从入口登场（巨响、震屏、全图都能听见）
function updateFollow(dt) {
  const D = S.executioner, f = D && D.follow;
  if (!f || f.map !== S.map || !LEVEL.execEntry) return;
  f.left -= dt; if (f.left > 0) return;
  const en = LEVEL.execEntry, b = mkEnemy('boss', en.x, en.y);
  D.follow = null; D.map = S.map; D.protectT = Math.max(D.protectT || 0, 10);
  S.enemies.push(b);
  cryAt('executioner', 'roar', b.x, b.y, 1, 4000, 0.6); sfxAt('bash', b.x, b.y, 1.5, 4000, 0.5); shake = 25;
  msg(en.msg || '远处一声巨响——它跟来了。', 4.5);
  const pr = curRoom(), g = pr >= 0 ? roomPoint(pr) : null;
  exTrack(b, g ? g.x : S.p.x, g ? g.y : S.p.y);
}

// ---------------------------------------------------------------- 直升机
// 俯视角里「高度」没法直接画，用三个量一起骗眼睛：

// heliAlt()：1 = 还在高空，0 = 已经落地。
function heliAlt() {
  const t = S.heliT || 0;
  if (heliBoarding() && S.cineT > 2.2) return clamp((S.cineT - 2.2) / 3.2, 0, 1) * 1.6;  // 起飞：越升越高
  return clamp(1 - t / 3.5, 0, 1);                                                    // 降落：3.5 秒落地
}
// o：坠毁演出时传入 { x, y, alt, ang, noTail }；平时不传，按降落时间轴画在停机坪上
function drawHeli(o) {

  // 航行灯：红左绿右，尾灯白色，一闪一闪

// 坠毁的直升机：歪倒的机身、断掉的旋翼、一直在烧的火
function drawWreck() {

}

// ---------------------------------------------------------------- 收容舱与坠毁演出
// 收容舱：落地前是一个越来越大的阴影 + 从高处坠下的舱体；落地后是一个裂开的金属胶囊

  if (k >= 1) { ctx.strokeStyle = 'rgba(40,30,20,0.6)'; ctx.lineWidth = 3; for (let i = 0; i < 7; i++) { const a = i * 0.9; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 26, Math.sin(a) * 30); ctx.lineTo(Math.cos(a) * 48, Math.sin(a) * 52); ctx.stroke(); } }
  ctx.fillStyle = '#3c434b'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 34, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#12151a'; ctx.beginPath(); ctx.ellipse(0, 2, 15, 26, 0, 0, 7); ctx.fill();   // 舱内
  if (o.hatch) {                       // 舱门：落地后歪在一边，还没被扯下来
    ctx.save(); if (k >= 1) { ctx.translate(-20, 6); ctx.rotate(-0.5); }
    ctx.fillStyle = '#58616b'; ctx.fillRect(-13, -24, 26, 48); ctx.fillStyle = '#c8a030'; ctx.fillRect(-13, -4, 26, 5);
    ctx.restore();
  }
  ctx.fillStyle = '#c8a030'; ctx.fillRect(-22, -3, 5, 6); ctx.fillRect(17, -3, 5, 6);
  const bl = Math.sin(S.time * 8) > 0 ? 1 : 0.2; ctx.globalAlpha = bl; ctx.fillStyle = '#ff3020'; ctx.beginPath(); ctx.arc(0, -30, 3, 0, 7); ctx.fill();
  ctx.restore();
}

function drawCrashShadow() {
  const c = S.crash, a = c.hit ? c.alt : c.alt0;
  ctx.save(); ctx.globalAlpha = 0.5 * (1 - a * 0.55); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(c.hx + a * 26, c.hy + 34 + a * 40, 30 * (1 - a * 0.35), 16 * (1 - a * 0.35), c.ang, 0, 7); ctx.fill();
  // 石头的影子
  if (c.thrown && !c.hit) { const h = crashRockPos(c); ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.ellipse(h.x, h.y + 6, 14, 7, 0, 0, 7); ctx.fill(); }
  ctx.restore();
}

// 空中的东西都画在暗处之上：直升机、石头、碎片
function drawCrashAir() {
  const c = S.crash;
  // 处刑者：夜里的草地上它几乎是黑的。演出期间把它提到暗处之上，加一圈暗红的轮廓光和发亮的眼睛，
  // 让玩家看清「是谁在扔」。砸地后慢慢褪掉，交还控制权时回到正常画法
  const boss = S.enemies.find(e => e.t === 'boss' && !e.dead);
  if (boss) drawBossGlow(boss, Math.min(clamp(c.t / 0.3, 0, 1), clamp((CRASH.end - 0.8 - c.t) / 1.2, 0, 1)));
  if (!c.ground) drawHeli(c.hit ? { x: c.hx, y: c.hy, alt: c.alt, ang: c.ang, noTail: true } : { x: PAD.x, y: PAD.y, alt: c.alt0, ang: 0 });
  // 石头：从处刑者脚前的地里掀起来，慢慢举过头顶（越举越高 = 画得越大），蓄力时往后拉，甩出去后打着旋飞向尾梁
  if (c.ripped && !c.hit) {
    let x, y, rot, sc;
    const a = Math.atan2(PAD.y - c.by, PAD.x - c.bx);
    if (!c.thrown) {
      const lift = easeOut(clamp((c.t - CRASH.rip) / (CRASH.wind - CRASH.rip), 0, 1));
      const pull = clamp((c.t - CRASH.wind) / (CRASH.throw - CRASH.wind), 0, 1);
      const reach = lerp(30, 6, lift) - pull * 18;                     // 从脚前收到头顶，再往后拉
      x = c.bx + Math.cos(a) * reach; y = c.by + Math.sin(a) * reach - lift * 16;
      rot = a + lift * 0.4 - pull * 0.5; sc = 0.85 + lift * 0.3;
    } else { const h = crashRockPos(c); x = h.x; y = h.y - h.h; rot = h.rot; sc = 1.15 + h.h / 120; }
    drawRock(x, y, rot, sc);
  }
  for (const q of c.debris) {
    ctx.save(); ctx.globalAlpha = clamp(q.life, 0, 1); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
    ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore();
  }
}

// 屏幕层：电影黑边 + 砸地白闪
function drawCrashScreen() {
  const c = S.crash;
  if (c) {
    const k = Math.min(clamp(c.t / 0.5, 0, 1), clamp((CRASH.end - c.t) / 0.6, 0, 1)), bh = Math.round(H * 0.09 * k);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
  }
  if (S.crashFlash > 0) { ctx.fillStyle = `rgba(255,236,200,${S.crashFlash * 0.85})`; ctx.fillRect(0, 0, W, H); }
}

// 一块不规则的大石头：暗面 + 亮面 + 几道裂纹。形状固定，免得每帧抖动
const ROCK_SHAPE = [[-20, -6], [-14, -17], [-2, -21], [12, -16], [21, -5], [18, 10], [6, 18], [-9, 17], [-19, 9]];
function drawRock(x, y, rot, sc) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.fillStyle = '#3e3a35'; ctx.beginPath(); ROCK_SHAPE.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6f6960'; ctx.beginPath(); ROCK_SHAPE.forEach(([px, py], i) => i ? ctx.lineTo(px * 0.78 - 3, py * 0.78 - 3) : ctx.moveTo(px * 0.78 - 3, py * 0.78 - 3)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(160,150,135,0.5)'; ctx.beginPath(); ctx.ellipse(-6, -9, 7, 4, -0.4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2c2925'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(2, -2); ctx.lineTo(-3, 7); ctx.moveTo(8, -8); ctx.lineTo(12, 2); ctx.stroke();
  ctx.fillStyle = 'rgba(60,45,25,0.8)'; ctx.fillRect(-10, 12, 5, 3); ctx.fillRect(4, 13, 6, 3);   // 底下还粘着泥
  ctx.restore();
}

// 演出里的处刑者：提到暗处之上，暗红轮廓光 + 发亮的眼睛（坠毁、跳落共用）。k = 0…1 淡入淡出
function drawBossGlow(boss, k) {
  if (!(k > 0)) return;
  const pulse = 0.8 + 0.2 * Math.sin(S.time * 6);
  const g = ctx.createRadialGradient(boss.x, boss.y, 10, boss.x, boss.y, 64);
  g.addColorStop(0, `rgba(170,20,15,${0.55 * k * pulse})`); g.addColorStop(1, 'rgba(170,20,15,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(boss.x, boss.y, 64, 0, 7); ctx.fill();
  ctx.save(); ctx.globalAlpha = k;
  ctx.shadowColor = 'rgba(255,60,40,0.9)'; ctx.shadowBlur = 14;
  drawEnemy(boss);
  ctx.restore();
  const a = boss.fa || 0, ex = boss.x + Math.cos(a) * 11, ey = boss.y + Math.sin(a) * 11, nx = -Math.sin(a) * 3.5, ny = Math.cos(a) * 3.5;
  ctx.save(); ctx.globalAlpha = k; ctx.shadowColor = '#ff2010'; ctx.shadowBlur = 10; ctx.fillStyle = '#ff5030';
  ctx.beginPath(); ctx.arc(ex + nx, ey + ny, 2.2, 0, 7); ctx.arc(ex - nx, ey - ny, 2.2, 0, 7); ctx.fill(); ctx.restore();
}

// ---------------------------------------------------------------- 处刑者从二楼栏杆跳下（主厅）
function drawLeapGround() {
  const L = S.leap; if (!L) return;
  const k = clamp(L.t / LEAP.land, 0, 1);
  if (L.t < LEAP.land) {   // 落点的影子：越来越大、越来越黑
    ctx.save(); ctx.globalAlpha = 0.15 + 0.55 * k * k; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(L.x, L.y + 6, 12 + 22 * k, 8 + 14 * k, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}
function drawLeapAir() {
  const L = S.leap; if (!L) return;
  if (L.t >= LEAP.drop && L.t < LEAP.land) {      // 从画面外砸下来：越低越小
    const k = clamp((L.t - LEAP.drop) / (LEAP.land - LEAP.drop), 0, 1), h = (1 - k * k) * 180, sc = 1 + (1 - k) * 1.4;
    const fake = { t: 'boss', x: L.x, y: L.y - h, fa: Math.PI / 2, ph: 0, dead: false, state: 'chase', r: 21 };
    ctx.save(); ctx.translate(L.x, L.y - h); ctx.scale(sc, sc); ctx.translate(-L.x, -(L.y - h));
    drawBossGlow(fake, 1); ctx.restore();
  }
  const boss = S.enemies.find(e => e.t === 'boss' && !e.dead);
  if (boss && L.t >= LEAP.land) drawBossGlow(boss, clamp((LEAP.end - L.t) / 0.6, 0, 1));
}
function drawLeapScreen() {
  const L = S.leap; if (!L) return;
  const k = Math.min(clamp(L.t / 0.4, 0, 1), clamp((LEAP.end - L.t) / 0.5, 0, 1)), bh = Math.round(H * 0.09 * k);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
}

  y += 30 * k; note(rep.extra, '#8a8070', 14);
  // 评价 + 离下一档还差多少 + 全部规则（让玩家知道下一次该怎么打）
  y += 74 * k; ctx.textAlign = 'center'; ctx.font = 'bold ' + fs(56) + 'serif'; ctx.fillStyle = RANK.color[r.rank] || '#ccc'; ctx.fillText('评价 ' + r.rank, cx, y);
  y += 34 * k; note(rep.hint, '#cbb98f', 15);
  y += 24 * k; note(rep.ladder, '#7a7060', 13);
  y += 20 * k; note(rep.rule, '#7a7060', 13);
  if (modeT > 2) { ctx.textAlign = 'center'; ctx.font = '15px sans-serif'; ctx.fillStyle = '#888'; ctx.fillText('按 回车 返回标题', cx, H - 30); }
  ctx.globalAlpha = 1;
}

// 结算画面的文字。优先级：真正通关 > 第二章完 > 第一章完。
// ⚠️ 最终结局（M4 列车撤离）必须置上 gameClear 标记，否则会显示成「第 二 章　完」。
function winText(f) {
  f = f || {};
  if (f.gameClear || !f.chapter1Done) return ['逃 出 生 天', '货运列车冲出隧道，迎着黎明驶离赫里昂制药厂。', '……站台的阴影里，一抹红色风衣的衣角，和一支完好的样本管。',
    'S.T.R.T. 事后报告 · 拉撒路病原体：全部样本已随设施焚毁。 —— 归档'];
  if (f.chapter2Done) return ['第 二 章　完', '列车一头扎进隧道。拉撒路地下研究所被远远甩在身后。', '下一章　赫里昂制药厂'];
  return ['第 一 章　完', '升降梯沉进黑暗。洛克伍德宅邸的灯光在头顶缩成一个点。', '下一章　拉撒路地下研究所'];
}

<script>/* ui/intro.js */
'use strict';
// 序章：新游戏开始时的开场演出。
//
// 为什么值得单独做：开头 60 秒决定别人愿不愿意继续玩。原来的流程是
// 「点新游戏 → 弹出 f0 文件 → 关掉 → 你站在主厅里，随便走」——
// 玩家不知道自己是谁、在哪、怕什么，只知道有个人物能动。
//
// 这里不做动画特效，只做**节奏**：黑屏里一行行浮出字，配无线电杂音和心跳，
// 最后一行落下之后才亮起画面。任意键可跳过（第二次玩的人不该被强迫再看一遍）。

const INTRO_LINES = [
  { t: 0.6,  s: '1998 年 9 月 24 日，夜。', size: 20, col: '#8a8070' },
  { t: 3.2,  s: '赫里昂制药郊外 · 洛克伍德宅邸', size: 26, col: '#c9b98a' },
  { t: 6.0,  s: '失联 72 小时。', size: 20, col: '#8a8070' },
  { t: 9.0,  s: 'S.T.R.T. 救援小队的直升机在宅邸上空被击落。', size: 19, col: '#9a9080' },
  { t: 12.0, s: '队友下落不明。无线电里只剩沙沙声。', size: 19, col: '#9a9080' },
  { t: 15.4, s: '身后的大门被什么东西堵死了。', size: 21, col: '#b8a880' },
  { t: 18.6, s: '先找到出路。', size: 28, col: '#d8c9a0' },
  { t: 21.2, s: '活下去。', size: 34, col: '#e8d8a0' },
];
const INTRO_LEN = 25.0;      // 总长；最后一行之后留几秒静默再亮起画面
const INTRO_FADE = 2.2;      // 结尾淡入游戏画面的时长

let introT = 0;

function startIntro() {
  introT = 0;
  mode = 'intro';
  modeT = 0;
}

function updateIntro(dt) {
  introT += dt;
  // 心跳：越接近结尾越快，把节奏推上去
  const beat = introT < 12 ? 1.35 : introT < 19 ? 1.05 : 0.8;
  if (Math.floor(introT / beat) !== Math.floor((introT - dt) / beat)) {
    sfx('heart', clamp(0.18 + introT / INTRO_LEN * 0.35, 0.18, 0.55));
  }
  if (introT >= INTRO_LEN) endIntro();
}

function endIntro() {
  startAmbient();
  openFile('f0', 'play');       // 序章之后才是简报，关掉简报就开始玩
  msg('无线电：「……有人吗……听得到吗……」', 5);
}

function drawIntro() {
  // 底下已经画好了真实的游戏画面（主厅、灯光、林岚）。这里盖一层黑，
  // 最后 2.2 秒让这层黑的透明度降下去 —— 画面就是从序章里「亮起来」的，
  // 而不是切一刀换个场景。
  const k = introT > INTRO_LEN - INTRO_FADE ? (introT - (INTRO_LEN - INTRO_FADE)) / INTRO_FADE : 0;
  ctx.fillStyle = `rgba(0,0,0,${1 - clamp(k, 0, 1)})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  // 每行：淡入 → 停留 → 淡出；同一时刻通常只有一两行在屏幕上
  for (const ln of INTRO_LINES) {
    const d = introT - ln.t;
    if (d < 0 || d > 5.2) continue;
    const a = clamp(Math.min(d / 1.1, (5.2 - d) / 1.3), 0, 1) * (1 - clamp(k, 0, 1));
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.font = `${ln.size}px serif`;
    ctx.fillStyle = ln.col;
    ctx.fillText(ln.s, W / 2, H / 2 + (ln.t > 15 ? 0 : -10));
  }
  ctx.globalAlpha = 1;

  // 无线电静噪：几道随机的细横线，暗示"信号里什么都没有"
  if (introT < 20) {
    ctx.fillStyle = 'rgba(160,150,130,0.05)';
    for (let i = 0; i < 3; i++) {
      const y = (hash(Math.floor(introT * 6), i) * H) | 0;
      ctx.fillRect(0, y, W, 1);
    }
  }

  // 跳过提示：等 2 秒再出现，免得第一眼就在教人怎么跳过自己的开场
  if (introT > 2 && k <= 0) {
    ctx.globalAlpha = clamp((introT - 2) / 1.5, 0, 0.5);
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#666';
    ctx.fillText('按任意键跳过', W / 2, H - 30);
    ctx.globalAlpha = 1;
  }
}
</script>
<script>/* ui/menus.js */
'use strict';
// 菜单：标题菜单、存档槽（存档 / 读档）、设置、操作说明、暂停菜单
// 菜单之间用栈返回：从哪里打开，Esc 就回到哪里。

const MENU = { cur: 0, stack: [], purpose: 'save', confirm: null, rects: [], slots: [], pauseCur: 0, titleCur: null };
const MENU_MODES = ['slots', 'settings', 'keys'];
const isMenuMode = m => MENU_MODES.includes(m);
const menuOverTitle = () => isMenuMode(mode) && MENU.stack[0] === 'title';
const UP = ['ArrowUp', 'KeyW'], DOWN = ['ArrowDown', 'KeyS'], LEFT = ['ArrowLeft', 'KeyA'], RIGHT = ['ArrowRight', 'KeyD'], OK = ['Enter', 'KeyE', 'Space'];

function refreshSlots() { MENU.slots = listSlots(); }
function openMenu(m) { MENU.stack.push(mode); mode = m; modeT = 0; MENU.cur = 0; MENU.confirm = null; }
function closeMenu() {
  if (mode === 'settings') saveSettings();
  mode = MENU.stack.pop() || 'title'; modeT = 0; MENU.confirm = null;
  if (mode === 'title') { MENU.stack = []; refreshSlots(); }
}
function goTitle() { mode = 'title'; modeT = 0; MENU.stack = []; MENU.titleCur = null; MENU.confirm = null; refreshSlots(); }

// ---------------------------------------------------------------- 标题菜单
function titleItems() {
  const latest = latestSlot(), any = MENU.slots.some(s => s.state !== 'empty');
  const it = [];
  if (latest) it.push({ id: 'continue', label: `继续（存档 ${latest}）` });
  it.push({ id: 'new', label: '新游戏' });
  if (any) it.push({ id: 'load', label: '读取存档' });
  it.push({ id: 'settings', label: '设置' }, { id: 'keys', label: '操作说明' });
  if (RESIDUE_API && RESIDUE_API.quit) it.push({ id: 'quit', label: '退出游戏' });
  return it;
}
function titleAction(id) {
  if (id === 'continue') loadSlot(latestSlot());
  else if (id === 'new') { CUR_SLOT = null; startGame(false); }
  else if (id === 'load') openSlots('load');
  else if (id === 'settings') openMenu('settings');
  else if (id === 'keys') openMenu('keys');
  else if (id === 'quit') RESIDUE_API.quit();
}
function titleKey(e) {
  const items = titleItems();
  if (MENU.titleCur === null || MENU.titleCur >= items.length) MENU.titleCur = 0;
  if (UP.includes(e.code)) MENU.titleCur = (MENU.titleCur + items.length - 1) % items.length;
  else if (DOWN.includes(e.code)) MENU.titleCur = (MENU.titleCur + 1) % items.length;
  else if (OK.includes(e.code)) titleAction(items[MENU.titleCur].id);
  else if (e.code === 'KeyC' && latestSlot()) titleAction('continue');
}
function drawTitleMenu() {
  const items = titleItems();
  if (MENU.titleCur === null || MENU.titleCur >= items.length) MENU.titleCur = 0;
  MENU.rects = [];
  const x = W / 2, y0 = H * 0.74 - (items.length - 1) * 15;
  ctx.textAlign = 'center';
  items.forEach((it, i) => {
    const y = y0 + i * 30, sel = i === MENU.titleCur;
    ctx.font = sel ? 'bold 20px sans-serif' : '18px sans-serif';
    ctx.fillStyle = sel ? '#f0e2b8' : '#8a8070';
    ctx.fillText(sel ? `▸ ${it.label} ◂` : it.label, x, y);
    MENU.rects.push({ x: x - 120, y: y - 20, w: 240, h: 28, i });
  });
}

// ---------------------------------------------------------------- 存档槽
// purpose：'save'（打字机）或 'load'（标题菜单）
function openSlots(purpose) {
  refreshSlots(); openMenu('slots'); MENU.purpose = purpose;
  if (purpose === 'save') {
    const empty = MENU.slots.findIndex(s => s.state === 'empty');
    MENU.cur = CUR_SLOT ? CUR_SLOT - 1 : Math.max(0, empty);
  } else {
    const latest = latestSlot(); MENU.cur = latest ? latest - 1 : 0;
  }
}
function slotsActivate(i) {
  if (i === SLOT_COUNT) { closeMenu(); return; }  // “返回”
  const s = MENU.slots[i], n = i + 1;
  if (MENU.purpose === 'save') {
    // 覆盖别的存档（不是这局自己的）要再按一次确认
    if (s.state !== 'empty' && n !== CUR_SLOT && MENU.confirm !== n) { MENU.confirm = n; sfx('locked'); return; }
    MENU.stack = []; mode = 'play'; MENU.confirm = null;
    saveGame(n); refreshSlots();
  } else {
    if (s.state === 'empty' || s.state === 'corrupt') { sfx('locked'); return; }
    MENU.stack = []; MENU.confirm = null;
    loadSlot(n);
  }
}
function slotsKey(e) {
  const rows = SLOT_COUNT + 1;
  if (e.code === 'Escape') { closeMenu(); return; }
  if (UP.includes(e.code)) { MENU.cur = (MENU.cur + rows - 1) % rows; MENU.confirm = null; }
  else if (DOWN.includes(e.code)) { MENU.cur = (MENU.cur + 1) % rows; MENU.confirm = null; }
  else if (OK.includes(e.code)) slotsActivate(MENU.cur);
  else if (e.code === 'Delete' && MENU.purpose === 'load' && MENU.cur < SLOT_COUNT && MENU.slots[MENU.cur].state !== 'empty') {
    // 删除存档：按两次 Delete
    const n = MENU.cur + 1;
    if (MENU.confirm !== 'del' + n) { MENU.confirm = 'del' + n; sfx('locked'); return; }
    deleteSlotRaw(n); if (CUR_SLOT === n) CUR_SLOT = null; MENU.confirm = null; refreshSlots(); sfx('door');
    if (!MENU.slots.some(s => s.state !== 'empty')) goTitle();
  }
}
function deleteSlotRaw(n) {
  if (RESIDUE_API) { try { RESIDUE_API.deleteSlot(n); } catch (e) { /* 删除失败就保留 */ } }
  else { try { localStorage.removeItem(LS_SLOT(n)); localStorage.removeItem(LS_BAK(n)); } catch (e) { /* 同上 */ } }
  MENU.slots[n - 1] = { n, state: 'empty' };
}
function drawSlots() {
  panelBg();
  const save = MENU.purpose === 'save';
  ctx.textAlign = 'center'; ctx.font = 'bold 30px serif'; ctx.fillStyle = '#d8c9a0';
  ctx.fillText(save ? '保存进度' : '读取存档', W / 2, H * 0.17);
  MENU.rects = [];
  const w = Math.min(640, W - 80), x = W / 2 - w / 2, h = 78, y0 = H * 0.24;
  for (let i = 0; i < SLOT_COUNT; i++) {
    const s = MENU.slots[i], y = y0 + i * (h + 12), sel = i === MENU.cur, n = i + 1;
    ctx.fillStyle = sel ? 'rgba(90,70,40,0.55)' : 'rgba(20,16,12,0.8)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = sel ? '#e0c080' : 'rgba(150,130,90,0.35)'; ctx.lineWidth = sel ? 2 : 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    ctx.textAlign = 'left'; ctx.font = 'bold 18px serif'; ctx.fillStyle = '#e8dcc0';
    ctx.fillText(`存档 ${n}` + (n === CUR_SLOT ? '（当前）' : ''), x + 18, y + 30);
    ctx.font = '14px sans-serif';
    if (s.state === 'empty') { ctx.fillStyle = '#777'; ctx.fillText('—— 空 ——', x + 18, y + 56); }
    else if (s.state === 'corrupt') { ctx.fillStyle = '#c55'; ctx.fillText('存档和备份都已损坏', x + 18, y + 56); }
    else {
      ctx.fillStyle = '#bfb296'; ctx.fillText(`${s.map}${s.room ? ' · ' + s.room : ''}`, x + 18, y + 56);
      ctx.textAlign = 'right'; ctx.fillStyle = '#9a8f7a';
      ctx.fillText(`游戏时间 ${fmtTime(s.time)} · 存档 ${s.saves} 次`, x + w - 18, y + 30);
      ctx.fillText(fmtDate(s.savedAt), x + w - 18, y + 56);
      if (s.state === 'backup') { ctx.fillStyle = '#e0a040'; ctx.fillText('主档损坏，将读取自动备份', x + w - 18, y + 72); }
    }
    if (sel && MENU.confirm === n) { ctx.textAlign = 'right'; ctx.fillStyle = '#ff9a70'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('再按一次覆盖这个存档', x + w - 18, y + 72); }
    if (sel && MENU.confirm === 'del' + n) { ctx.textAlign = 'right'; ctx.fillStyle = '#ff6a50'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('再按一次 Delete 删除（不能恢复）', x + w - 18, y + 72); }
    MENU.rects.push({ x, y, w, h, i });
  }
  const by = y0 + SLOT_COUNT * (h + 12) + 10, sel = MENU.cur === SLOT_COUNT;
  ctx.textAlign = 'center'; ctx.font = sel ? 'bold 18px sans-serif' : '17px sans-serif'; ctx.fillStyle = sel ? '#f0e2b8' : '#8a8070';
  ctx.fillText(sel ? '▸ 返回 ◂' : '返回', W / 2, by + 20);
  MENU.rects.push({ x: W / 2 - 80, y: by, w: 160, h: 30, i: SLOT_COUNT });
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#777';
  ctx.fillText(save ? '↑↓ 选择 · 回车 / E 保存 · Esc 取消' : '↑↓ 选择 · 回车 / E 读取 · Delete 删除 · Esc 返回', W / 2, by + 56);
}

// ---------------------------------------------------------------- 设置
const SETTING_ROWS = [
  { k: 'master', label: '总音量', type: 'vol' },
  { k: 'sfx', label: '音效', type: 'vol' },
  { k: 'ambient', label: '环境音', type: 'vol' },
  { k: 'stereo', label: '声道', type: 'bool', on: '立体声', off: '单声道' },
  { k: 'grain', label: '画面颗粒', type: 'bool', on: '开', off: '关' },
  { k: 'fullscreen', label: '全屏', type: 'bool', on: '开', off: '关' },
  { id: 'keys', label: '操作说明' },
  { id: 'reset', label: '恢复默认' },
  { id: 'back', label: '返回' },
];
function changeSetting(row, dir) {
  if (row.type === 'vol') {
    const v = Math.round(clamp(SETTINGS[row.k] + dir * 0.1, 0, 1) * 10) / 10;
    if (v === SETTINGS[row.k]) return;
    SETTINGS[row.k] = v; applySettings(); if (row.k !== 'ambient') sfx('pickup');  // 试听
  } else if (row.type === 'bool') {
    if (row.k === 'fullscreen') setFullscreen(!SETTINGS.fullscreen);
    else { SETTINGS[row.k] = !SETTINGS[row.k]; applySettings(); }
  }
}
function settingsActivate(i) {
  const row = SETTING_ROWS[i];
  if (row.type === 'bool') changeSetting(row, 1);
  else if (row.id === 'keys') openMenu('keys');
  else if (row.id === 'reset') { const fs = SETTINGS.fullscreen; SETTINGS = { ...SETTINGS_DEFAULT, fullscreen: fs }; applySettings(); sfx('pickup'); }
  else if (row.id === 'back') closeMenu();
}
function settingsKey(e) {
  const n = SETTING_ROWS.length;
  if (e.code === 'Escape') { closeMenu(); return; }
  if (UP.includes(e.code)) MENU.cur = (MENU.cur + n - 1) % n;
  else if (DOWN.includes(e.code)) MENU.cur = (MENU.cur + 1) % n;
  else if (LEFT.includes(e.code)) changeSetting(SETTING_ROWS[MENU.cur], -1);
  else if (RIGHT.includes(e.code)) changeSetting(SETTING_ROWS[MENU.cur], 1);
  else if (OK.includes(e.code)) settingsActivate(MENU.cur);
}
function drawSettings() {
  panelBg();
  ctx.textAlign = 'center'; ctx.font = 'bold 30px serif'; ctx.fillStyle = '#d8c9a0'; ctx.fillText('设 置', W / 2, H * 0.15);

    const y = y0 + i * rh + (row.id ? 14 : 0), sel = i === MENU.cur;
    if (sel) { ctx.fillStyle = 'rgba(90,70,40,0.45)'; ctx.fillRect(x, y, w, rh - 6); }
    ctx.textAlign = 'left'; ctx.font = sel ? 'bold 17px sans-serif' : '16px sans-serif'; ctx.fillStyle = sel ? '#f0e2b8' : '#b0a488';
    ctx.fillText(row.label, x + 16, y + 23);

      const v = SETTINGS[row.k];
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(vx, y + 13, vw - 56, 8);
      ctx.fillStyle = sel ? '#e0c080' : '#9a8a60'; ctx.fillRect(vx, y + 13, (vw - 56) * v, 8);
      ctx.textAlign = 'right'; ctx.fillStyle = '#ddd'; ctx.fillText(`${Math.round(v * 100)}%`, x + w - 16, y + 23);
      MENU.rects.push({ x: vx, y, w: vw - 56, h: rh - 6, i, slider: row.k });
    } else if (row.type === 'bool') {
      ctx.textAlign = 'right'; ctx.fillStyle = SETTINGS[row.k] ? '#9fe08a' : '#aaa';
      ctx.fillText((sel ? '◂ ' : '') + (SETTINGS[row.k] ? row.on : row.off) + (sel ? ' ▸' : ''), x + w - 16, y + 23);
    }
    MENU.rects.push({ x, y, w, h: rh - 6, i });
  });
  ctx.textAlign = 'center'; ctx.font = '13px sans-serif'; ctx.fillStyle = '#777';
  const fy = y0 + SETTING_ROWS.length * rh + 34;
  ctx.fillText('↑↓ 选择 · ←→ 调节 · 回车 切换 · Esc 保存并返回', W / 2, fy);
  ctx.fillText('单声道：只有一个扬声器或单耳耳机时使用。背景音乐还没有，环境音是宅邸里的低鸣和风声。', W / 2, fy + 20);
}

// ---------------------------------------------------------------- 操作说明
const KEY_HELP = [
  ['移动', 'WASD'], ['奔跑（会发出声音）', '按住 左 Shift'], ['瞄准', '按住 右键 / 空格 / K'], ['持续瞄准开关', 'T'],
  ['射击', '左键 / J（瞄准时）'], ['小刀', 'F / V'], ['投掷（手雷 / 闪光弹）', 'G · X 切换'], ['装填（榴弹发射器装着弹时：换弹种）', 'R'], ['调查 · 开关门 · 拾取', 'E'],
  ['快速治疗 / 急救喷雾', 'Q / H'], ['切换武器', '1–5 / 鼠标滚轮'], ['物品栏（C 组合草药 · F 文件页）', 'Tab / I'], ['地图', 'M'],
  ['暂停菜单', 'Esc'], ['全屏', 'F11 / Alt+回车（桌面版）'],
];
function keysKey(e) { if (['Escape', 'Enter', 'KeyE', 'Space'].includes(e.code)) closeMenu(); }
function drawKeys() {
  panelBg();
  ctx.textAlign = 'center'; ctx.font = 'bold 30px serif'; ctx.fillStyle = '#d8c9a0'; ctx.fillText('操作说明', W / 2, H * 0.14);
  const w = Math.min(560, W - 80), x = W / 2 - w / 2, y0 = H * 0.2, rh = Math.min(30, (H * 0.68) / KEY_HELP.length);
  KEY_HELP.forEach(([a, k], i) => {
    const y = y0 + i * rh;
    ctx.textAlign = 'left'; ctx.font = '15px sans-serif'; ctx.fillStyle = '#b0a488'; ctx.fillText(a, x + 16, y + 20);
    ctx.textAlign = 'right'; ctx.fillStyle = '#eadcb0'; ctx.fillText(k, x + w - 16, y + 20);
  });

    ctx.font = '12px sans-serif';

  else if (mode === 'settings') drawSettings();

// 鼠标：悬停移动光标，点击执行；设置里点音量条直接设到点击的位置
const hitRect = (x, y) => { for (let k = 0; k < MENU.rects.length; k++) { const r = MENU.rects[k];  /* 音量条排在所在行前面，优先命中 */ if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; } return null; };

function menuHover(x, y) { const r = hitRect(x, y); if (r && mode !== 'keys') { const before = mode === 'title' ? MENU.titleCur : mode === 'pause' ? MENU.pauseCur : MENU.cur; if (before !== r.i) { setCur(r.i); if (mode === 'slots') MENU.confirm = null; } } }

  else if (mode === 'slots') slotsActivate(r.i);

<script>/* ui/inventory.js */
'use strict';
// 物品栏界面（打开时游戏暂停）。背包不限格数，格子多了就滚动（滚轮 / 方向键）
// 物品栏分两页，F 切换（也可以点页签）：
//   物品：方向键 / WASD 移动，E / 回车 使用或装备，C 组合草药，Q 快速治疗
//   文件：拿到过的全部文件，↑↓ 选择、←→ 翻页、滚轮滚动，E / 回车 阅读全文（读完回到这一页）
//   Tab / Esc 关闭。以前文件只能按数字键 1–9 打开，第 10 份起就打不开了。

const INV_COLS = INV_ROW;   // 一行几格（config/items.js）
let uiRects = []; // 本帧可点击的区域：{ x, y, w, h, side, i }

function openInventory() { mode = 'inv'; P.invSel = -1; P.invCur = clamp(P.invCur || 0, 0, inv().size - 1); setInvTab(P.invTab || 'items'); }
function setInvTab(t) { P.invTab = t === 'files' ? 'files' : 'items'; P.fileCur = clamp(P.fileCur || 0, 0, Math.max(0, S.p.files.length - 1)); }
// 文件来自哪张地图：地图 2 的文件编号是 m2f…，地图 3 是 m3f…，其余是地图 1
function fileMapName(id) { return id.startsWith('m3') ? '制药厂' : id.startsWith('m2') ? '研究所' : '宅邸'; }
function moveFileCursor(d, wrap) {
  const n = S.p.files.length; if (!n) return;
  const c = (P.fileCur || 0) + d;
  P.fileCur = wrap ? (c + n) % n : clamp(c, 0, n - 1);
}
function filesKey(e) {
  const d = keyDir(e.code), page = Math.max(1, (P.fileRows || 10) - 1);
  switch (e.code) {
    case 'Escape': case 'Tab': case 'KeyI': mode = 'play'; return;
    case 'KeyE': case 'Enter': case 'Space': if (S.p.files.length) openFile(S.p.files[P.fileCur], 'inv'); return;
    case 'PageUp': moveFileCursor(-page); return;
    case 'PageDown': moveFileCursor(page); return;
    case 'Home': P.fileCur = 0; return;
    case 'End': P.fileCur = Math.max(0, S.p.files.length - 1); return;
    case 'KeyQ': quickHeal(); return;
  }
  if (d) { if (d[1]) moveFileCursor(d[1], true); else moveFileCursor(d[0] * page); }
}
// 滚轮：文件页上下移动，物品页上下换行
function invWheel(dir) { if (P.invTab === 'files') moveFileCursor(dir); else moveGridCursor(0, dir); }

function moveGridCursor(dx, dy) {
  const n = inv().size, c = P.invCur;
  let x = c % INV_COLS + dx, y = Math.floor(c / INV_COLS) + dy;
  const rows = Math.ceil(n / INV_COLS);
  y = (y + rows) % rows; x = (x + INV_COLS) % INV_COLS;
  P.invCur = Math.min(n - 1, y * INV_COLS + x);
}
function keyDir(code) {
  return ({ ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] })[code] || null;
}

function invKey(e) {
  if (e.code === 'KeyF' && P.invSel < 0) { setInvTab(P.invTab === 'files' ? 'items' : 'files'); return; }
  if (P.invTab === 'files') { filesKey(e); return; }

  if (d) { moveGridCursor(d[0], d[1]); return; }

  switch (e.code) {
    case 'Escape': if (P.invSel >= 0) { P.invSel = -1; msg('取消组合。', 1.5); } else mode = 'play'; return;
    case 'Tab': case 'KeyI': mode = 'play'; return;

      if (P.invSel >= 0) { combineSlots(P.invSel, P.invCur); P.invSel = -1; } else useSlot(P.invCur);
      return;
    case 'KeyC':
      if (P.invSel >= 0) { combineSlots(P.invSel, P.invCur); P.invSel = -1; }
      else if (s && ITEMS[s.id].kind === 'herb') { P.invSel = P.invCur; msg('选择要组合的另一株草药，再按 C 或 E。', 3); }
      else msg('只有草药可以组合。', 1.8);
      return;
    case 'KeyQ': quickHeal(); return;
  }
}

// 鼠标：点一下选中，再点一下同一个 = 按 E
function invClick(mx, my) {
  const r = uiRects.find(r => mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h);
  if (!r) return;
  if (r.side === 'tab') { setInvTab(r.i); return; }
  if (r.side === 'file') { const again = P.fileCur === r.i; P.fileCur = r.i; if (again) openFile(S.p.files[r.i], 'inv'); return; }
  const again = P.invCur === r.i;
  P.invCur = r.i;
  if (again) invKey({ code: 'KeyE', key: 'e' });
}

// ---------------------------------------------------------------- 绘制
function drawItemIcon(id, cx, cy, s = 1) {
  const d = ITEMS[id];
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  if (d.kind === 'weapon') {
    ctx.fillStyle = '#1a1a1a';
    if (id === 'shotgun') { ctx.fillStyle = '#4a3218'; ctx.fillRect(-24, -3, 14, 7); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-10, -3, 34, 5); ctx.fillStyle = '#5a3a1a'; ctx.fillRect(2, 2, 10, 5); }
    else { ctx.fillRect(-12, -6, 24, 7); ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-10, 0, 7, 11); ctx.fillStyle = d.col; ctx.fillRect(-12, -6, 24, 2); }
  } else if (d.kind === 'throw') {
    ctx.scale(1.2, 1.2); drawThrowIcon(ctx, id);
  } else if (d.kind === 'ammo') {
    ctx.fillStyle = id === 'ammo_shotgun' ? '#6b1a18' : id === 'ammo_smg' ? '#2a3a4a' : id === 'ammo_magnum' ? '#3a2a14' : '#5d4b22'; ctx.fillRect(-13, -9, 26, 18);
    ctx.fillStyle = d.col; for (let i = 0; i < 5; i++) ctx.fillRect(-11 + i * 5, -7, 3, 6);
    ctx.fillStyle = '#eee'; ctx.fillRect(-11, 3, 22, 2);
  } else if (d.kind === 'herb') {
    const cols = id === 'mix_grb' ? ['#5fd06a', '#d05050', '#4f9bd0'] : id === 'mix_gr' ? ['#5fd06a', '#d05050'] : id === 'mix_gb' ? ['#5fd06a', '#4f9bd0'] : id === 'mix_gg' ? ['#5fd06a', '#3fa04a'] : [d.col];
    if (id.startsWith('mix')) { ctx.fillStyle = 'rgba(220,220,200,0.25)'; ctx.fillRect(-10, -12, 20, 24); ctx.strokeStyle = '#ccc'; ctx.strokeRect(-10, -12, 20, 24); }
    cols.forEach((c, k) => { ctx.fillStyle = c; for (let i = 0; i < 5; i++) { ctx.save(); ctx.translate((k - (cols.length - 1) / 2) * 6, 0); ctx.rotate(i * 1.26); ctx.beginPath(); ctx.ellipse(6, 0, 7, 3.2, 0, 0, 7); ctx.fill(); ctx.restore(); } });
  } else if (id === 'spray') {

// 背包格子。不限格数：放不下时只画能放下的几行，跟着光标滚动（滚轮 / 方向键），右边有滚动条。返回占用的高度
function drawInvGrid(x, y, cell, maxRows) {
  const v = inv(), gap = 8, n = v.size, rows = Math.ceil(n / INV_COLS), vis = Math.max(1, Math.min(rows, maxRows));
  P.invCur = clamp(P.invCur || 0, 0, n - 1);
  const cur = Math.floor(P.invCur / INV_COLS);

  if (cur < top) top = cur;
  if (cur >= top + vis) top = cur - vis + 1;

  for (let r = 0; r < vis; r++) for (let c = 0; c < INV_COLS; c++) {
    const i = (top + r) * INV_COLS + c; if (i >= n) break;
    const cx = x + c * (cell + gap), cy = y + r * (cell + gap), s = v.slots[i];
    ctx.fillStyle = 'rgba(30,24,18,0.9)'; ctx.fillRect(cx, cy, cell, cell);

      ctx.fillText(ITEMS[s.id].short, cx + cell / 2, cy + cell - 9);
      if (ITEMS[s.id].max > 1) { ctx.textAlign = 'right'; ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(s.n, cx + cell - 6, cy + 16); }
      if (ITEMS[s.id].kind === 'weapon' && S.p.wep === s.id) { ctx.textAlign = 'left'; ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = '#ffe9a0'; ctx.fillText('装备', cx + 5, cy + 15); }
    }
    if (P.invSel === i) { ctx.strokeStyle = '#e8a040'; ctx.lineWidth = 3; ctx.strokeRect(cx + 2, cy + 2, cell - 4, cell - 4); }
    if (P.invCur === i) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(cx - 2, cy - 2, cell + 4, cell + 4); }

    const bx = x + INV_COLS * (cell + gap) - 2, th = Math.max(16, (h - gap) * vis / rows), ty = y + (h - gap - th) * top / (rows - vis);
    ctx.fillStyle = 'rgba(107,90,58,0.25)'; ctx.fillRect(bx, y, 4, h - gap);

  }

function itemDescription(id) {
  const d = ITEMS[id];
  if (d.kind === 'weapon') return `装弹 ${S.p.mag[id] || 0}，备弹 ${ammoCount(id)}。E 装备。`;
  if (d.kind === 'ammo' && d.weapon === 'gl') return `一格最多 ${d.max} 发。榴弹发射器装着弹时按 R 换成下一种弹。${d === ITEMS.ammo_acid ? '腐蚀 8 秒：之后受到的伤害 ×1.5。' : d === ITEMS.ammo_bomb ? '大范围爆炸，别贴脸打。' : '留下一片火场，蔓生体怕火。'}`;
  if (d.kind === 'ammo') return `一格最多 ${d.max} 发。装备对应武器后按 R 装填。`;

function drawInventory() {

  const rows = Math.ceil(inv().size / INV_COLS), showRows = clamp(rows, 4, 6);

  drawInvGrid(x + 30, y + 66, cell, Math.max(2, Math.floor((h - 150) / (cell + 8))));
  // 右侧：说明、关键道具、文件
  const fx = x + 30 + INV_COLS * (cell + 8) + 24, fw = x + w - 30 - fx; let fy = y + 80;
  const s = inv().slots[P.invCur];
  ctx.textAlign = 'left';
  if (s) {
    ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = ITEMS[s.id].col; ctx.fillText(ITEMS[s.id].name + (ITEMS[s.id].max > 1 ? `  ×${s.n}` : ''), fx, fy); fy += 24;
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#ccc'; fy = wrapText(itemDescription(s.id), fx, fy, fw, 20) + 8;

  fy += 6; ctx.font = '14px sans-serif'; ctx.fillStyle = '#8a7a5a'; ctx.fillText('— 关键道具（不占格子）—', fx, fy); fy += 24;

  if (!ks.length) { ctx.fillStyle = '#666'; ctx.fillText('（无）', fx, fy); fy += 24; }
  else ks.forEach(k => { ctx.fillStyle = KEYS[k].col; ctx.fillText('◆ ' + KEYS[k].name, fx, fy); fy += 22; });

  ctx.fillText(P.invSel >= 0 ? '选择另一株草药 → C / E 组合 · Esc 取消' : '方向键 / WASD 选择 · E 使用或装备 · C 组合草药 · Q 快速治疗 · F 文件 · 鼠标点两下 = 使用 · Tab / Esc 关闭', W / 2, y + h - 18);

// 页签：物品 / 文件（点击也能切换）
function drawInvTabs(x, y) {
  const tabs = [['items', '物 品'], ['files', `文 件（${S.p.files.length}）`]];
  ctx.textAlign = 'left'; ctx.font = 'bold 22px serif';
  for (const [id, label] of tabs) {
    const on = (P.invTab || 'items') === id, tw = ctx.measureText(label).width;
    ctx.fillStyle = on ? '#e8d9a8' : '#6a5a40'; ctx.fillText(label, x, y);
    if (on) { ctx.fillStyle = '#b08a4a'; ctx.fillRect(x, y + 7, tw, 2); }
    uiRects.push({ x: x - 6, y: y - 26, w: tw + 12, h: 38, side: 'tab', i: id });
    x += tw + 34;
  }
  return x;
}

// 文件页：左边列表（按拿到的顺序，标出来自哪张地图），右边预览；E 阅读全文
function drawFilesPage(x, y, w, h) {
  const files = S.p.files, n = files.length;
  const lx = x + 30, ly = y + 84, lw = Math.min(380, Math.floor((w - 60) * 0.48)), rowH = 30;
  const rows = Math.max(3, Math.floor((h - 164) / rowH)); P.fileRows = rows;
  ctx.textAlign = 'left'; ctx.font = '14px sans-serif';
  if (!n) {
    ctx.fillStyle = '#666'; ctx.fillText('还没有拿到文件。在地图上找到的日记、便条、报告都会收在这里，随时可以重读。', lx, ly + 20);
  } else {
    P.fileCur = clamp(P.fileCur || 0, 0, n - 1);
    let top = clamp(P.fileTop || 0, 0, Math.max(0, n - rows));
    if (P.fileCur < top) top = P.fileCur;
    if (P.fileCur >= top + rows) top = P.fileCur - rows + 1;
    P.fileTop = top;
    for (let k = 0; k < rows && top + k < n; k++) {
      const i = top + k, id = files[i], ry = ly + k * rowH, sel = i === P.fileCur;
      ctx.fillStyle = sel ? 'rgba(200,180,120,0.18)' : 'rgba(30,24,18,0.7)'; ctx.fillRect(lx, ry, lw, rowH - 4);
      if (sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(lx + .5, ry + .5, lw - 1, rowH - 5); }
      ctx.textAlign = 'left'; ctx.fillStyle = '#8a7a5a'; ctx.fillText(`${i + 1}.`, lx + 8, ry + 18);
      ctx.fillStyle = sel ? '#fff4d8' : '#e4d9bd'; ctx.fillText(FILES[id].title, lx + 40, ry + 18);
      ctx.textAlign = 'right'; ctx.fillStyle = '#6a5a40'; ctx.fillText(fileMapName(id), lx + lw - 8, ry + 18);
      uiRects.push({ x: lx, y: ry, w: lw, h: rowH - 4, side: 'file', i });
    }
    ctx.textAlign = 'center'; ctx.fillStyle = '#8a7a5a'; ctx.font = '12px sans-serif';
    if (top > 0) ctx.fillText(`▲ 上面还有 ${top} 份`, lx + lw / 2, ly - 8);
    if (top + rows < n) ctx.fillText(`▼ 下面还有 ${n - top - rows} 份`, lx + lw / 2, ly + rows * rowH + 10);
    // 预览：标题、来源，正文超出部分裁掉（E 看全文）
    const f = FILES[files[P.fileCur]], px = lx + lw + 26, pw = x + w - 30 - px, ph = rows * rowH - 30;
    ctx.textAlign = 'left'; ctx.font = 'bold 17px serif'; ctx.fillStyle = '#e8d9a8'; ctx.fillText(f.title, px, ly + 18);
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#6a5a40'; ctx.fillText(`${fileMapName(files[P.fileCur])} · 第 ${P.fileCur + 1} / ${n} 份`, px, ly + 38);
    ctx.save(); ctx.beginPath(); ctx.rect(px, ly + 48, pw, ph - 20); ctx.clip();
    ctx.font = '14px serif'; ctx.fillStyle = '#bdb29a'; wrapText(f.body, px, ly + 68, pw, 21);
    ctx.restore();
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#b08a4a'; ctx.fillText('E / 回车 阅读全文', px, ly + ph + 14);
  }
  drawLastMsg(x + 30, y + h - 46);
  ctx.textAlign = 'center'; ctx.fillStyle = '#6a5a40'; ctx.font = '13px sans-serif';
  ctx.fillText('↑↓ 选择 · ←→ 翻页 · 滚轮滚动 · E / 回车 阅读 · 鼠标点两下 = 阅读 · F 回到物品 · Tab / Esc 关闭', W / 2, y + h - 18);
}
</script>
<script>/* main.js */
'use strict';
// 主循环与启动

// ---------------------------------------------------------------- 主循环
let last = performance.now(), titleT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  perfSample(dt);
  modeT += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 标题画面，以及从标题打开的读档 / 设置 / 操作说明
  if (mode === 'title' || menuOverTitle()) { titleT += dt; drawTitle(titleT); if (mode === 'title') drawTitleMenu(); else drawMenu(); drawCrosshair(); requestAnimationFrame(frame); return; }
  if (mode === 'intro') updateIntro(dt);
  else if (mode === 'play') update(dt);
  else if (mode === 'loading') updateLoading(dt);  // 切换地图：淡出 → 读取画面 → 淡入
  else if (mode === 'dead' || mode === 'win') { // 背景继续少量更新
    for (const e of S.enemies) if (e.dead) e.deadT += dt;
    parts.forEach(q => { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; }); parts = parts.filter(q => q.life > 0);
    S.time += mode === 'win' ? 0 : 0;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  renderWorld();
  renderDarkness();
  renderOverWorld();
  drawPost();
  if (mode === 'intro') { drawIntro(); requestAnimationFrame(frame); return; }
  if (mode === 'loading') drawLoading();
  if (mode === 'play' || mode === 'pause') drawHUD();
  if (mode === 'play' || mode === 'pause') drawPlaytestBadge();   // 试玩版角标（发布版不画）
  drawPerf();                                                     // 帧率叠层（按 P 开关）
  if (mode === 'file') drawFile();
  else if (mode === 'inv') drawInventory();
  else if (mode === 'map') drawMap();
  else if (mode === 'safe') drawSafe(dt);
  else if (mode === 'dead') drawDead();
  else if (mode === 'win') drawWin();
  else if (mode === 'pause') drawPause();
  else if (isMenuMode(mode)) drawMenu();  // 游戏中打开的存档槽 / 设置 / 操作说明
  drawCrosshair();
  requestAnimationFrame(frame);
}
resize();
buildMap(); renderMap(); refreshSlots();
booted = true;   // 从这里开始才处理键盘 / 鼠标（见 game/globals.js）
requestAnimationFrame(frame);
</script>
